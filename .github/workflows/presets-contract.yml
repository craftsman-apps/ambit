name: presets-contract
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch: {}
permissions: { contents: read, issues: write }
concurrency: { group: presets-contract, cancel-in-progress: false }
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: last-contract.json, key: "presets-contract-${{ github.run_id }}", restore-keys: "presets-contract-" }
      - run: go run ./cmd/presetcheck contract --json contract.json || true
      - name: Open an issue for presets failing two nights in a row
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          now = json.load(open("contract.json"))
          before = json.load(open("last-contract.json")) if os.path.exists("last-contract.json") else {}
          for pid, probs in now.items():
              if probs and before.get(pid):
                  title = f"Preset contract failing: {pid}"
                  found = subprocess.run(["gh","issue","list","--search",f'in:title "{title}"',"--state","open","--json","number"], capture_output=True, text=True, check=True).stdout
                  if json.loads(found or "[]"):
                      continue
                  subprocess.run(["gh","issue","create","--title",title,"--body","\n".join(probs)], check=True)
          EOF
          cp contract.json last-contract.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: last-contract.json, key: "presets-contract-${{ github.run_id }}" }
