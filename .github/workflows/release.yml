name: release
on:
  push: { tags: ["v*"] }
# Each job asks for its own permissions (spec 6); nothing is granted workflow-wide.
permissions: {}

jobs:
  # The image, the charts and the GitHub release with the quick-start files. The preset gate stays first: nothing
  # is published when it fails.
  publish:
    runs-on: ubuntu-latest
    # contents: the GitHub release and its files. id-token: keyless cosign signatures of the image (Sigstore).
    permissions: { contents: write, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Preset live results (make preset-live) are fresh and complete
        run: go run ./cmd/presetcheck gate
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Console and controller image (amd64 + arm64)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ambit-console:${{ steps.v.outputs.version }}
          # The source label links the package to this repository on GHCR. The image index (the multi-platform
          # tag) needs the same keys as annotations; the labels sit in each platform image.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ steps.v.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          # Journey S6: an SBOM and build provenance travel with every image in the registry.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with: { cosign-release: v3.1.3 }
      # Keyless: the signature is bound to this workflow's GitHub OIDC identity and logged in Sigstore's public
      # transparency log (Rekor). Signed by digest, so the signature covers exactly the image index pushed above.
      # docs/compliance.md (Supply chain) has the cosign verify command.
      - name: Sign the image (cosign, keyless)
        env: { DIGEST: "${{ steps.image.outputs.digest }}" }
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/ambit-console@${DIGEST}"
      - name: Charts to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm dependency update charts/ambit
          for c in ambit-crds ambit; do
            helm package charts/$c --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}" -d /tmp/charts
            helm push /tmp/charts/$c-${{ steps.v.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          done
      # The quick start downloads these from the release, so it needs no clone of the repository.
      - name: GitHub release with the quick-start files
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p /tmp/assets
          cp kind/cluster.yaml /tmp/assets/kind-cluster.yaml
          cp deploy/quickstart.yaml /tmp/assets/quickstart.yaml
          # Gateway API, agentgateway and ToolHive CRDs, which neither chart installs.
          for f in deploy/crds/*.yaml; do cat "$f"; printf '\n---\n'; done > /tmp/assets/crds.yaml
          # A tag with a '-' (v0.2.0-rc.1) is a prerelease: marked so on GitHub, and not sent to Homebrew or npm.
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          # Not the latest release yet: the cli job marks it latest after it has uploaded the CLI archives, so
          # install.sh and install.ps1 never find a latest release without them.
          gh release create "$GITHUB_REF_NAME" /tmp/assets/* --title "$GITHUB_REF_NAME" --generate-notes --latest=false $pre

  # The ambit CLI archives on the same release, with build provenance for each archive (gh attestation verify).
  # This job also marks the release as the latest, once the archives are uploaded and attested.
  cli:
    needs: publish
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    outputs: { highest: "${{ steps.highest.outputs.highest }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: { distribution: goreleaser, version: v2.18.3, args: release --clean }
        # The pushed tag, not the one GoReleaser would pick: a release candidate and its release can share a commit
        # (v0.2.0-rc.1 and v0.2.0 did), and GoReleaser then took the candidate's tag for both.
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GORELEASER_CURRENT_TAG: "${{ github.ref_name }}" }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/ambit_*.tar.gz, dist/ambit_*.zip, dist/checksums.txt" }
      # A re-run of the workflow of an older stable tag must not make that tag the latest again, nor send an old
      # version to the channels (#108 W2). Prerelease tags are never the highest.
      - name: Is this the highest stable tag?
        id: highest
        run: |
          git tag -l 'v*' | .github/scripts/highest-tag.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - name: Not the highest stable tag
        if: ${{ !contains(github.ref_name, '-') && steps.highest.outputs.highest != 'true' }}
        run: echo "::notice::${GITHUB_REF_NAME} is not the highest stable tag; it is not marked latest, and the cli-channels job is skipped."
      # The archives, checksums.txt and their attestations are on the release now. A prerelease is never the latest release.
      - name: Mark the release as the latest
        if: ${{ !contains(github.ref_name, '-') && steps.highest.outputs.highest == 'true' }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        # Only a release that holds every archive and checksums.txt becomes the latest; install.sh downloads from it.
        run: |
          n=$(gh release view "$GITHUB_REF_NAME" --json assets -q '[.assets[].name | select(test("^ambit_.*\\.(tar\\.gz|zip)$") or . == "checksums.txt")] | length')
          [ "$n" -eq 7 ] || { echo "::error::release $GITHUB_REF_NAME has $n of the 7 CLI files; not marking it latest"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --latest
      - name: Prerelease tags go to GitHub only
        if: ${{ contains(github.ref_name, '-') }}
        run: |
          echo "::notice::${GITHUB_REF_NAME} is a prerelease (the tag has a '-'): no Homebrew formula, and the cli-channels job (Homebrew and npm) is skipped."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !contains(github.ref_name, '-') }}
        with: { node-version: 26 }
      # The formula installs the prebuilt binary from this release's archives, pinned by sha256 (ruling S6). This only
      # checks that the script works on this release; cli-channels writes the formula it pushes from the published
      # checksums.txt, so a re-run of either job cannot pair a formula with archives from another attempt.
      - name: The Homebrew formula can be written from this release's checksums.txt
        if: ${{ !contains(github.ref_name, '-') }}
        run: node scripts/homebrew/formula.mjs --checksums dist/checksums.txt --version "${GITHUB_REF_NAME#v}" --out "$RUNNER_TEMP/ambit.rb"

  # Homebrew (a formula), npm, Scoop and winget. Runs in the Environment release-channels, so a maintainer approves each release first. A
  # failure here does not undo the GitHub release; both steps are safe to re-run (the job can be re-run alone).
  cli-channels:
    needs: cli
    # Prerelease tags (a '-' in the tag) and stable tags below the highest one (a re-run of an old release) are not
    # published to Homebrew, npm, Scoop or winget; the cli job logs that.
    if: ${{ !contains(github.ref_name, '-') && needs.cli.outputs.highest == 'true' }}
    runs-on: ubuntu-latest
    environment: release-channels
    permissions: { contents: read, id-token: write }  # id-token: npm trusted publishing with provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, registry-url: "https://registry.npmjs.org" }
      - name: The release's archives and checksums.txt, as published
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "$GITHUB_REF_NAME" -p 'ambit_*' -p checksums.txt -D rel
      # A SHA-256 is only as good as the checksums.txt it is read from (spec D2 5.4). The cli job attested checksums.txt;
      # this proves that the file was made by this repository's release workflow, before any channel is written from it.
      - name: checksums.txt was made by this repository's release workflow (build provenance)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh attestation verify rel/checksums.txt --repo craftsman-apps/ambit \
            --signer-workflow craftsman-apps/ambit/.github/workflows/release.yml
      # Every downloaded archive must match the release's checksums.txt before anything is published from it,
      # and all six archives must be there (the formula pins four, npm uses six).
      - name: The downloaded archives match checksums.txt
        id: verify
        run: |
          cd rel
          [ "$(find . -name 'ambit_*' | wc -l)" -eq 6 ]
          sha256sum --check --strict checksums.txt
      # The formula comes from the checksums.txt the previous step verified against the downloaded archives, and pins
      # four of them by sha256. (A formula passed from the cli job was stale after a re-run of cli at v0.2.0.)
      - name: The Homebrew formula, from the published checksums.txt
        run: |
          node scripts/homebrew/formula.mjs --checksums rel/checksums.txt --version "${GITHUB_REF_NAME#v}" --out formula/ambit.rb
          [ "$(grep -cE '^ +sha256 "[0-9a-f]{64}"$' formula/ambit.rb)" = 4 ]
      - name: Homebrew tap (craftsman-apps/homebrew-tap)
        env: { TAP_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}" }  # fine-grained, contents:write on that repository only
        # The token goes in an HTTP header set through environment variables, so it is never in a URL or in .git/config.
        run: |
          echo "::add-mask::$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git clone --depth 1 https://github.com/craftsman-apps/homebrew-tap.git tap
          mkdir -p tap/Formula && cp formula/ambit.rb tap/Formula/ambit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ambit.rb
          git diff --cached --quiet || { git commit -m "ambit ${GITHUB_REF_NAME}" && git push; }
      # Trusted publishing (#148) exchanges this job's GitHub OIDC token for a short-lived npm token, and needs npm
      # 11.5.1 or newer.
      - name: npm is 11.5.1 or newer (trusted publishing)
        run: |
          v=$(npm --version); echo "npm $v"
          printf '11.5.1\n%s\n' "$v" | sort -V -C || { echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"; exit 1; }
      - name: npm (@craftsman-apps/ambit and one package per platform)
        # Runs even when the tap step failed (both are safe to re-run), but never from archives that failed verification.
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        # npm first tries trusted publishing: each package names craftsman-apps/ambit, release.yml and the Environment
        # release-channels as its trusted publisher on npmjs.com. npm uses NODE_AUTH_TOKEN only when that fails.
        # NPM_TOKEN (a granular token on @craftsman-apps, in release-channels) stays as that fallback until one release
        # has published through trusted publishing; then delete it (docs/maintainers/release-checklist.md).
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: node scripts/npm/publish.mjs --dir rel --version "${GITHUB_REF_NAME#v}" --out npm-out --publish
      # Scoop (spec D2 8.2): the manifest from the verified checksums.txt, pushed to the bucket craftsman-apps/scoop-ambit.
      # Skipped, with a notice and before anything else, until the bucket and its token exist (owner actions O1 and O2);
      # .github/scripts/release-skip_test.sh runs the skip paths.
      - name: Scoop bucket (craftsman-apps/scoop-ambit)
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env: { BUCKET_TOKEN: "${{ secrets.SCOOP_BUCKET_TOKEN }}" }  # fine-grained, contents:write on that repository only
        run: |
          if [ -z "$BUCKET_TOKEN" ]; then echo "::notice::SCOOP_BUCKET_TOKEN is not set: Scoop skipped (owner actions O1, O2)"; exit 0; fi
          node scripts/scoop/manifest.mjs --checksums rel/checksums.txt --version "${GITHUB_REF_NAME#v}" --out scoop/ambit.json
          echo "::add-mask::$(printf 'x-access-token:%s' "$BUCKET_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$BUCKET_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git clone --depth 1 https://github.com/craftsman-apps/scoop-ambit.git bucket
          mkdir -p bucket/bucket && cp scoop/ambit.json bucket/bucket/ambit.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/ambit.json
          git diff --cached --quiet || { git commit -m "ambit ${GITHUB_REF_NAME}" && git push; }
      # winget (spec D2 8.3): Komac, pinned by version and SHA-256, opens a pull request in microsoft/winget-pkgs from
      # the fork of WINGET_TOKEN's bot account (owner action O4). Skipped, with a notice, until the token exists and
      # the first version is merged (owner action O3, .github/workflows/winget-first.yml). The release does not wait
      # for Microsoft's review.
      - name: winget pull request (Komac)
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env: { GITHUB_TOKEN: "${{ secrets.WINGET_TOKEN }}" }  # classic public_repo token of the bot account; read by Komac
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then echo "::notice::WINGET_TOKEN is not set: winget skipped (owner action O4)"; exit 0; fi
          if [ "$(curl -s -o /dev/null -w '%{http_code}' https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/c/CraftsmanApps/Ambit)" != 200 ]; then
            echo "::notice::CraftsmanApps.Ambit is not in microsoft/winget-pkgs yet: run the winget-first workflow (owner action O3)"; exit 0
          fi
          v=2.17.2; d="$RUNNER_TEMP/komac"; mkdir -p "$d"
          curl -fsSL "https://github.com/russellbanks/Komac/releases/download/v$v/komac-$v-x86_64-unknown-linux-gnu.tar.gz" -o "$d/komac.tgz"
          echo "b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966  $d/komac.tgz" | sha256sum --check --strict
          tar xzf "$d/komac.tgz" -C "$d"
          R="https://github.com/craftsman-apps/ambit/releases/download/$GITHUB_REF_NAME"
          "$(find "$d" -type f -name komac | head -1)" update CraftsmanApps.Ambit --version "${GITHUB_REF_NAME#v}" \
            --urls "$R/ambit_windows_amd64.zip" "$R/ambit_windows_arm64.zip" --submit

  # The Windows channels on a Windows machine (in place of a hand test; the owner has no Windows machine): the
  # release zip, install.ps1, scoop install from the bucket, and winget validate of the manifests.
  cli-windows:
    needs: cli-channels
    if: ${{ !cancelled() && needs.cli-channels.result == 'success' }}
    runs-on: windows-latest
    permissions: { contents: read }
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - name: The zip from the release, checked against checksums.txt and its attestation, runs
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:GITHUB_REF_NAME -p ambit_windows_amd64.zip -p checksums.txt -D rel
          gh attestation verify rel/ambit_windows_amd64.zip --repo craftsman-apps/ambit --signer-workflow craftsman-apps/ambit/.github/workflows/release.yml
          $want = (Select-String -Path rel/checksums.txt -Pattern ' ambit_windows_amd64.zip$').Line.Split(' ')[0]
          $got = (Get-FileHash rel/ambit_windows_amd64.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "SHA-256 $got, checksums.txt says $want" }
          Expand-Archive rel/ambit_windows_amd64.zip -DestinationPath zip
          $v = & zip/ambit.exe version --kubeconfig NUL
          if (-not ($v -match [regex]::Escape("ambit $($env:GITHUB_REF_NAME.TrimStart('v'))"))) { throw "zip: $v" }
      - name: install.ps1 installs the release
        run: |
          $ErrorActionPreference = 'Stop'
          irm https://ambitproject.dev/install.ps1 | iex
          $exe = (Get-Command ambit -ErrorAction SilentlyContinue).Source
          if (-not $exe) { $exe = Join-Path $env:LOCALAPPDATA 'ambit\bin\ambit.exe' }
          $v = & $exe version --kubeconfig NUL
          if (-not ($v -match [regex]::Escape("ambit $($env:GITHUB_REF_NAME.TrimStart('v'))"))) { throw "install.ps1: $v" }
      # Skipped, with a notice, until the bucket holds the manifest of this version (owner actions O1 and O2; the
      # Scoop step of cli-channels writes it). .github/scripts/release-skip_test.sh runs the skip path.
      - name: scoop install ambit/ambit (skipped until the bucket has this version, owner actions O1, O2)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $ErrorActionPreference = 'Stop'
          $want = $env:GITHUB_REF_NAME.TrimStart('v')
          try {
            $f = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/craftsman-apps/scoop-ambit/contents/bucket/ambit.json
            $have = ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($f.content)) | ConvertFrom-Json).version
          } catch { $have = $null }
          if ($have -ne $want) {
            Write-Output "::notice::craftsman-apps/scoop-ambit has no bucket/ambit.json of version $want (found: $(if ($have) { $have } else { 'none' })): scoop install skipped (owner actions O1, O2)"
            exit 0
          }
          irm get.scoop.sh -OutFile scoop-install.ps1
          ./scoop-install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add ambit https://github.com/craftsman-apps/scoop-ambit
          scoop install ambit/ambit
          $v = ambit version --kubeconfig NUL
          if (-not ($v -match [regex]::Escape("ambit $($env:GITHUB_REF_NAME.TrimStart('v'))"))) { throw "scoop: $v" }
      - name: winget validate of the manifests (when winget is on the runner image)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/winget/manifest.mjs --checksums rel/checksums.txt --version $env:GITHUB_REF_NAME.TrimStart('v') --out winget
          if (Get-Command winget -ErrorAction SilentlyContinue) { winget validate --manifest winget } else { Write-Output "::notice::winget is not on this runner image: validate skipped" }
