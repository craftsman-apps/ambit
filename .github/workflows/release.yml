name: release
on:
  push: { tags: ["v*"] }
# Each job asks for its own permissions (spec 6); nothing is granted workflow-wide.
permissions: {}

jobs:
  # The image, the charts and the GitHub release with the quick-start files. The preset gate stays first: nothing
  # is published when it fails.
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }  # contents: the GitHub release and its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Preset live results (make preset-live) are fresh and complete
        run: go run ./cmd/presetcheck gate
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Console and controller image (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ambit-console:${{ steps.v.outputs.version }}
          # The source label links the package to this repository on GHCR. The image index (the multi-platform
          # tag) needs the same keys as annotations; the labels sit in each platform image.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ steps.v.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          # Journey S6: an SBOM and build provenance travel with every image in the registry.
          sbom: true
          provenance: mode=max
      - name: Charts to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm dependency update charts/ambit
          for c in ambit-crds ambit; do
            helm package charts/$c --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}" -d /tmp/charts
            helm push /tmp/charts/$c-${{ steps.v.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          done
      # The quick start downloads these from the release, so it needs no clone of the repository.
      - name: GitHub release with the quick-start files
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p /tmp/assets
          cp kind/cluster.yaml /tmp/assets/kind-cluster.yaml
          cp deploy/quickstart.yaml /tmp/assets/quickstart.yaml
          # Gateway API, agentgateway and ToolHive CRDs, which neither chart installs.
          for f in deploy/crds/*.yaml; do cat "$f"; printf '\n---\n'; done > /tmp/assets/crds.yaml
          # A tag with a '-' (v0.2.0-rc.1) is a prerelease: marked so on GitHub, and not sent to Homebrew or npm.
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          # Not the latest release yet: the cli job marks it latest after it has uploaded the CLI archives, so
          # install.sh and install.ps1 never find a latest release without them.
          gh release create "$GITHUB_REF_NAME" /tmp/assets/* --title "$GITHUB_REF_NAME" --generate-notes --latest=false $pre

  # The ambit CLI archives on the same release, with build provenance for each archive (gh attestation verify).
  # This job also marks the release as the latest, once the archives are uploaded.
  cli:
    needs: publish
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: { distribution: goreleaser, version: v2.18.3, args: release --clean }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      # The archives and checksums.txt are on the release now. A prerelease is never the latest release.
      - name: Mark the release as the latest
        if: ${{ !contains(github.ref_name, '-') }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release edit "$GITHUB_REF_NAME" --latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/ambit_*.tar.gz, dist/ambit_*.zip, dist/checksums.txt" }
      - name: Prerelease tags go to GitHub only
        if: ${{ contains(github.ref_name, '-') }}
        run: |
          echo "::notice::${GITHUB_REF_NAME} is a prerelease (the tag has a '-'): no Homebrew formula, and the cli-channels job (Homebrew and npm) is skipped."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !contains(github.ref_name, '-') }}
        with: { node-version: 26 }
      # The formula installs the prebuilt binary from this release's archives, pinned by sha256 (ruling S6). It is
      # pushed to the tap by cli-channels after approval, which holds the only tap token.
      - name: The Homebrew formula, from this release's checksums.txt
        if: ${{ !contains(github.ref_name, '-') }}
        run: node scripts/homebrew/formula.mjs --checksums dist/checksums.txt --version "${GITHUB_REF_NAME#v}" --out formula/ambit.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !contains(github.ref_name, '-') }}
        with: { name: homebrew-formula, path: formula/ambit.rb, retention-days: 7, if-no-files-found: error }

  # Homebrew (a formula) and npm. Runs in the Environment release-channels, so a maintainer approves each release first. A
  # failure here does not undo the GitHub release; both steps are safe to re-run (the job can be re-run alone).
  cli-channels:
    needs: cli
    # Prerelease tags (a '-' in the tag) are not published to Homebrew or npm; the cli job logs that.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release-channels
    permissions: { contents: read, id-token: write }  # id-token: npm trusted publishing with provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: homebrew-formula, path: formula }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26, registry-url: "https://registry.npmjs.org" }
      - name: The release's archives and checksums.txt, as published
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "$GITHUB_REF_NAME" -p 'ambit_*' -p checksums.txt -D rel
      # Every downloaded archive must match the release's checksums.txt before anything is published from it,
      # and all six archives must be there (the formula pins four, npm uses six).
      - name: The downloaded archives match checksums.txt
        id: verify
        run: |
          cd rel
          [ "$(find . -name 'ambit_*' | wc -l)" -eq 6 ]
          sha256sum --check --strict checksums.txt
      # The artifact must be the formula for the published checksums: the file is where cli wrote it, it pins four
      # archives by sha256, and the same script run on the release's checksums.txt writes the same bytes.
      - name: The Homebrew formula matches the published release
        run: |
          test -f formula/ambit.rb
          [ "$(grep -cE '^ +sha256 "[0-9a-f]{64}"$' formula/ambit.rb)" = 4 ]
          node scripts/homebrew/formula.mjs --checksums rel/checksums.txt --version "${GITHUB_REF_NAME#v}" --out "$RUNNER_TEMP/expected.rb"
          cmp formula/ambit.rb "$RUNNER_TEMP/expected.rb"
      - name: Homebrew tap (craftsman-apps/homebrew-tap)
        env: { TAP_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}" }  # fine-grained, contents:write on that repository only
        # The token goes in an HTTP header set through environment variables, so it is never in a URL or in .git/config.
        run: |
          echo "::add-mask::$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git clone --depth 1 https://github.com/craftsman-apps/homebrew-tap.git tap
          mkdir -p tap/Formula && cp formula/ambit.rb tap/Formula/ambit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ambit.rb
          git diff --cached --quiet || { git commit -m "ambit ${GITHUB_REF_NAME}" && git push; }
      - name: npm (@craftsman-apps/ambit and one package per platform)
        # Runs even when the tap step failed (both are safe to re-run), but never from archives that failed verification.
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: node scripts/npm/publish.mjs --dir rel --version "${GITHUB_REF_NAME#v}" --out npm-out --publish
