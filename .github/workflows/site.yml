name: site
on:
  pull_request: { paths: ["docs/**", "site/**", "README.md", ".github/workflows/site.yml"] }
  # The live site follows releases, not main: it is built and deployed only from a version tag (v1.2.3) or a
  # homepage tag (site-<anything>). Prerelease tags (v1.2.3-rc.1) build but do not deploy. Merges to main deploy nothing.
  push: { tags: ["v*", "site-*"] }
permissions: { contents: read }
concurrency: { group: "site-${{ github.ref }}", cancel-in-progress: true }
jobs:
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Every README docs address has a page
        run: npm run check-readme-urls
        working-directory: site
      - name: The quick start shows every install method
        run: npm run check-install-methods
        working-directory: site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: site-build, path: site/build, retention-days: 3 }
  site-deploy:
    needs: site-build
    if: >-
      startsWith(github.ref, 'refs/tags/site-') ||
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: site-build, path: site/build }
      - name: Skip when Vercel is not set up yet
        id: ready
        env: { T: "${{ secrets.VERCEL_TOKEN }}" }
        run: if [ -n "$T" ]; then echo ok=true >> "$GITHUB_OUTPUT"; else echo "::notice::Vercel secrets not set; deploy skipped"; fi
      - if: steps.ready.outputs.ok == 'true'
        run: node site/scripts/vercel-output.mjs site/build .vercel/output
      - if: steps.ready.outputs.ok == 'true'
        id: deploy
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}", PROD: "${{ github.event_name == 'push' && '--prod' || '' }}" }
        run: |
          npx --yes vercel@52.0.0 deploy --prebuilt $PROD --token "$VERCEL_TOKEN" > url.txt
          echo "url=$(tail -1 url.txt)" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.ok == 'true' && github.event_name == 'pull_request'
        env: { GH_TOKEN: "${{ github.token }}", URL: "${{ steps.deploy.outputs.url }}" }
        run: |
          body="<!-- site-preview -->
          Site preview: $URL"
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- site-preview -->"))][0].id // empty')
          if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$body"
          else gh pr comment ${{ github.event.pull_request.number }} --body "$body"; fi
