receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
exporters:
  clickhouse:
    endpoint: {{ include "ambit.clickhouse.native" . }}
    database: {{ .Values.evidence.clickhouse.external.database | default "otel" }}
    username: {{ .Values.evidence.clickhouse.external.user | default "ambit" }}
    {{- if .Values.evidence.clickhouse.external.caSecret }}
    tls: { ca_file: /etc/ambit/clickhouse-ca/ca.crt }
    {{- end }}
    password: ${env:CLICKHOUSE_PASSWORD}
    logs_table_name: otel_logs
    ttl: {{ .Values.evidence.retention }}
    create_schema: true
    sending_queue: { enabled: true }
    retry_on_failure: { enabled: true }
processors:
  batch: { timeout: 2s }
service:
  pipelines:
    logs: { receivers: [otlp], processors: [batch], exporters: [clickhouse] }
