receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
exporters:
  clickhouse:
    endpoint: {{ include "ambit.clickhouse.native" . }}
    {{- with .Values.evidence.clickhouse.external }}
    {{- if .host }}
    database: {{ .database | default "otel" }}
    username: {{ .user | default "ambit" }}
    {{- if and .tls .caSecret }}
    tls: { ca_file: /etc/ambit/clickhouse-ca/ca.crt }
    {{- end }}
    {{- else }}
    database: otel
    username: ambit
    {{- end }}
    {{- end }}
    password: ${env:CLICKHOUSE_PASSWORD}
    logs_table_name: otel_logs
    ttl: {{ .Values.evidence.retention }}
    create_schema: true
    # While ClickHouse refuses writes, failed batches wait here for a retry. Capped in bytes: unbounded,
    # this queue grew until the collector was killed at its memory limit (24-hour soak, 2026-10-01).
    sending_queue: { enabled: true, sizer: bytes, queue_size: 67108864 }
    retry_on_failure: { enabled: true }
extensions:
  # Answers 200 only after every pipeline started: the exporter created otel_logs and the receiver listens.
  health_check: { endpoint: 0.0.0.0:13133 }
processors:
  # Refuses new logs (the gateway sees the export fail) before the container's memory limit is reached.
  memory_limiter: { check_interval: 1s, limit_percentage: 75, spike_limit_percentage: 20 }
  batch: { timeout: 2s }
service:
  extensions: [health_check]
  # The collector's own metrics (records sent, failed, refused) for Prometheus; alerts.enabled scrapes them.
  telemetry:
    metrics:
      readers:
        - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
  pipelines:
    logs: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [clickhouse] }
