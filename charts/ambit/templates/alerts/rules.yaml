{{- if .Values.alerts.enabled }}
{{- $ns := .Release.Namespace }}
# Alerts for every Ambit component (requirement S3). They read kube-state-metrics and cAdvisor, which
# kube-prometheus-stack installs, and the collector's own metrics (the PodMonitor below).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ambit
  {{- with .Values.alerts.labels }}
  labels: {{ toJson . }}
  {{- end }}
spec:
  groups:
    - name: ambit
      rules:
        - alert: AmbitContainerRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ $ns }}"}[30m]) >= 2
          labels: { severity: warning }
          annotations:
            summary: "{{`{{ $labels.pod }}`}} ({{`{{ $labels.container }}`}}) restarted {{`{{ $value | printf \"%.0f\" }}`}} times in 30 minutes"
            description: "Read the reason with kubectl -n {{ $ns }} describe pod {{`{{ $labels.pod }}`}} (Last State)."
        - alert: AmbitContainerOOMKilled
          expr: |
            (kube_pod_container_status_last_terminated_reason{namespace="{{ $ns }}", reason="OOMKilled"} == 1)
              and on (namespace, pod, container)
            (increase(kube_pod_container_status_restarts_total{namespace="{{ $ns }}"}[30m]) > 0)
          labels: { severity: warning }
          annotations:
            summary: "{{`{{ $labels.pod }}`}} ({{`{{ $labels.container }}`}}) was killed at its memory limit"
            description: "Raise the container's memory limit in the chart values, or find what grew (docs/alerts.md)."
        - alert: AmbitMemoryNearLimit
          expr: |
            max by (namespace, pod, container) (container_memory_working_set_bytes{namespace="{{ $ns }}", container!=""})
              / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="{{ $ns }}", resource="memory"})
              > 0.9
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "{{`{{ $labels.pod }}`}} ({{`{{ $labels.container }}`}}) uses {{`{{ $value | humanizePercentage }}`}} of its memory limit"
            description: "At 100% the container is killed and restarts."
        - alert: AmbitWorkloadUnavailable
          expr: |
            (kube_deployment_status_replicas_available{namespace="{{ $ns }}"} < kube_deployment_spec_replicas{namespace="{{ $ns }}"})
              or
            (kube_statefulset_status_replicas_ready{namespace="{{ $ns }}"} < kube_statefulset_replicas{namespace="{{ $ns }}"})
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{`{{ $labels.deployment }}{{ $labels.statefulset }}`}} has fewer ready pods than it should for 10 minutes"
            description: "kubectl -n {{ $ns }} get pods; kubectl -n {{ $ns }} get events --sort-by=.lastTimestamp"
        {{- if .Values.limits.enabled }}
        - alert: AmbitBudgetStoreDown
          expr: kube_deployment_status_replicas_available{namespace="{{ $ns }}", deployment=~"ambit-ratelimit|ambit-valkey"} == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "{{`{{ $labels.deployment }}`}} is down: budgets are not enforced"
            {{- if eq .Values.limits.failureMode "FailClosed" }}
            description: "limits.failureMode is FailClosed: the gateway refuses LLM and MCP requests until it is back."
            {{- else }}
            description: "limits.failureMode is FailOpen: requests pass uncounted until it is back."
            {{- end }}
        {{- end }}
        {{- if .Values.evidence.enabled }}
        - alert: AmbitAuditLogsDropped
          expr: |
            sum by (namespace, pod) (increase(otelcol_exporter_send_failed_log_records_total{namespace="{{ $ns }}"}[10m])) > 0
              or
            sum by (namespace, pod) (increase(otelcol_receiver_refused_log_records_total{namespace="{{ $ns }}"}[10m])) > 0
          labels: { severity: critical }
          annotations:
            summary: "Audit records were lost in the last 10 minutes ({{`{{ $value | printf \"%.0f\" }}`}})"
            description: "The collector could not write to ClickHouse, or refused records near its memory limit. Check ClickHouse first: kubectl -n {{ $ns }} logs deploy/ambit-otel-collector"
        - alert: AmbitConsoleAuditSendFailed
          expr: sum by (namespace, pod) (increase(ambit_console_audit_send_failures_total{namespace="{{ $ns }}"}[30m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "The console could not send {{`{{ $value | printf \"%.0f\" }}`}} MCP app request or approval records to the collector in 30 minutes"
            description: "The requests and decisions happened; the Audit page and otel_logs miss these records. The ServerRequest objects still hold them (kubectl -n {{ $ns }} get serverrequests). Read why: kubectl -n {{ $ns }} logs deploy/ambit-console | grep 'not delivered to the collector'; check the collector: kubectl -n {{ $ns }} logs deploy/ambit-otel-collector"
        - alert: AmbitControllerRecordsDropped
          expr: sum by (namespace, reason) (increase(ambit_controller_record_dropped_total{namespace="{{ $ns }}"}[30m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "The controller dropped records (access snapshots, MCP app removals) ({{`{{ $value | printf \"%.0f\" }}`}} in 30 minutes, reason {{`{{ $labels.reason }}`}})"
            description: "The rules were applied; only the record is missing: an access review export for this time shows a gap (the next change or the daily record at 00:05 UTC writes the rules again), or an MCP app removal is not in the Audit page (the Git history or the Kubernetes audit log has it). send_failed: the collector was not reachable (kubectl -n {{ $ns }} logs deploy/ambit-otel-collector). queue_full: more records than the controller can send. too_large: the AccessRules together are larger than 1 MiB (kubectl -n {{ $ns }} logs deploy/ambit-controller | grep 'access snapshot')."
        {{- end }}
        # Agents (docs/agents.md): a stop is complete only when every Gateway accepted the stop policy.
        - alert: AmbitAgentStopNotConfirmed
          expr: max by (namespace, gateway) (ambit_agent_stop_unconfirmed_seconds{namespace="{{ $ns }}"}) > 60
          labels: { severity: critical }
          annotations:
            summary: "A stop is not confirmed on the Gateway {{`{{ $labels.gateway }}`}} for {{`{{ $value | printf \"%.0f\" }}`}} seconds"
            description: "The agent's keys are deleted, but the Gateway has not accepted the stop policy that blocks its tokens and any key still in use. Check agentgateway: kubectl -n {{ $ns }} get agentgatewaypolicy | grep ambit-agent-stops; kubectl -n {{ $ns }} logs deploy/ambit-controller. The agent stays in state stopping until the Gateway confirms."
        - alert: AmbitStopPolicyDegraded
          expr: max by (namespace) (ambit_agent_stop_policy_degraded{namespace="{{ $ns }}"}) == 1
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "The stop list was not turned into gateway policies"
            description: "The last stop policies stay in force, but new stops are not applied. Read why: kubectl -n {{ $ns }} get configmap ambit-agent-stops-ack -o yaml (field degraded). A list over 1,000 entries or an unreadable list is the usual cause."
        {{- if and .Values.mcp.enabled .Values.protection.enabled }}
        - alert: AmbitGuardCompressionFailing
          expr: sum by (namespace, server) (increase(ambit_guard_compress_results_total{namespace="{{ $ns }}", outcome=~"error|timeout"}[30m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "Result compression failed or ran out of time for server {{`{{ $labels.server }}`}} ({{`{{ $value | printf \"%.0f\" }}`}} results in 30 minutes)"
            description: "The guard passed the original text, so no call failed. Set resultCompression.mode to off on the Server if it keeps happening, and read the guard log: kubectl -n {{ $ns }} logs deploy/ambit-guard"
        {{- if .Values.evidence.enabled }}
        - alert: AmbitGuardRecordsDropped
          expr: sum by (namespace, reason) (increase(ambit_guard_record_dropped_total{namespace="{{ $ns }}"}[30m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "The guard dropped compression records ({{`{{ $value | printf \"%.0f\" }}`}} in 30 minutes, reason {{`{{ $labels.reason }}`}})"
            description: "No call failed. The Savings page counts fewer compressed results than there were. send_failed: the collector was not reachable (kubectl -n {{ $ns }} logs deploy/ambit-otel-collector). queue_full: more records than the guard can send. no_groups: the gateway sent no groups."
        {{- end }}
        {{- end }}
{{- if and .Values.mcp.enabled .Values.protection.enabled }}
---
# The guard's /metrics (ambit_guard_compress_*), on its health port.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ambit-guard
  {{- with .Values.alerts.labels }}
  labels: {{ toJson . }}
  {{- end }}
spec:
  selector: { matchLabels: { app.kubernetes.io/name: ambit-guard } }
  podMetricsEndpoints: [{ port: health }]
{{- end }}
{{- if .Values.evidence.enabled }}
---
# The console's /metrics (ambit_console_audit_send_failures_total), on its metrics port.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ambit-console
  {{- with .Values.alerts.labels }}
  labels: {{ toJson . }}
  {{- end }}
spec:
  selector: { matchLabels: { app.kubernetes.io/name: ambit-console } }
  podMetricsEndpoints: [{ port: metrics }]
---
# The controller's /metrics (ambit_controller_record_dropped_total), on its metrics port.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ambit-controller
  {{- with .Values.alerts.labels }}
  labels: {{ toJson . }}
  {{- end }}
spec:
  selector: { matchLabels: { app.kubernetes.io/name: ambit-controller } }
  podMetricsEndpoints: [{ port: metrics }]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ambit-otel-collector
  {{- with .Values.alerts.labels }}
  labels: {{ toJson . }}
  {{- end }}
spec:
  selector: { matchLabels: { app.kubernetes.io/name: ambit-otel-collector } }
  podMetricsEndpoints: [{ port: metrics }]
{{- end }}
{{- end }}
