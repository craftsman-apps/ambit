apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambit-console
  labels: { app.kubernetes.io/name: ambit-console }
spec:
  replicas: 1  # ponytail: bootstrap has no leader election; add it before running 2+ replicas
  selector:
    matchLabels: { app.kubernetes.io/name: ambit-console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ambit-console }
    spec:
      serviceAccountName: ambit-console
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: AMBIT_PUBLIC_URL, value: {{ .Values.console.url | quote }} }
            - { name: AMBIT_DEX_GRPC, value: "ambit-dex:5557" }
            - { name: AMBIT_SESSION_HOURS, value: {{ .Values.console.sessionHours | quote }} }
            - { name: AMBIT_BOOTSTRAP_ENABLED, value: {{ .Values.bootstrapAdmin.enabled | quote }} }
            {{- $opts := list }}
            {{- range .Values.sso.connectors }}
            {{- $opts = append $opts (dict "id" .id "name" (.name | default .id)) }}
            {{- end }}
            - { name: AMBIT_SSO_CONNECTORS, value: {{ $opts | toJson | quote }} }
            - name: AMBIT_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            {{- if .Values.console.caBundleSecret }}
            # Go reads every directory in SSL_CERT_DIR: system CAs plus the extra one.
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/ambit/ca" }
            {{- end }}
            {{- with .Values.gitops }}{{ if .enabled }}
            - { name: AMBIT_GITOPS_REPOSITORY, value: {{ required "gitops.repository is required (owner/name)" .repository | quote }} }
            - { name: AMBIT_GITOPS_BRANCH, value: {{ .branch | quote }} }
            - { name: AMBIT_GITOPS_PATH, value: {{ .path | quote }} }
            - { name: AMBIT_GITHUB_API, value: {{ .github.apiURL | quote }} }
            - { name: AMBIT_GITHUB_APP_ID, value: {{ required "gitops.github.appID is required" .github.appID | quote }} }
            {{- end }}{{ end }}
          volumeMounts:
            {{- if .Values.console.caBundleSecret }}
            - { name: extra-ca, mountPath: /etc/ambit/ca, readOnly: true }
            {{- end }}
            {{- if .Values.gitops.enabled }}
            - { name: github-app, mountPath: /etc/ambit/github, readOnly: true }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        {{- with .Values.console.caBundleSecret }}
        - name: extra-ca
          secret: { secretName: {{ . | quote }}, items: [{ key: ca.crt, path: ca.crt }] }
        {{- end }}
        {{- if .Values.gitops.enabled }}
        # Created by you (kubectl or External Secrets); the chart never holds the key.
        - name: github-app
          secret: { secretName: {{ .Values.gitops.github.privateKeySecret | quote }}, items: [{ key: private-key.pem, path: private-key.pem }] }
        {{- end }}
