apiVersion: v1
kind: ServiceAccount
metadata:
  name: ambit-console
---
# The console creates its own Secrets at first start (bootstrap admin, session and client keys).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ambit-console
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ambit-console-keys]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ambit-initial-admin]
    verbs: [get, update, delete]
  # Audit store password, created by the console at first start (evidence).
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ambit-clickhouse]
    verbs: [get]
  # Dependencies page: whether each component of the chart has a ready pod.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    resourceNames: [ambit, ambit-dex, ambit-ratelimit, ambit-guard, ambit-otel-collector, ambit-clickhouse, ambit-router]
    verbs: [get]
  # Catalog screens: everyone signed in reads; admins change access rules (Direct mode).
  - apiGroups: [ambitproject.dev]
    resources: [models, accessrules, servers, serverrequests, connections, budgets]
    verbs: [get, list, watch]
  # Offboarding (SCIM): the list of deactivated users that the controller blocks at the gateway.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [ambit-offboarded]
    verbs: [get, update]
  {{- if .Values.gitops.enabled }}
  # GitOps mode: rules and servers change only through pull requests, so the console cannot write them.
  - apiGroups: [ambitproject.dev]
    resources: [serverrequests]
    verbs: [create]
  {{- else }}
  - apiGroups: [ambitproject.dev]
    resources: [accessrules, budgets, connections]
    verbs: [create, update, delete]
  # Edit price (Models page): the console changes only spec.price, admins only.
  - apiGroups: [ambitproject.dev]
    resources: [models]
    verbs: [update]
  # Anyone signed in may request a server; approving one creates the Server, and records a decision
  # only in the request's status. Adding an app from a preset creates its Server too.
  - apiGroups: [ambitproject.dev]
    resources: [serverrequests, servers]
    verbs: [create]
  # Removing an unfinished preset addition deletes the Server it created. The console never updates Servers.
  - apiGroups: [ambitproject.dev]
    resources: [servers]
    verbs: [delete]
  {{- end }}
  - apiGroups: [ambitproject.dev]
    resources: [serverrequests/status]
    verbs: [update]
  # Approving changed tool definitions (journey A6) writes Server status.
  - apiGroups: [ambitproject.dev]
    resources: [servers/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ambit-console
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ambit-console }
subjects: [{ kind: ServiceAccount, name: ambit-console }]
{{- with .Values.gitops }}{{ if and .enabled .argocd.application }}
{{- $app := split "/" .argocd.application }}
---
# Change timeline: read the sync status of the one Argo CD Application that syncs the repository.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ambit-console-argocd
  namespace: {{ $app._0 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [{{ required "gitops.argocd.application must be namespace/name" $app._1 }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ambit-console-argocd
  namespace: {{ $app._0 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ambit-console-argocd }
subjects: [{ kind: ServiceAccount, name: ambit-console, namespace: {{ $.Release.Namespace }} }]
{{- end }}{{ end }}
