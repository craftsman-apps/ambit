{{- /* .Values.access is missing after helm upgrade --reuse-values from 0.1.0 */ -}}
{{- $access := .Values.access | default dict }}
{{- $mode := $access.mode | default "enforce" }}
{{- if not (has $mode (list "enforce" "audit")) }}{{ fail "access.mode must be enforce or audit" }}{{ end }}
{{- if and (eq $mode "audit") (not .Values.evidence.enabled) }}{{ fail "access.mode=audit needs evidence.enabled=true: without the audit store, audit-only mode would allow everything and record nothing" }}{{ end }}
{{- $duration := "^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$" }}
{{- $timeout := toString (ternary $access.activationTimeout "120s" (hasKey $access "activationTimeout")) }}
{{- if or (not (regexMatch $duration $timeout)) (regexMatch "^([0.]+(ns|us|µs|ms|s|m|h))+$" $timeout) }}{{ fail (printf "access.activationTimeout must be a duration above 0, such as 120s (got %q): 0 would turn the activation gate off, not remove its limit" $timeout) }}{{ end }}
{{- $settle := toString (ternary $access.activationSettle "3s" (hasKey $access "activationSettle")) }}
{{- if not (or (eq $settle "0") (regexMatch $duration $settle)) }}{{ fail (printf "access.activationSettle must be a duration of 0 or more, such as 3s (got %q)" $settle) }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambit-controller
  labels: { app.kubernetes.io/name: ambit-controller }
spec:
  replicas: 1  # ponytail: no leader election yet; add it before running 2+ replicas
  selector:
    matchLabels: { app.kubernetes.io/name: ambit-controller }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ambit-controller }
    spec:
      serviceAccountName: ambit-controller
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: controller
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          command:
            - /ambit-controller
            - --llm-route=ambit-llm
            {{- if .Values.protection.enabled }}
            - --argument-limits  # ambit-guard enforces argument limits in access rules
            {{- end }}
            # One flag for both gateways: if either relaxes the email rule, the principal falls back to the JWT subject on both (the safe superset).
            - --require-email={{ and (ne (toString .Values.llm.jwt.requireEmail) "false") (ne (toString .Values.mcp.jwt.requireEmail) "false") }}
            - --users-require-verified-email={{ ne (toString .Values.accessRules.usersRequireVerifiedEmail) "false" }}
            - --access-mode={{ $mode }}
            - --activation-timeout={{ $timeout }}
            - --activation-settle={{ $settle }}
            - --tools-refresh={{ .Values.protection.toolsRefresh }}
            - --xds-addr={{ .Release.Name }}-agentgateway.{{ .Release.Namespace }}.svc:9978
            {{- if .Values.mcp.enabled }}
            - --console-tools-url=http://ambit-console.{{ .Release.Namespace }}.svc:8083
            {{- end }}
            {{- if and .Values.llm.enabled .Values.routing.router.enabled }}
            - --router-deployment=ambit-router
            - --router-replicas={{ .Values.routing.router.replicas }}
            {{- end }}
            {{- if .Values.limits.enabled }}
            - --ratelimit-service=ambit-ratelimit
            - --ratelimit-failure-mode={{ .Values.limits.failureMode }}
            {{- end }}
          env:
            - name: AMBIT_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports: [{ name: probes, containerPort: 8081 }, { name: metrics, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: probes } }
          livenessProbe: { httpGet: { path: /healthz, port: probes } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 192Mi }
