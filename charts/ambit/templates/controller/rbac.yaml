apiVersion: v1
kind: ServiceAccount
metadata:
  name: ambit-controller
---
# Namespace-scoped: Ambit objects are read and only their status is written (GitOps rule 2);
# generated agentgateway and ToolHive objects are fully managed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ambit-controller
rules:
  - apiGroups: [ambitproject.dev]
    resources: [models, servers, accessrules, budgets, modelrouters]
    verbs: [get, list, watch]
  - apiGroups: [ambitproject.dev]
    resources: [models/status, servers/status, accessrules/status, budgets/status, modelrouters/status]
    verbs: [get, update, patch]
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewaymodels, agentgatewaybackends, agentgatewaypolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # The console's list of offboarded users (ambit-offboarded), turned into a gateway Deny rule.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  # Budgets: the ratelimit service's config, generated from Budget objects.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [ambit-ratelimit-config, ambit-router-config]
    verbs: [update, patch]
  # agentgateway's xDS certificate: when it was not renewed, an annotation makes agentgateway renew it.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kgateway-xds-cert]
    verbs: [patch]
{{- if and .Values.llm.enabled .Values.routing.router.enabled }}
  # Model routing (type LLM): the controller copies each classifier Model's key into ambit-router-credentials.
  # Classifier Models name their Secrets freely, so get cannot be limited by name; reads go to the API server,
  # never a cache, and there is no list or watch. create cannot be limited by name in Kubernetes RBAC.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ambit-router-credentials]
    verbs: [update, patch]
  # ambit-router's replicas: scaled up while a router of type LLM exists, to 0 otherwise.
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [ambit-router]
    verbs: [get, list, watch, patch]
{{- end }}
  # Leader election: only one controller writes during a rolling update.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [toolhive.stacklok.dev]
    resources: [mcpservers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ambit-controller
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ambit-controller }
subjects: [{ kind: ServiceAccount, name: ambit-controller }]
