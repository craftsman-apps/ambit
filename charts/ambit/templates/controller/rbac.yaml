apiVersion: v1
kind: ServiceAccount
metadata:
  name: ambit-controller
---
# Namespace-scoped: Ambit objects are read and only their status is written (GitOps rule 2);
# generated agentgateway and ToolHive objects are fully managed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ambit-controller
rules:
  - apiGroups: [ambitproject.dev]
    resources: [models, servers, accessrules]
    verbs: [get, list, watch]
  - apiGroups: [ambitproject.dev]
    resources: [models/status, servers/status, accessrules/status]
    verbs: [get, update, patch]
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewaymodels, agentgatewaybackends, agentgatewaypolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # The console's list of offboarded users (ambit-offboarded), turned into a gateway Deny rule.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: [toolhive.stacklok.dev]
    resources: [mcpservers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ambit-controller
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ambit-controller }
subjects: [{ kind: ServiceAccount, name: ambit-controller }]
