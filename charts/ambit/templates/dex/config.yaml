# Rendered identically on every run (GitOps rule 6): no random values, no lookup, no bcrypt.
# The console creates the OAuth client and the bootstrap password through Dex's gRPC API.
apiVersion: v1
kind: Secret
metadata:
  name: ambit-dex-config
stringData:
  config.yaml: |
    issuer: {{ .Values.console.url }}/dex
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    grpc:
      addr: 0.0.0.0:5557
    oauth2:
      skipApprovalScreen: true
      {{- if and (include "ambit.dexIssuesGatewayTokens" .) .Values.bootstrapAdmin.enabled }}
      # Local accounts get gateway tokens with a username and password (llm/mcp.jwt.dex).
      passwordConnector: local
      {{- end }}
    {{- if include "ambit.dexIssuesGatewayTokens" . }}
    # Public client for gateway tokens: no secret, as on a laptop it could not be kept secret.
    staticClients:
      - { id: ambit-cli, name: Ambit CLI, public: true }
    {{- end }}
    frontend:
      issuer: Ambit
      logoURL: {{ .Values.console.url }}/favicon.svg
    enablePasswordDB: {{ .Values.bootstrapAdmin.enabled }}
    {{- with .Values.sso.connectors }}
    connectors:
      {{- toYaml . | nindent 6 }}
    {{- end }}
