{{- if .Values.evidence.enabled }}
{{- $config := tpl (.Files.Get "files/otel-collector.yaml") . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambit-otel-collector
data:
  config.yaml: |
{{ $config | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambit-otel-collector
  labels: { app.kubernetes.io/name: ambit-otel-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ambit-otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ambit-otel-collector }
      annotations: { checksum/config: {{ $config | sha256sum | trunc 16 | quote }} }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: {{ .Values.evidence.collector.image | quote }}
          args: [--config=/etc/otel/config.yaml]
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "ambit.clickhouse.passwordSecret" . }}, key: password } }
          ports: [{ name: otlp, containerPort: 4317 }, { name: metrics, containerPort: 8888 }, { name: health, containerPort: 13133 }]
          # Not ready until the pipelines run; until then the gateway's records would be lost (helm --wait waits for this).
          readinessProbe: { httpGet: { path: /, port: health }, periodSeconds: 2 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{ toJson .Values.evidence.collector.resources }}
          volumeMounts:
            - { name: config, mountPath: /etc/otel }
            {{- if include "ambit.clickhouse.ca" . }}
            - { name: clickhouse-ca, mountPath: /etc/ambit/clickhouse-ca, readOnly: true }
            {{- end }}
      volumes:
        - { name: config, configMap: { name: ambit-otel-collector } }
        {{- with include "ambit.clickhouse.ca" . }}
        - { name: clickhouse-ca, secret: { secretName: {{ . }}, items: [{ key: ca.crt, path: ca.crt }] } }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ambit-otel-collector
spec:
  selector: { app.kubernetes.io/name: ambit-otel-collector }
  ports: [{ name: otlp, port: 4317, appProtocol: grpc }]
---
# Every gateway request becomes one record: who (jwt.email, jwt.groups), what (MCP method, tool, server,
# model, tokens), and the outcome (HTTP status, MCP error) — denied calls included.
# The static part of the AgentgatewayPolicy ambit-access-log. ambit-controller writes the policy from it, adding
# ambit.accessMode, ambit.rulesVersion and, in audit-only mode, the "would be refused" fields: agentgateway uses
# only the first access-log policy of a Gateway, so there must be exactly one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambit-access-log-base
data:
  spec.yaml: |
    targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: ambit }]
    frontend:
      accessLog:
        attributes:
          # The text of an MCP server's JSON-RPC error can hold personal data the guard never sees (issue 335):
          # never stored or logged. mcp.error.code stays.
          remove: [mcp.error.message]
          add:
            {{- $v := include "ambit.identity.validKey" . }}{{ $p := include "ambit.identity.presented" . }}
            - { name: jwt.email, expression: {{ include "ambit.identity.logEmail" . | quote }} }
            - { name: jwt.groups, expression: {{ printf "(%s) ? apiKey.groups : ((%s) ? [] : (has(jwt.groups) ? jwt.groups : []))" $v $p | quote }} }
            # Overrides agentgateway's built-in jwt.sub (log.rs suppresses built-ins named here): never a JWT's subject on a key request.
            - { name: jwt.sub, expression: {{ printf "(%s) || (%s) ? \"\" : (has(jwt.sub) ? jwt.sub : \"\")" $v $p | quote }} }
            - { name: ambit.key_id, expression: {{ include "ambit.identity.logKeyId" . | quote }} }
            {{- if and .Values.mcp.enabled .Values.protection.enabled }}
            # The call ID ambit-guard made for this tools/call; its compression records carry the same (#203).
            - { name: ambit.call_id, expression: {{ include "ambit.callId" . | quote }} }
            {{- end }}
            - { name: ambit.identity, expression: {{ include "ambit.identity.kind" . | quote }} }
            # Agents (docs/agents.md), experimental: read only from a verified key or token. The platform is the one the agent's
            # record declares: never a proof, and no policy uses it.
            - { name: ambit.agent, expression: {{ include "ambit.identity.agentAttr" (dict "key" "agent" "claim" "ambit_agent" "root" $) | quote }} }
            - { name: ambit.agent_mode, expression: {{ include "ambit.identity.agentAttr" (dict "key" "agentMode" "claim" "ambit_agent_mode" "root" $) | quote }} }
            - { name: ambit.agent_owner_at_issue, expression: {{ include "ambit.identity.agentAttr" (dict "key" "agentOwnerAtIssue" "claim" "ambit_agent_owner_at_issue" "root" $) | quote }} }
            - { name: ambit.platform_declared, expression: {{ include "ambit.identity.agentAttr" (dict "key" "platformDeclared" "claim" "ambit_platform_declared" "root" $) | quote }} }
            - { name: ambit.grant_id, expression: {{ include "ambit.identity.agentAttr" (dict "key" "" "claim" "ambit_grant" "root" $) | quote }} }
            - { name: ambit.token_issuer, expression: {{ include "ambit.identity.tokenIssuer" . | quote }} }
            # Which Gateway took the call: a constant of this Gateway's policy, never a request header.
            - { name: ambit.ingress, expression: '"private"' }
            # The model name the client asked for (a ModelRouter such as "auto"); gen_ai.request.model is the one that answered.
            - { name: ambit.router, expression: "metadata.ambit_requested_model" }
            # A classifier's label and its reason (set by ambit-router, PR 2); empty for type Rules.
            - { name: ambit.route, expression: 'request.headers["x-ambit-route"]' }
            - { name: ambit.routeReason, expression: 'request.headers["x-ambit-route-reason"]' }
            # The classifier call's tokens (ambit-router, when it answered in time): the Savings page subtracts their cost.
            - { name: ambit.classifier.input_tokens, expression: 'request.headers["x-ambit-classifier-input-tokens"]' }
            - { name: ambit.classifier.output_tokens, expression: 'request.headers["x-ambit-classifier-output-tokens"]' }
            {{- if and .Values.llm.enabled (.Values.llm.promptGuard | default dict).enabled }}
            # What the prompt guard did, one "phase:guard:action" per guard, e.g. ["request:regex:reject"]. Only these
            # three fields: never the matched text, and never a webhook's own reason text.
            - { name: ambit.promptGuard, expression: 'guardrails.map(g, g.phase + ":" + g.guard + ":" + g.action)' }
            {{- end }}
        otlp:
          protocol: GRPC
          backendRef: { name: ambit-otel-collector, port: 4317 }
{{- end }}
