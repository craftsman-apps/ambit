{{- if .Values.evidence.enabled }}
{{- $config := tpl (.Files.Get "files/otel-collector.yaml") . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambit-otel-collector
data:
  config.yaml: |
{{ $config | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambit-otel-collector
  labels: { app.kubernetes.io/name: ambit-otel-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ambit-otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ambit-otel-collector }
      annotations: { checksum/config: {{ $config | sha256sum | trunc 16 | quote }} }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: {{ .Values.evidence.collector.image | quote }}
          args: [--config=/etc/otel/config.yaml]
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "ambit.clickhouse.passwordSecret" . }}, key: password } }
          ports: [{ name: otlp, containerPort: 4317 }, { name: metrics, containerPort: 8888 }, { name: health, containerPort: 13133 }]
          # Not ready until the pipelines run; until then the gateway's records would be lost (helm --wait waits for this).
          readinessProbe: { httpGet: { path: /, port: health }, periodSeconds: 2 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{ toJson .Values.evidence.collector.resources }}
          volumeMounts:
            - { name: config, mountPath: /etc/otel }
            {{- if include "ambit.clickhouse.ca" . }}
            - { name: clickhouse-ca, mountPath: /etc/ambit/clickhouse-ca, readOnly: true }
            {{- end }}
      volumes:
        - { name: config, configMap: { name: ambit-otel-collector } }
        {{- with include "ambit.clickhouse.ca" . }}
        - { name: clickhouse-ca, secret: { secretName: {{ . }}, items: [{ key: ca.crt, path: ca.crt }] } }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ambit-otel-collector
spec:
  selector: { app.kubernetes.io/name: ambit-otel-collector }
  ports: [{ name: otlp, port: 4317, appProtocol: grpc }]
---
# Every gateway request becomes one record: who (jwt.email, jwt.groups), what (MCP method, tool, server,
# model, tokens), and the outcome (HTTP status, MCP error) — denied calls included.
# The static part of the AgentgatewayPolicy ambit-access-log. ambit-controller writes the policy from it, adding
# ambit.accessMode, ambit.rulesVersion and, in audit-only mode, the "would be refused" fields: agentgateway uses
# only the first access-log policy of a Gateway, so there must be exactly one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambit-access-log-base
data:
  spec.yaml: |
    targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: ambit }]
    frontend:
      accessLog:
        attributes:
          add:
            {{- $v := include "ambit.identity.validKey" . }}{{ $p := include "ambit.identity.presented" . }}
            - { name: jwt.email, expression: {{ printf "(%s) ? apiKey.email : ((%s) ? \"\" : (has(jwt.email) ? jwt.email.trim().lowerAscii() : \"\"))" $v $p | quote }} }
            - { name: jwt.groups, expression: {{ printf "(%s) ? apiKey.groups : ((%s) ? [] : (has(jwt.groups) ? jwt.groups : []))" $v $p | quote }} }
            # Overrides agentgateway's built-in jwt.sub (log.rs suppresses built-ins named here): never a JWT's subject on a key request.
            - { name: jwt.sub, expression: {{ printf "(%s) || (%s) ? \"\" : (has(jwt.sub) ? jwt.sub : \"\")" $v $p | quote }} }
            - { name: ambit.key_id, expression: {{ printf "(%s) ? apiKey.keyId : \"\"" $v | quote }} }
            - { name: ambit.identity, expression: {{ printf "(%s) ? \"key\" : ((%s) ? \"invalid key\" : \"jwt\")" $v $p | quote }} }
            # The model name the client asked for (a ModelRouter such as "auto"); gen_ai.request.model is the one that answered.
            - { name: ambit.router, expression: "metadata.agentgateway_user_model" }
            # A classifier's label and its reason (set by ambit-router, PR 2); empty for type Rules.
            - { name: ambit.route, expression: 'request.headers["x-ambit-route"]' }
            - { name: ambit.routeReason, expression: 'request.headers["x-ambit-route-reason"]' }
        otlp:
          protocol: GRPC
          backendRef: { name: ambit-otel-collector, port: 4317 }
{{- end }}
