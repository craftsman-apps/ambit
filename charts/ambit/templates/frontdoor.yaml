{{- $fd := .Values.frontDoor | default dict }}
{{- if $fd.enabled }}
{{- /* The public front door (experimental in 0.6.x, docs/front-door.md). Every refusal below names the value to set. */ -}}
{{- if not $fd.host }}{{ fail "frontDoor.enabled=true needs frontDoor.host (the public MCP host name, for example mcp.example.com)" }}{{ end }}
{{- if not ($fd.tls | default dict).certificateSecret }}{{ fail "frontDoor.enabled=true needs frontDoor.tls.certificateSecret: the front door serves HTTPS only (a kubernetes.io/tls Secret whose certificate covers frontDoor.host)" }}{{ end }}
{{- if not .Values.mcp.enabled }}{{ fail "frontDoor.enabled=true needs mcp.enabled=true: the front door serves MCP only" }}{{ end }}
{{- if not .Values.apiKeys.enabled }}{{ fail "frontDoor.enabled=true needs apiKeys.enabled=true: the front door accepts API keys only" }}{{ end }}
{{- if not .Values.limits.enabled }}{{ fail "frontDoor.enabled=true needs limits.enabled=true: the front door's shared rate limits are counted by the ratelimit service" }}{{ end }}
{{- if not .Values.protection.enabled }}{{ fail "frontDoor.enabled=true needs protection.enabled=true: the public route must go through ambit-guard (tool pinning, argument limits and masking, fail closed)" }}{{ end }}
{{- if not .Values.evidence.enabled }}{{ fail "frontDoor.enabled=true needs evidence.enabled=true: every call through the public Gateway must be recorded" }}{{ end }}
{{- range $other := list .Values.console.host .Values.llm.host .Values.mcp.host }}
{{- if eq $other $fd.host }}{{ fail (printf "frontDoor.host %q is also a private host name: the public Gateway must not share a name with the console, the LLM host or the private MCP host" $fd.host) }}{{ end }}
{{- end }}
{{- if not (has ($fd.clientAddress | default "direct") (list "direct" "proxyProtocol")) }}{{ fail "frontDoor.clientAddress must be direct or proxyProtocol (X-Forwarded-For is never trusted)" }}{{ end }}
{{- if and (eq ($fd.clientAddress | default "direct") "proxyProtocol") (eq (($fd.service | default dict).type | default "LoadBalancer") "NodePort") }}{{ fail "frontDoor.clientAddress=proxyProtocol cannot be used with frontDoor.service.type=NodePort: anyone who can reach the node port could write its own client address in the PROXY header. Only your load balancer may reach the gateway pods (docs/front-door.md, \"Load balancers and the client address\")" }}{{ end }}
{{- $rl := $fd.rateLimit | default dict }}
{{- if not (has ($rl.failureMode | default "FailOpen") (list "FailOpen" "FailClosed")) }}{{ fail "frontDoor.rateLimit.failureMode must be FailOpen or FailClosed" }}{{ end }}
{{- range $k := list "perCredentialPerMinute" "perSourcePerMinute" "perPodPerSecond" }}
{{- if lt (int (index $rl $k)) 1 }}{{ fail (printf "frontDoor.rateLimit.%s must be 1 or more" $k) }}{{ end }}
{{- end }}
{{- $orl := ((.Values.oauth | default dict).rateLimit) | default dict }}
{{- if (.Values.oauth | default dict).enabled }}
{{- range $k := list "discoveryPerMinute" "signInPerMinute" "tokenPerMinute" "bearerPerMinute" }}
{{- if or (lt (int (index $orl $k)) 1) (gt (int (index $orl $k)) 1000000000) (ne (toString (index $orl $k)) (toString (int (index $orl $k)))) }}{{ fail (printf "oauth.rateLimit.%s must be a whole number, 1 to 1,000,000,000 (the ratelimit service holds a limit in 32 bits)" $k) }}{{ end }}
{{- end }}
{{- end }}
{{- if lt (int $fd.replicas) 1 }}{{ fail "frontDoor.replicas must be 1 or more" }}{{ end }}
{{- $svc := $fd.service | default dict }}
{{- $port := int ($fd.port | default 8443) }}
{{- $oauth := (.Values.oauth | default dict).enabled }}
# This policy does not change when OAuth is turned on or off (it always admits the routes of both): Helm applies it after the routes, so a policy that
# changed with the routes would refuse them in the same upgrade.
# Only the public route may be attached to ambit-public, and only as this chart writes it: the name, the host, one rule with
# the exact path /mcp, one backend (the public backend), and no other Gateway. A route of another name that names the
# Gateway, or a change of the right route (another path, host or backend), is refused. A route that already names
# ambit-public before the front door is turned on is not checked: see docs/front-door.md ("Before you turn it on").
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ambit-public-routes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [httproutes, grpcroutes, tlsroutes, tcproutes, udproutes]
  variables:
    - name: onPublic
      expression: >-
        has(object.spec.parentRefs) && object.spec.parentRefs.exists(p, p.name == "ambit-public")
  validations:
    - expression: >-
        !variables.onPublic || (object.kind == "HTTPRoute" && object.metadata.name == "ambit-mcp-public" &&
        size(object.spec.parentRefs) == 1 &&
        has(object.spec.parentRefs[0].sectionName) && object.spec.parentRefs[0].sectionName == "https" && !has(object.spec.parentRefs[0].namespace) &&
        has(object.spec.hostnames) && object.spec.hostnames == [{{ $fd.host | quote }}] &&
        has(object.spec.rules) && (
        (size(object.spec.rules) == 1 &&
        has(object.spec.rules[0].name) && object.spec.rules[0].name == "keys" &&
        has(object.spec.rules[0].matches) && size(object.spec.rules[0].matches) == 1 &&
        has(object.spec.rules[0].matches[0].path) && object.spec.rules[0].matches[0].path.type == "Exact" &&
        object.spec.rules[0].matches[0].path.value == "/mcp" &&
        !has(object.spec.rules[0].matches[0].method) && !has(object.spec.rules[0].matches[0].headers) && !has(object.spec.rules[0].matches[0].queryParams))
        ||
        (size(object.spec.rules) == 2 &&
        has(object.spec.rules[0].name) && object.spec.rules[0].name == "keys" && has(object.spec.rules[1].name) && object.spec.rules[1].name == "oauth" &&
        has(object.spec.rules[0].matches) && size(object.spec.rules[0].matches) == 2 &&
        object.spec.rules[0].matches.all(m, has(m.path) && m.path.type == "Exact" && m.path.value == "/mcp" && !has(m.method) && !has(m.queryParams) &&
        has(m.headers) && size(m.headers) == 1 && m.headers[0].type == "RegularExpression") &&
        object.spec.rules[0].matches.exists(m, m.headers[0].name == "x-api-key" && m.headers[0].value == ".*") &&
        object.spec.rules[0].matches.exists(m, m.headers[0].name == "Authorization" && m.headers[0].value == "^Bearer ambit_.*") &&
        has(object.spec.rules[1].matches) && size(object.spec.rules[1].matches) == 2 &&
        object.spec.rules[1].matches.all(m, has(m.path) && m.path.type == "Exact" && !has(m.headers) && !has(m.queryParams)) &&
        object.spec.rules[1].matches.exists(m, m.path.value == "/mcp" && !has(m.method)) &&
        object.spec.rules[1].matches.exists(m, m.path.value == "/.well-known/oauth-protected-resource/mcp" && has(m.method) && m.method == "GET")))
        && object.spec.rules.all(r,
        has(r.backendRefs) && size(r.backendRefs) == 1 && r.backendRefs[0].name == "ambit-mcp-public" &&
        has(r.backendRefs[0].kind) && r.backendRefs[0].kind == "AgentgatewayBackend" &&
        has(r.backendRefs[0].group) && r.backendRefs[0].group == "agentgateway.dev" &&
        !has(r.backendRefs[0].namespace) && (!has(r.backendRefs[0].filters) || size(r.backendRefs[0].filters) == 0) &&
        !has(r.timeouts) && !has(r.sessionPersistence) &&
        has(r.filters) && size(r.filters) == 1 && r.filters[0].type == "RequestHeaderModifier" && has(r.filters[0].requestHeaderModifier) &&
        !has(r.filters[0].requestHeaderModifier.set) && !has(r.filters[0].requestHeaderModifier.add) &&
        has(r.filters[0].requestHeaderModifier.remove) && size(r.filters[0].requestHeaderModifier.remove) == 3 &&
        ["X-Ambit-User", "x-api-key", "authorization"].all(h, h in r.filters[0].requestHeaderModifier.remove)))
        || (object.kind == "HTTPRoute" && object.metadata.name == "ambit-auth-hydra" &&
        size(object.spec.parentRefs) == 1 &&
        has(object.spec.hostnames) && size(object.spec.hostnames) == 1 && !object.spec.hostnames[0].startsWith("*") &&
        !has(object.spec.parentRefs[0].namespace) &&
        has(object.spec.rules) && size(object.spec.rules) == 1 &&
        has(object.spec.rules[0].matches) && size(object.spec.rules[0].matches) == 3 &&
        object.spec.rules[0].matches.all(m, has(m.path) && m.path.type == "Exact" && has(m.method) &&
        ((m.method == "POST" && m.path.value in ["/oauth2/token", "/oauth2/revoke"]) || (m.method == "GET" && m.path.value == "/.well-known/jwks.json"))) &&
        object.spec.rules[0].matches.exists(m, m.method == "POST" && m.path.value == "/oauth2/token") &&
        object.spec.rules[0].matches.exists(m, m.method == "POST" && m.path.value == "/oauth2/revoke") &&
        object.spec.rules[0].matches.exists(m, m.method == "GET" && m.path.value == "/.well-known/jwks.json") &&
        has(object.spec.parentRefs[0].sectionName) && object.spec.parentRefs[0].sectionName == "https-auth" &&
        has(object.spec.rules[0].filters) && size(object.spec.rules[0].filters) == 1 &&
        object.spec.rules[0].filters[0].type == "RequestHeaderModifier" && has(object.spec.rules[0].filters[0].requestHeaderModifier) &&
        !has(object.spec.rules[0].filters[0].requestHeaderModifier.add) && !has(object.spec.rules[0].filters[0].requestHeaderModifier.remove) &&
        has(object.spec.rules[0].filters[0].requestHeaderModifier.set) && size(object.spec.rules[0].filters[0].requestHeaderModifier.set) == 1 &&
        object.spec.rules[0].filters[0].requestHeaderModifier.set[0].name == "X-Forwarded-Proto" &&
        object.spec.rules[0].filters[0].requestHeaderModifier.set[0].value == "https" &&
        !has(object.spec.rules[0].timeouts) && !has(object.spec.rules[0].sessionPersistence) &&
        has(object.spec.rules[0].backendRefs) && size(object.spec.rules[0].backendRefs) == 1 &&
        object.spec.rules[0].backendRefs[0].name == "ambit-hydra-public" &&
        (!has(object.spec.rules[0].backendRefs[0].kind) || object.spec.rules[0].backendRefs[0].kind == "Service") &&
        (!has(object.spec.rules[0].backendRefs[0].group) || object.spec.rules[0].backendRefs[0].group == "") &&
        !has(object.spec.rules[0].backendRefs[0].namespace) && object.spec.rules[0].backendRefs[0].port == 4444 &&
        (!has(object.spec.rules[0].backendRefs[0].filters) || size(object.spec.rules[0].backendRefs[0].filters) == 0))
        || (object.kind == "HTTPRoute" && object.metadata.name == "ambit-auth-app" &&
        size(object.spec.parentRefs) == 1 &&
        has(object.spec.parentRefs[0].sectionName) && object.spec.parentRefs[0].sectionName == "https-auth" &&
        has(object.spec.hostnames) && size(object.spec.hostnames) == 1 &&
        has(object.spec.rules) && size(object.spec.rules) == 1 &&
        has(object.spec.rules[0].matches) && size(object.spec.rules[0].matches) >= 7 && size(object.spec.rules[0].matches) <= 8 &&
        object.spec.rules[0].matches.all(m, has(m.path) && m.path.type == "Exact" && has(m.method) &&
        (m.method + " " + m.path.value) in ["GET /.well-known/oauth-authorization-server", "GET /oauth2/auth", "GET /login", "GET /callback", "GET /consent", "POST /consent", "GET /error", "POST /register"]) &&
        has(object.spec.rules[0].backendRefs) && size(object.spec.rules[0].backendRefs) == 1 &&
        object.spec.rules[0].backendRefs[0].name == "ambit-auth" &&
        (!has(object.spec.rules[0].backendRefs[0].kind) || object.spec.rules[0].backendRefs[0].kind == "Service") &&
        (!has(object.spec.rules[0].backendRefs[0].group) || object.spec.rules[0].backendRefs[0].group == "") &&
        !has(object.spec.rules[0].backendRefs[0].namespace) && object.spec.rules[0].backendRefs[0].port == 8080 &&
        (!has(object.spec.rules[0].backendRefs[0].filters) || size(object.spec.rules[0].backendRefs[0].filters) == 0) &&
        !object.spec.hostnames[0].startsWith("*") && !has(object.spec.parentRefs[0].namespace) &&
        (!has(object.spec.rules[0].filters) || size(object.spec.rules[0].filters) == 0) &&
        !has(object.spec.rules[0].timeouts) && !has(object.spec.rules[0].sessionPersistence))
      message: "only the route ambit-mcp-public (and, with OAuth sign-in, ambit-auth-hydra and ambit-auth-app) may be attached to the public Gateway ambit-public, with the host, the exact paths and the backends that the chart sets"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ambit-public-routes
spec:
  policyName: ambit-public-routes
  validationActions: [Deny]
  matchResources:
    namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} } }
---
# The public Gateway: its own pods, Service and load balancer, so the console, Dex and the LLM host are never reachable
# on it. HTTPS only (there is no HTTP listener), one listener bound to one host name, and only the routes named below.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: ambit-public
spec:
  deployment:
    spec:
      replicas: {{ $fd.replicas }}
      strategy:
        type: RollingUpdate
        rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  {{- with .Values.gateway.resources }}
  resources: {{ toJson . }}
  {{- end }}
  {{- if gt (int $fd.replicas) 1 }}
  podDisruptionBudget:
    spec:
      minAvailable: 1
  {{- end }}
  service:
    {{- with $svc.annotations }}
    metadata:
      annotations: {{ toJson . }}
    {{- end }}
    spec:
      type: {{ $svc.type | default "LoadBalancer" }}
      {{- if ne ($svc.type | default "LoadBalancer") "ClusterIP" }}
      # Local keeps the client's address: the per-source limit and the audit log need it (docs/front-door.md).
      externalTrafficPolicy: {{ $svc.externalTrafficPolicy | default "Local" }}
      {{- end }}
      {{- with $svc.loadBalancerSourceRanges }}
      loadBalancerSourceRanges: {{ toJson . }}
      {{- end }}
      {{- if $svc.nodePort }}
      ports:
        - port: {{ $port }}
          nodePort: {{ $svc.nodePort }}
      {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ambit-public
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: ambit-public
  listeners:
    - name: https
      protocol: HTTPS
      port: {{ $port }}
      hostname: {{ $fd.host | quote }}
      tls:
        mode: Terminate
        certificateRefs: [{ name: {{ $fd.tls.certificateSecret | quote }} }]
      allowedRoutes:
        namespaces:
          from: Same
        kinds: [{ group: gateway.networking.k8s.io, kind: HTTPRoute }]
{{- if (.Values.oauth | default dict).enabled }}
    # OAuth: the sign-in host, a second name on the same port and certificate. A request for any other name is refused.
    - name: https-auth
      protocol: HTTPS
      port: {{ $port }}
      hostname: {{ $fd.authHost | quote }}
      tls:
        mode: Terminate
        certificateRefs: [{ name: {{ $fd.tls.certificateSecret | quote }} }]
      allowedRoutes:
        namespaces:
          from: Same
        kinds: [{ group: gateway.networking.k8s.io, kind: HTTPRoute }]
{{- end }}
---
# The one route of 0.6.0's key-only front door: exact path /mcp on the one host. Anything else is 404.
# The backend ambit-mcp-public holds only the servers an admin marked for the front door (Server spec.frontDoor); it is
# generated by ambit-controller, and without such a server the route has no backend and answers with an error.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ambit-mcp-public
spec:
  parentRefs: [{ name: ambit-public, sectionName: https }]
  hostnames: [{{ $fd.host | quote }}]
  rules:
    - name: keys
      {{- if $oauth }}
      # With OAuth: a request that carries an Ambit key takes this rule (a key is in x-api-key, or in Authorization after "Bearer ambit_"; an empty x-api-key counts: the key rule refuses it, as the identity rule treats any x-api-key header as a presented key);
      # every other request to /mcp takes the oauth rule below. The more specific match wins.
      matches:
        - { path: { type: Exact, value: /mcp }, headers: [{ name: x-api-key, type: RegularExpression, value: ".*" }] }
        - { path: { type: Exact, value: /mcp }, headers: [{ name: Authorization, type: RegularExpression, value: "^Bearer ambit_.*" }] }
      {{- else }}
      matches: [{ path: { type: Exact, value: /mcp } }]
      {{- end }}
      # The key must never reach an MCP server, and the token broker trusts X-Ambit-User from gateway pods only.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier: { remove: [X-Ambit-User, x-api-key, authorization] }
      backendRefs: [{ group: agentgateway.dev, kind: AgentgatewayBackend, name: ambit-mcp-public }]
    {{- if $oauth }}
    # OAuth: a hosted platform's token (a JWT of Ambit's sign-in host, docs/oauth.md). Without a token the answer is 401 with
    # the address of the protected resource metadata, so that the platform can start a sign-in. The metadata document itself
    # is served by the gateway for the second path.
    - name: oauth
      matches:
        - { path: { type: Exact, value: /mcp } }
        - { method: GET, path: { type: Exact, value: /.well-known/oauth-protected-resource/mcp } }
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier: { remove: [X-Ambit-User, x-api-key, authorization] }
      backendRefs: [{ group: agentgateway.dev, kind: AgentgatewayBackend, name: ambit-mcp-public }]
    {{- end }}
---
# Keys only: a request without a valid MCP key gets 403. A token is accepted on the oauth rule only (below, with OAuth).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-mcp-public-auth
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: ambit-mcp-public{{ if $oauth }}, sectionName: keys{{ end }} }]
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          # An agent key may name source ranges (at most 10 CIDRs): it is accepted only from them, as on the private route.
          - {{ include "ambit.identity.sourceRanges" . | quote }}
          - {{ printf "(%s) && (%s)%s" (include "ambit.identity.presented" .) (include "ambit.identity.validKey" .) (ternary "" " && !apiKey.email.endsWith(\"@svc.ambit.internal\")" (ne (toString (.Values.serviceAccounts | default dict).enabled) "false")) | quote }}
    apiKeyAuthentication:
      mode: Permissive
      secretSelector:
        matchLabels: { ambitproject.dev/key: "true", ambitproject.dev/key-mcp: "true" }
      location:
        expression: '"x-api-key" in request.headers ? request.headers["x-api-key"] : request.headers["authorization"].replace("Bearer ", "")'
{{- if $oauth }}
---
# The token rule: a JWT of Ambit's sign-in host (Hydra), for this MCP URL, and nothing else. The gateway reads Hydra's
# public keys inside the cluster and keeps them 5 minutes. Without a valid token: 401 with the resource_metadata challenge.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-mcp-public-oauth
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: ambit-mcp-public, sectionName: oauth }]
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: {{ printf "https://%s" $fd.authHost | quote }}
          audiences: [{{ printf "https://%s/mcp" $fd.host | quote }}]
          jwks:
            remote:
              url: {{ printf "http://ambit-hydra-public.%s.svc:4444/.well-known/jwks.json" .Release.Namespace | quote }}
              cacheDuration: 5m
          validation:
            requiredClaims: [aud, exp, sub]
      mcp:
        resourceMetadata:
          resource: {{ printf "https://%s/mcp" $fd.host | quote }}
          authorization_servers: [{{ printf "https://%s" $fd.authHost | quote }}]
          bearer_methods_supported: [header]
          scopes_supported: [mcp, offline_access]
    authorization:
      action: Require
      policy:
        matchExpressions:
          # A person (an email, not a service account) and an agent and a grant: what the consent page writes into every token.
          - {{ include "ambit.identity.jwtGate" (dict "requireEmail" true "services" (ne (toString (.Values.serviceAccounts | default dict).enabled) "false")) | quote }}
          - 'has(jwt.ambit_agent) && has(jwt.ambit_grant) && type(jwt.ambit_scope) == list'
          # The audience is exactly this MCP URL (the provider above only needs it to be one of the audiences): a token that lists another audience as well is refused.
          - {{ printf "has(jwt.aud) && ((type(jwt.aud) == list && jwt.aud == [%s]) || (type(jwt.aud) == string && jwt.aud == %s))" (printf "https://%s/mcp" $fd.host | toJson) (printf "https://%s/mcp" $fd.host | toJson) | quote }}
          {{- if .Values.oauth.emergencyBlock }}
          # oauth.emergencyBlock: no token of this issuer passes, whatever else is true.
          - 'false'
          {{- end }}
{{- end }}
---
# Three limits on the public Gateway (docs/front-door.md, "Rate limits"). All of them count in the ratelimit service and
# Valkey, so they are shared by all gateway pods, except the per-pod limit, which is a second line if that service is down.
# 1. The source limit counts EVERY request of a source address, refused ones included (a wrong key, an unknown path). It
#    must run before authentication and before the route is matched, and agentgateway v1.7.0 allows no rate limit in that
#    phase. So the Gateway asks the ratelimit service over HTTP (extAuth, phase PreRouting): the service's /json endpoint
#    counts one hit for the source address and answers 200, or 429 when the source is over its limit.
# 2. The key limit counts requests with one valid key (after authentication). Requests without a valid key share one
#    counter ("" below), capped like a key.
# 3. The per-pod limit counts every request that reaches the limit check, in each pod.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-public-source-limit
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: ambit-public }]
  traffic:
    phase: PreRouting
    extAuth:
      backendRef: { name: ambit-ratelimit, port: 8080 }
      # FailOpen: the ratelimit service cannot be reached, so the request passes (and the per-pod limit still applies).
      # If the service answers but Valkey is down, it answers 400 and the request is refused whatever this says.
      failureMode: {{ $rl.failureMode | default "FailOpen" }}
      http:
        path: '"/json"'
        # The bucket says what kind of request it is (see the ConfigMap below); the source is the address of the connection (or the PROXY
        # protocol header), never a header the caller wrote.
        body: {{ printf "'{\"domain\": \"ambit-public\", \"descriptors\": [{\"entries\": [{\"key\": \"fd_bucket\", \"value\": %s}, {\"key\": \"fd_source\", \"value\": string(source.address)}]}]}'" (include "ambit.frontdoor.bucket" .) }}
        # Only this header goes to the ratelimit service. Without the list, agentgateway sends Authorization: the caller's key.
        allowedRequestHeaders: [user-agent]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-public-limits
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: ambit-public }]
  traffic:
    rateLimit:
      global:
        domain: ambit-public
        backendRef: { name: ambit-ratelimit, port: 8081 }
        failureMode: {{ $rl.failureMode | default "FailOpen" }}
        descriptors:
          # "" for a request without a valid key: all of those share one counter, capped like a key.
          - unit: Requests
            {{- if $oauth }}
            # A request with a token counts for its agent (one connection of one person to one platform), not in one counter that every token
            # of the install would share. A request with neither a key nor a token (the sign-in pages, the metadata) is "none": it has no
            # credential counter at all (unlimited below): the source limit and its buckets count it.
            entries: [{ name: fd_credential, expression: 'has(apiKey.keyId) ? apiKey.keyId : (has(jwt.ambit_agent) ? "agent:" + string(jwt.ambit_agent) : "none")' }]
            {{- else }}
            entries: [{ name: fd_credential, expression: 'has(apiKey.keyId) ? apiKey.keyId : ""' }]
            {{- end }}
      local:
        - requests: {{ $rl.perPodPerSecond }}
          unit: Seconds
{{- if eq ($fd.clientAddress | default "direct") "proxyProtocol" }}
---
# The load balancer sends the PROXY protocol: the client's address is in the header, not in the connection.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-public-proxy-protocol
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: ambit-public }]
  frontend:
    proxyProtocol: { mode: Strict, version: All }
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambit-ratelimit-front-door
data:
  front-door.yaml: |
    domain: ambit-public
    descriptors:
      {{- if $oauth }}
      - key: fd_credential
        value: none
        rate_limit: { unlimited: true }
      {{- end }}
      - key: fd_credential
        rate_limit: { unit: minute, requests_per_unit: {{ $rl.perCredentialPerMinute }} }
      # One counter per source address inside each bucket. Requests of one kind never use up the limit of another.
      - key: fd_bucket
        value: mcp
        descriptors:
          - { key: fd_source, rate_limit: { unit: minute, requests_per_unit: {{ $rl.perSourcePerMinute }} } }
      {{- if $oauth }}
      - key: fd_bucket
        value: discovery
        descriptors:
          - { key: fd_source, rate_limit: { unit: minute, requests_per_unit: {{ $orl.discoveryPerMinute }} } }
      - key: fd_bucket
        value: signin
        descriptors:
          - { key: fd_source, rate_limit: { unit: minute, requests_per_unit: {{ $orl.signInPerMinute }} } }
      - key: fd_bucket
        value: token
        descriptors:
          - { key: fd_source, rate_limit: { unit: minute, requests_per_unit: {{ $orl.tokenPerMinute }} } }
      - key: fd_bucket
        value: bearer
        descriptors:
          - { key: fd_source, rate_limit: { unit: minute, requests_per_unit: {{ $orl.bearerPerMinute }} } }
      - key: fd_bucket
        value: registration
        descriptors:
          - { key: fd_source, rate_limit: { unit: hour, requests_per_unit: {{ ((($.Values.oauth).registration).dynamic).perSourcePerHour | default 10 }} } }
      {{- end }}
{{- end }}
