apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: ambit
spec:
  deployment:
    spec:
      replicas: {{ .Values.gateway.replicas }}
      # A rolling update starts a new pod before stopping an old one, so capacity never drops.
      strategy:
        type: RollingUpdate
        rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  {{- with .Values.gateway.resources }}
  resources: {{ toJson . }}
  {{- end }}
  {{- with .Values.gateway.serviceAccount.annotations }}
  serviceAccount:
    metadata:
      annotations: {{ toJson . }}
  {{- end }}
  # agentgateway v1.6.0 converts /v1/messages to Responses for OpenAI's own API (provider OpenAI without a
  # baseURL), which drops extended-thinking history; this keeps v1.5.0's Chat Completions. Self-hosted Models do
  # not need it: they list their formats (Model.spec.formats). agentgateway v1.7 removes the setting.
  env:
    - name: AGENTGATEWAY_MESSAGES_PREFER_COMPLETIONS
      value: "true"
  {{- if gt (int .Values.gateway.replicas) 1 }}
  # Voluntary disruptions (node drains, upgrades) leave at least one gateway pod serving.
  podDisruptionBudget:
    spec:
      minAvailable: 1
  {{- end }}
  service:
    spec:
      type: {{ .Values.gateway.service.type }}
      {{- if or .Values.gateway.service.nodePort .Values.gateway.tls.nodePort }}
      ports:
        {{- with .Values.gateway.service.nodePort }}
        - port: {{ $.Values.gateway.port }}
          nodePort: {{ . }}
        {{- end }}
        {{- if and .Values.gateway.tls.enabled .Values.gateway.tls.nodePort }}
        - port: {{ .Values.gateway.tls.port }}
          nodePort: {{ .Values.gateway.tls.nodePort }}
        {{- end }}
      {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ambit
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: ambit
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.gateway.tls.enabled }}
    {{- if not .Values.gateway.tls.certificateSecret }}
    {{- fail "gateway.tls.enabled=true needs gateway.tls.certificateSecret" }}
    {{- end }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.tls.port }}
      tls:
        mode: Terminate
        certificateRefs: [{ name: {{ .Values.gateway.tls.certificateSecret | quote }} }]
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
