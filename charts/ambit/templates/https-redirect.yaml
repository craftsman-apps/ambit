{{- if .Values.gateway.tls.enabled }}
# With TLS on, plain HTTP on the Ambit hosts only redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ambit-https-redirect
spec:
  parentRefs: [{ name: ambit, sectionName: http }]
  hostnames:
    - {{ .Values.console.host | quote }}
    {{- if .Values.llm.enabled }}
    - {{ .Values.llm.host | quote }}
    {{- end }}
    {{- if .Values.mcp.enabled }}
    - {{ .Values.mcp.host | quote }}
    {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, port: {{ .Values.gateway.tls.port }}, statusCode: 301 }
{{- end }}
