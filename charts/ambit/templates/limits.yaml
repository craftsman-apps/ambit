{{- if .Values.limits.enabled }}
# Budgets (journey A3): envoy's ratelimit service counts LLM requests per group and per user in Valkey,
# so the limit holds across every gateway replica. Its config is generated by ambit-controller from
# Budget objects (ConfigMap ambit-ratelimit-config).
# ponytail: Valkey without persistence — a restart resets today's counts; add a PVC or managed Valkey
# (ElastiCache) when budgets must survive restarts.
{{- if not .Values.limits.valkey.external.address }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambit-valkey
  labels: { app.kubernetes.io/name: ambit-valkey }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ambit-valkey }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ambit-valkey }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: valkey
          image: {{ .Values.limits.valkey.image | quote }}
          args: [--save, "", --appendonly, "no"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { tcpSocket: { port: redis } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: ambit-valkey }
spec:
  selector: { app.kubernetes.io/name: ambit-valkey }
  ports: [{ name: redis, port: 6379 }]
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambit-ratelimit
  labels: { app.kubernetes.io/name: ambit-ratelimit }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ambit-ratelimit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ambit-ratelimit }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ratelimit
          image: {{ .Values.limits.ratelimit.image | quote }}
          command: [/bin/ratelimit]
          env:
            - { name: REDIS_SOCKET_TYPE, value: tcp }
            - { name: REDIS_URL, value: {{ include "ambit.valkey.address" . | quote }} }
            {{- with .Values.limits.valkey.external }}
            {{- if and .address .tls }}
            - { name: REDIS_TLS, value: "true" }
            {{- if include "ambit.valkey.ca" $ }}
            - { name: REDIS_TLS_CACERT, value: /etc/ambit/valkey-ca/ca.crt }
            {{- end }}
            {{- end }}
            {{- if and .address .passwordSecret }}
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: {{ .passwordSecret }}, key: password } }
            {{- end }}
            {{- end }}
            - { name: USE_STATSD, value: "false" }
            - { name: LOG_LEVEL, value: info }
            - { name: GRPC_PORT, value: "8081" }
            - { name: PORT, value: "8080" }
            - { name: RUNTIME_ROOT, value: /data }
            - { name: RUNTIME_SUBDIRECTORY, value: ratelimit }
            # ConfigMap volumes update by swapping a symlink; watch the directory, not the root, and skip
            # the volume's hidden ..data copies, which would load the domain twice and be rejected.
            - { name: RUNTIME_WATCH_ROOT, value: "false" }
            - { name: RUNTIME_IGNOREDOTFILES, value: "true" }
          ports: [{ name: grpc, containerPort: 8081 }, { name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthcheck, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
          volumeMounts:
            - { name: config, mountPath: /data/ratelimit/config }
            {{- if include "ambit.valkey.ca" . }}
            - { name: valkey-ca, mountPath: /etc/ambit/valkey-ca, readOnly: true }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: ambit-ratelimit-config, optional: true }
        {{- with include "ambit.valkey.ca" . }}
        - { name: valkey-ca, secret: { secretName: {{ . }}, items: [{ key: ca.crt, path: ca.crt }] } }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: ambit-ratelimit }
spec:
  selector: { app.kubernetes.io/name: ambit-ratelimit }
  ports: [{ name: grpc, port: 8081, appProtocol: grpc }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ambit-ratelimit }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ambit-ratelimit }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { gateway.networking.k8s.io/gateway-name: ambit } } }]
      ports: [{ port: 8081 }]
    - ports: [{ port: 8080 }]  # health checks
{{- if not .Values.limits.valkey.external.address }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ambit-valkey }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ambit-valkey }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: ambit-ratelimit } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: ambit-console } }
      ports: [{ port: 6379 }]
{{- end }}
{{- end }}
