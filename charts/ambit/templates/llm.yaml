{{- if .Values.llm.enabled }}
{{- $jwt := fromJson (include "ambit.jwt" (dict "root" $ "jwt" .Values.llm.jwt "name" "llm")) }}
{{- if not (and $jwt.issuer $jwt.jwksURL) }}
{{- fail "llm.enabled=true needs llm.jwt.issuer and llm.jwt.jwksURL: Ambit never serves LLM traffic without token validation" }}
{{- end }}
# LLM traffic: clients send OpenAI-compatible requests to <host>/v1. Every model is an AgentgatewayModel
# generated by ambit-controller from a Model object; access is checked per model.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ambit-llm
spec:
  parentRefs: [{ name: ambit{{ if .Values.gateway.tls.enabled }}, sectionName: https{{ end }} }]
  hostnames: [{{ .Values.llm.host | quote }}]
  rules:
    - name: models
      # Match "/" (not "/v1"): the gateway strips the matched prefix before its model router reads the path,
      # and "/chat/completions" is not a path it parses, so requests passed through unparsed: no token
      # counts, no LLM policies (found 2026-10-01). Clients still call <host>/v1/chat/completions.
      matches: [{ path: { type: PathPrefix, value: / } }]
      # The token broker trusts X-Ambit-User from gateway pods; a client's own must never reach a model,
      # whose baseURL could point anywhere.
      # After authentication: a valid JWT is already removed by the gateway; what is left in Authorization or x-api-key is a key, which must never reach a model or an MCP server. Providers' own credentials are added later (backend auth).
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier: { remove: [X-Ambit-User, x-api-key, authorization] }
      backendRefs: [{ group: agentgateway.dev, kind: AgentgatewayModel, name: "*" }]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-llm-auth
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: ambit-llm }]
  traffic:
    # Only the APIs the gateway parses. Any other path would pass through to the provider with the model's
    # credential, unlogged and uncounted (the route must match "/" above). /v1/completions is not parsed.
    # A request must also pass the identity gate: a valid key, or else a valid JWT.
    {{- include "ambit.gatewayAuth" (dict "root" $ "jwt" $jwt "scope" "llm" "extra" (list "request.path in [\"/v1/chat/completions\", \"/v1/messages\", \"/v1/responses\", \"/v1/embeddings\", \"/v1/models\"]")) | nindent 4 }}
---
# The routing label (x-ambit-route) is set only by Ambit (ambit-router, PR 2). A client's own copy is removed at
# the Gateway, before routing. PreRouting matters: a Gateway-level transformation in the normal phase is replaced
# by any route-level one (the budgets policy has one while a dollar cap exists), and the header then got through
# (found 2026-10-06).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-llm-route-headers
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: ambit }]
  traffic:
    phase: PreRouting
    transformation:
      request:
        remove: [x-ambit-route, x-ambit-route-reason, x-ambit-config]
      {{- if .Values.limits.enabled }}
      # A Budget refusal from agentgateway v1.6.0 is a 429 with an empty body, no content type, and x-ratelimit-*
      # headers in the ratelimit service's numbers (dollars in units of $0.00001; requests one less than the Budget).
      # Give it an error body in the API's format, and remove those headers from every response: a wrong number is
      # worse than none. Retry-After (seconds to midnight UTC) stays. Response policies of the Gateway's PreRouting
      # phase run on every response, refusals included. Only the LLM endpoints get a body (never /v1/models or another
      # path). Every expression must evaluate: a failed body expression turns the response into a 500. The request
      # path is read last, only for such a 429, which always has the request (agentgateway snapshots it for policy
      # refusals and before calling a model).
      response:
        metadata:
          ambitBudgetRefusal: 'response.code == 429 && !("content-type" in response.headers) && "retry-after" in response.headers && "x-ratelimit-remaining" in response.headers && response.headers["x-ratelimit-remaining"] == "0" && request.path in ["/v1/chat/completions", "/v1/completions", "/v1/responses", "/v1/embeddings", "/v1/messages"]'
        # The CRD takes a list of {name, value} here (agentgateway's standalone config takes a map).
        set:
          - name: content-type
            value: 'metadata.ambitBudgetRefusal ? "application/json" : ("content-type" in response.headers ? response.headers["content-type"] : null)'
        remove: [x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset]
        body: 'metadata.ambitBudgetRefusal ? (request.path == "/v1/messages" ? {"type": "error", "error": {"type": "rate_limit_error", "message": "A daily Budget limit was reached: the request limit or the spending limit, for you or for your group. Requests are refused until midnight UTC (see the Retry-After header)."}} : {"error": {"message": "A daily Budget limit was reached: the request limit or the spending limit, for you or for your group. Requests are refused until midnight UTC (see the Retry-After header).", "type": "insufficient_quota", "code": "budget_exceeded"}}) : null'
      {{- end }}
{{- end }}
