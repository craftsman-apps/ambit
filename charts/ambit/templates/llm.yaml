{{- if .Values.llm.enabled }}
{{- $jwt := fromJson (include "ambit.jwt" (dict "root" $ "jwt" .Values.llm.jwt "name" "llm")) }}
{{- if not (and $jwt.issuer $jwt.jwksURL) }}
{{- fail "llm.enabled=true needs llm.jwt.issuer and llm.jwt.jwksURL: Ambit never serves LLM traffic without token validation" }}
{{- end }}
{{- $paths := `"/v1/chat/completions", "/v1/messages", "/v1/responses", "/v1/embeddings", "/v1/models"` }}
# LLM traffic: clients send OpenAI-compatible requests to <host>/v1. Every model is an AgentgatewayModel
# generated by ambit-controller from a Model object; access is checked per model.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ambit-llm
spec:
  parentRefs: [{ name: ambit{{ if .Values.gateway.tls.enabled }}, sectionName: https{{ end }} }]
  hostnames: [{{ .Values.llm.host | quote }}]
  rules:
    - name: models
      # Match "/" (not "/v1"): the gateway strips the matched prefix before its model router reads the path,
      # and "/chat/completions" is not a path it parses, so requests passed through unparsed: no token
      # counts, no LLM policies (found 2026-10-01). Clients still call <host>/v1/chat/completions.
      matches: [{ path: { type: PathPrefix, value: / } }]
      # The token broker trusts X-Ambit-User from gateway pods; a client's own must never reach a model,
      # whose baseURL could point anywhere.
      # After authentication: a valid JWT is already removed by the gateway; what is left in Authorization or x-api-key is a key, which must never reach a model or an MCP server. Providers' own credentials are added later (backend auth).
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier: { remove: [X-Ambit-User, x-api-key, authorization] }
      backendRefs: [{ group: agentgateway.dev, kind: AgentgatewayModel, name: "*" }]
---
# Codex fetches the model list with GET /v1/models?client_version=... and reads it as {"models": [...]}. It logs
# "failed to decode models response" for the OpenAI format the gateway serves ({"object": "list", "data": [...]}).
# This route catches only that request and answers {"models": []}: Codex reads it and uses the model name from its own
# settings. Every other client, and a /v1/models request without client_version, still get the OpenAI list from the
# route above. A separate route is needed because the gateway's models attach to the route above, which must have one rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ambit-llm-codex-models
spec:
  parentRefs: [{ name: ambit{{ if .Values.gateway.tls.enabled }}, sectionName: https{{ end }} }]
  hostnames: [{{ .Values.llm.host | quote }}]
  rules:
    - matches: [{ path: { type: Exact, value: /v1/models }, method: GET, queryParams: [{ name: client_version, type: RegularExpression, value: ".+" }] }]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-llm-codex-models
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: ambit-llm-codex-models }]
  traffic:
    # The same identity gate as the LLM route: a request without a valid key or token gets no answer.
    {{- include "ambit.gatewayAuth" (dict "root" $ "jwt" $jwt "scope" "llm" "extra" (list)) | nindent 4 }}
    directResponse:
      status: 200
      body: '{"models":[]}'
      headers: [{ name: content-type, value: application/json }]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-llm-auth
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: ambit-llm }]
  traffic:
    # Only the APIs the gateway parses. Any other path would pass through to the provider with the model's
    # credential, unlogged and uncounted (the route must match "/" above). /v1/completions is not parsed.
    # A request must also pass the identity gate: a valid key, or else a valid JWT.
    {{- include "ambit.gatewayAuth" (dict "root" $ "jwt" $jwt "scope" "llm" "extra" (list (printf "request.path in [%s]" $paths))) | nindent 4 }}
    # The model name the client asked for (a ModelRouter such as "auto"), kept for the access log (ambit.router)
    # and audit-only mode: after routing, llm.requestModel is the model that answered. agentgateway v1.6.0 kept it
    # in metadata.agentgateway_user_model; v1.7.0 no longer does. The key is missing when the body names no model.
    transformation:
      request:
        metadata:
          ambit_requested_model: llm.requestModel
---
# The routing label (x-ambit-route) is set only by Ambit (ambit-router, PR 2). A client's own copy is removed at
# the Gateway, before routing. PreRouting matters: a Gateway-level transformation in the normal phase is replaced
# by any route-level one (the budgets policy has one while a dollar cap exists), and the header then got through
# (found 2026-10-06).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-llm-route-headers
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: ambit }]
  traffic:
    phase: PreRouting
    transformation:
      request:
        remove: [x-ambit-route, x-ambit-route-reason, x-ambit-config, x-ambit-classifier-input-tokens, x-ambit-classifier-output-tokens]
      # An unknown path on the LLM host is refused by the authorization policy above (403, or 401 without a valid
      # token), which reads as a bad key when the base URL is wrong (a doubled /v1). Such a refusal becomes a 404
      # with a body that names the path. The route must match "/" (see above) and agentgateway v1.6.0 applies a
      # direct response only after authorization, so the status is changed on the way out instead:
      # Gateway PreRouting response policies run on every response, refusals included, and ":status" can be set.
      # Known paths keep their 401/403. Every expression here must evaluate for every response: a failed body
      # expression turns the response into a 500. The metadata key is missing when an expression failed (for example a
      # refusal that has no request snapshot), so every use checks has() first.
      {{- if .Values.limits.enabled }}
      # A Budget refusal from agentgateway v1.6.0 is a 429 with an empty body, no content type, and x-ratelimit-*
      # headers in the ratelimit service's numbers (dollars in units of $0.00001; requests one less than the Budget).
      # Give it an error body in the API's format, and remove those headers from every response: a wrong number is
      # worse than none. Retry-After stays: the reset of the limit that refused (seconds to the next minute for a per-minute
      # limit, which is checked first; to midnight UTC for a daily limit). Response policies of the Gateway's PreRouting
      # phase run on every response, refusals included. Only the LLM endpoints get a body (never /v1/models or another
      # path). Every expression must evaluate: a failed body expression turns the response into a 500. The request
      # path is read last, only for such a 429, which always has the request (agentgateway snapshots it for policy
      # refusals and before calling a model).
      {{- end }}
      # A 403 for a call to a known path that carried no key and no token (no x-api-key, and no Authorization or only
      # "Bearer " with nothing after it; no valid JWT or key either) gets a body that says so and how to fix it, in
      # the API's error format (#303: opencode 2's background service sent an empty key). The status stays 403
      # (docs/upgrading.md). Invalid keys and tokens and access-rule refusals keep "authorization failed".
      response:
        metadata:
          ambitUnknownPath: 'response.code in [401, 403] && !(request.path in [{{ $paths }}]) && request.host != null && request.host.startsWith({{ .Values.llm.host | quote }})'
          ambitNoKey: 'response.code == 403 && request.path in [{{ $paths }}] && request.host != null && request.host.startsWith({{ .Values.llm.host | quote }}) && !has(jwt.sub) && !has(apiKey.keyId) && !("x-api-key" in request.headers && request.headers["x-api-key"].trim() != "") && !("authorization" in request.headers && request.headers["authorization"].replace("Bearer", "").trim() != "")'
          {{- if .Values.limits.enabled }}
          ambitBudgetRefusal: 'response.code == 429 && !("content-type" in response.headers) && "retry-after" in response.headers && "x-ratelimit-remaining" in response.headers && response.headers["x-ratelimit-remaining"] == "0" && request.path in ["/v1/chat/completions", "/v1/completions", "/v1/responses", "/v1/embeddings", "/v1/messages"]'
          {{- end }}
        # The CRD takes a list of {name, value} here (agentgateway's standalone config takes a map).
        set:
          - name: ":status"
            value: 'has(metadata.ambitUnknownPath) && metadata.ambitUnknownPath ? uint(404) : null'
          - name: content-type
            value: '(has(metadata.ambitUnknownPath) && metadata.ambitUnknownPath) || (has(metadata.ambitNoKey) && metadata.ambitNoKey){{ if .Values.limits.enabled }} || metadata.ambitBudgetRefusal{{ end }} ? "application/json" : ("content-type" in response.headers ? response.headers["content-type"] : null)'
        {{- if .Values.limits.enabled }}
        remove: [x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset]
        {{- end }}
        {{- $noKey := printf "authorization failed: no Ambit key or token was sent. Send your Ambit key in the header \\\"Authorization: Bearer ambit_...\\\" or \\\"x-api-key: ambit_...\\\". Make a key on the Keys page of the Ambit console (%s/keys), or run \\\"ambit connect <tool>\\\"." .Values.console.url }}
        body: 'has(metadata.ambitUnknownPath) && metadata.ambitUnknownPath ? {"error": {"type": "not_found", "message": "no such path on the Ambit LLM gateway: " + request.path + "; check the base URL"}} : (has(metadata.ambitNoKey) && metadata.ambitNoKey) ? (request.path == "/v1/messages" ? {"type": "error", "error": {"type": "authentication_error", "message": "{{ $noKey }}"}} : {"error": {"type": "invalid_request_error", "code": "no_api_key", "message": "{{ $noKey }}"}}) : {{ if .Values.limits.enabled }}(metadata.ambitBudgetRefusal ? (request.path == "/v1/messages" ? {"type": "error", "error": {"type": "rate_limit_error", "message": "A Budget limit was reached: a request or spending limit per minute or per day, for you or for your group. Try again after the number of seconds in the Retry-After header."}} : {"error": {"message": "A Budget limit was reached: a request or spending limit per minute or per day, for you or for your group. Try again after the number of seconds in the Retry-After header.", "type": "insufficient_quota", "code": "budget_exceeded"}}) : null){{ else }}null{{ end }}'
{{- with .Values.llm.promptGuard }}{{ if .enabled }}
{{- if not (or .builtins .patterns .webhook.service) }}
{{- fail "llm.promptGuard.enabled=true needs builtins, patterns or webhook.service: a guard with nothing to check would only look like protection" }}
{{- end }}
{{- range .patterns }}
{{- /* Go and the gateway's Rust regex share their syntax (no look-around, no back-references): a pattern Go refuses
fails here, at install, instead of in the gateway. */}}
{{- $_ := mustRegexMatch . "" }}
{{- end }}
---
# Prompt guard (llm.promptGuard): checks the prompt of every request on the LLM route before it reaches a model.
# Ambit sets no promptGuard on a model (AgentgatewayModel): a model's own would replace this one for that model.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ambit-llm-guard
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: ambit-llm }]
  backend:
    ai:
      promptGuard:
        request:
          {{- if or .builtins .patterns }}
          - regex:
              action: {{ get (dict "audit" "Audit" "reject" "Reject" "mask" "Mask") .mode }}
              {{- with .builtins }}
              builtins: {{ toJson . }}
              {{- end }}
              {{- with .patterns }}
              matches: {{ toJson . }}
              {{- end }}
            response: { message: {{ .rejectMessage | quote }} }
          {{- end }}
          {{- with .webhook }}{{ if .service }}
          # The webhook answers pass, mask or reject itself; in audit mode the gateway only records its answer.
          - webhook:
              action: {{ eq $.Values.llm.promptGuard.mode "audit" | ternary "Audit" "Reject" }}
              backendRef: { name: {{ .service | quote }}{{ with .namespace }}, namespace: {{ . | quote }}{{ end }}, port: {{ .port }} }
              failureMode: {{ .failureMode }}
          {{- end }}{{ end }}
{{- end }}{{ end }}
{{- end }}
