{{- if and .Values.mcp.enabled .Values.protection.enabled }}
# ambit-guard: MCP guardrails (journeys U6, A6). Hides and refuses tools changed since approval, and masks
# personal data in tool results. FailClosed: if the guard is down, tool calls fail rather than pass
# unchecked definitions or unmasked data.
apiVersion: v1
kind: ServiceAccount
metadata: { name: ambit-guard }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ambit-guard }
rules:
  - apiGroups: [ambitproject.dev]
    resources: [servers, accessrules]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ambit-guard }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ambit-guard }
subjects: [{ kind: ServiceAccount, name: ambit-guard }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambit-guard
  labels: { app.kubernetes.io/name: ambit-guard }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ambit-guard }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ambit-guard }
    spec:
      serviceAccountName: ambit-guard
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: guard
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          command: [/ambit-guard]
          env:
            - name: AMBIT_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # Makes Go collect garbage before the container limit, so a large result does not end in an out-of-memory kill.
            - { name: GOMEMLIMIT, value: "{{ div (mul .Values.protection.memoryLimitMiB 80) 100 }}MiB" }
            {{- if .Values.evidence.enabled }}
            # One record per compressed tool result text (sizes and groups) for the Savings page.
            - { name: AMBIT_OTLP_ENDPOINT, value: "ambit-otel-collector:4317" }
            {{- end }}
            {{- with .Values.protection.presidio }}{{ if .analyzerURL }}
            - { name: AMBIT_PRESIDIO_ANALYZER_URL, value: {{ .analyzerURL | quote }} }
            - { name: AMBIT_PRESIDIO_ANONYMIZER_URL, value: {{ .anonymizerURL | quote }} }
            - { name: AMBIT_PRESIDIO_LANGUAGE, value: {{ .language | quote }} }
            - { name: AMBIT_PRESIDIO_TIMEOUT, value: {{ .timeout | default "10s" | quote }} }
            {{- end }}{{ end }}
            {{- with .Values.protection.injectionGuard }}{{ if .enabled }}
            {{- /* helm upgrade --reuse-values from an older release has none of the keys under injectionGuard: use the defaults */}}
            {{- $w := .webhook | default dict }}
            {{- $builtins := ternary .builtins true (hasKey . "builtins") }}
            {{- if not (or $builtins .patterns $w.service) }}
            {{- fail "protection.injectionGuard.enabled=true needs builtins, patterns or webhook.service: a guard with nothing to check would only look like protection" }}
            {{- end }}
            {{- range .patterns }}
            {{- /* Go's own parser: the guard compiles the pattern with it. A pattern it refuses fails here, at install. */}}
            {{- $_ := mustRegexMatch . "" }}
            {{- end }}
            {{- $hook := dict }}
            {{- if $w.service }}
            {{- $hook = dict "url" (printf "http://%s.%s.svc:%v/request" $w.service ($w.namespace | default $.Release.Namespace) ($w.port | default 8000)) "timeout" ($w.timeout | default "2s") "failureMode" ($w.failureMode | default "FailClosed") }}
            {{- end }}
            - name: AMBIT_INJECTION_GUARD
              value: {{ dict "mode" (.mode | default "audit") "builtins" $builtins "disabledBuiltins" (.disabledBuiltins | default list) "patterns" (.patterns | default list) "webhook" $hook | toJson | quote }}
            {{- end }}{{ end }}
          ports: [{ name: grpc, containerPort: 9090 }, { name: health, containerPort: 8081 }]
          readinessProbe: { httpGet: { path: /, port: health } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: {{ .Values.protection.memoryLimitMiB }}Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: ambit-guard }
spec:
  selector: { app.kubernetes.io/name: ambit-guard }
  ports: [{ name: grpc, port: 9090, appProtocol: grpc }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ambit-guard }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ambit-guard }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { gateway.networking.k8s.io/gateway-name: ambit } } }]
      ports: [{ port: 9090 }]
    - ports: [{ port: 8081 }]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: { name: ambit-mcp-guard }
spec:
  targetRefs: [{ group: agentgateway.dev, kind: AgentgatewayBackend, name: ambit-mcp }]
  backend:
    mcp:
      guardrails:
        processors:
          - remote:
              backendRef: { name: ambit-guard, port: 9090 }
              failureMode: FailClosed
              # The caller's groups and email ("" without one) from the verified token, for argument limits in access rules.
              # callId and tool: the guard's own values from the request, back on the response for its compression records.
              # recordEmail and keyId: the caller as the access log records it, for the same records (#203).
              metadata:
                groups: {{ include "ambit.identity.groups" . | quote }}
                email: {{ include "ambit.identity.email" (dict "verified" (ne (toString (.Values.accessRules | default dict).usersRequireVerifiedEmail) "false")) | quote }}
                callId: {{ include "ambit.callId" . | quote }}
                tool: {{ `has(mcpGuardrails.tool) ? mcpGuardrails.tool : ""` | quote }}
                {{- if ne (toString ((.Values.protection.compressionAudit | default dict).caller)) "false" }}
                recordEmail: {{ include "ambit.identity.logEmail" . | quote }}
                keyId: {{ include "ambit.identity.logKeyId" . | quote }}
                {{- end }}
              # The guard needs no credentials.
              disallowedRequestHeaders: [authorization, cookie, x-ambit-user]
            methods:
              tools/list: Response
              tools/call: Full
              # Not reachable today (access rules grant tools only), but masked before any rule can grant them (issue 297).
              resources/read: Response
              prompts/get: Response
{{- end }}
