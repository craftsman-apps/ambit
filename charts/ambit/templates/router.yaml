{{- if and .Values.llm.enabled .Values.routing.router.enabled }}
# ambit-router: labels chat prompts for ModelRouters of type LLM (docs/routing.md). The controller scales it: 0
# replicas until such a router exists. agentgateway calls it with failureMode FailOpen, so a missing pod means
# "no label", never a failed request.
apiVersion: v1
kind: ServiceAccount
metadata: { name: ambit-router }
---
# Its configuration and the classifier keys, nothing else: list and watch are limited to these names too.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ambit-router }
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [ambit-router-config]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ambit-router-credentials]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ambit-router }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ambit-router }
subjects: [{ kind: ServiceAccount, name: ambit-router }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambit-router
  labels: { app.kubernetes.io/name: ambit-router }
spec:
  # No replicas: the controller owns them (Argo CD: ignoreDifferences on /spec/replicas, docs/routing.md).
  selector:
    matchLabels: { app.kubernetes.io/name: ambit-router }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ambit-router }
      {{- with .Values.routing.router.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: ambit-router
      # preStop 5 s + drain 25 s + 5 s margin: held requests finish during a rollout or scale-down.
      terminationGracePeriodSeconds: 35
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: router
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          command: [/ambit-router]
          env:
            - name: AMBIT_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports: [{ name: grpc, containerPort: 9000 }, { name: health, containerPort: 8081 }]
          readinessProbe: { httpGet: { path: /healthz, port: health }, periodSeconds: 2 }
          # Removed from the Service at deletion; this wait lets the gateways see that before SIGTERM.
          lifecycle: { preStop: { sleep: { seconds: 5 } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.routing.router.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: ambit-router }
spec:
  selector: { app.kubernetes.io/name: ambit-router }
  ports: [{ name: grpc, port: 9000, targetPort: 9000, appProtocol: kubernetes.io/h2c }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ambit-router }
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ambit-router }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ambit-router }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ambit-router }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { gateway.networking.k8s.io/gateway-name: ambit } } }]
      ports: [{ port: 9000 }]
    - ports: [{ port: 8081 }]
{{- end }}
