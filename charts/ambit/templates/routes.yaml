apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ambit-console
spec:
  parentRefs:
    - name: ambit
  hostnames:
    - {{ .Values.console.host | quote }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /dex }
      backendRefs:
        - name: ambit-dex
          port: 5556
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: ambit-console
          port: 8080
