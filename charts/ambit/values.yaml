gateway:
  # Gateway pods. They share budgets (ratelimit + Valkey) and MCP sessions (a session key in a Secret),
  # so any replica can answer any request. Two or more also get a PodDisruptionBudget (minAvailable 1).
  replicas: 2
  # Gateway container resources. A rolling update starts one extra pod first, so the nodes need room for one
  # more gateway pod. Memory grows with open MCP sessions: about 7 KiB each, dropped after 30 idle minutes
  # (agentgateway's fixed default). A client that never closes its sessions levels off: at 12 new sessions a
  # second, about 160Mi. A pod over its limit restarts; clients keep their sessions on the other replicas.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Annotations on the gateway's ServiceAccount. For Amazon Bedrock through IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ambit-bedrock
  # EKS Pod Identity needs none. See docs/providers.md.
  serviceAccount:
    annotations: {}
  # Listener port of the Ambit Gateway. Also the port of the generated Service.
  port: 8080
  service:
    # LoadBalancer on EKS; values-kind.yaml switches to NodePort.
    type: LoadBalancer
    nodePort: null
  tls:
    # Serve the console and LLM traffic over HTTPS on tls.port; plain HTTP then redirects to HTTPS.
    enabled: false
    port: 8443
    # A kubernetes.io/tls Secret whose certificate covers console.host and llm.host (e.g. from cert-manager).
    certificateSecret: ""
    nodePort: null

console:
  # Public URL of the console. Dex's issuer is this URL + /dex.
  url: https://console.example.com
  # Hostname matched by the HTTPRoute. Must match the host in console.url.
  host: console.example.com
  image:
    repository: ghcr.io/craftsman-apps/ambit-console
    # Empty: the chart's appVersion, which the release workflow sets to the release version.
    tag: ""
    pullPolicy: IfNotPresent
  # Secret with a ca.crt entry the console should trust in addition to the system CAs, for an internal CA
  # in front of Dex (the console fetches Dex at console.url). Empty means system CAs only.
  caBundleSecret: ""
  # Hours before a console session expires. Group changes in the IdP reach the console at the next
  # sign-in, so keep this short; sign-out and offboarding end sessions immediately regardless.
  sessionHours: 1
  # kind tests only: shows test presets
  testPresets: false

bootstrapAdmin:
  # Local password sign-in (admin@ambit.local) for first setup. Set false once SSO works:
  # the console then deletes the account from Dex and removes its password Secret.
  enabled: true

sso:
  # Dex connectors shown as "Continue with ..." on the login page. See https://dexidp.io/docs/connectors/
  # Never put a secret value here: write "$ENV_NAME" and supply it through dex.envVars from a Secret.
  connectors: []

llm:
  # Serve OpenAI-compatible LLM traffic at <host>/v1. Models and access come from Model and AccessRule objects.
  enabled: false
  host: llm.example.com
  # Tokens the gateway accepts. Either your identity provider's (issuer, audiences, jwksURL), or, with
  # dex: true, Ambit's own Dex (client ambit-cli; local accounts get tokens with the password grant).
  jwt:
    dex: false
    issuer: ""
    audiences: []
    jwksURL: ""
    # Refuse gateway JWTs without a usable email claim. Offboarding, per-person budgets and audit are keyed by email; with false, such tokens are identified by their subject and offboarding cannot block them before they expire.
    requireEmail: true

apiKeys:
  # Personal API keys (console: Keys). false: the gateways accept JWTs only; existing keys are kept but refused.
  enabled: true
  # A key stops when its owner has not signed in to the console for this many days (1-365).
  inactivityDays: 30
  # The longest end date a person may choose: 30, 90 or 365.
  maxDays: 365

routing:
  router:
    # ambit-router labels prompts for ModelRouters of type LLM. Installed but at 0 replicas until such a router
    # exists; the controller scales it (keep replicas out of Argo CD's diff, docs/routing.md).
    enabled: true
    replicas: 2
    # Pod template annotations; changing one rolls ambit-router (tests use it to check a rollout under load).
    podAnnotations: {}
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 128Mi }

gitops:
  # GitOps mode: the console opens pull requests in your configuration repository instead of changing
  # the cluster, and Argo CD (or Flux) applies what is merged. See deploy/argocd/.
  enabled: false
  repository: ""        # owner/name, e.g. acme/platform-config
  branch: main          # the branch Argo CD watches
  path: ambit           # directory of Ambit objects: <path>/accessrules/<name>.yaml, <path>/servers/<name>.yaml
  github:
    apiURL: https://api.github.com   # GitHub Enterprise Server: https://<host>/api/v3
    appID: ""
    # Secret with key private-key.pem: the GitHub App's key. Create it yourself; the chart never holds it.
    privateKeySecret: ambit-github-app
  argocd:
    # namespace/name of the Argo CD Application that syncs the repository, e.g. argocd/ambit-config. The
    # console reads its sync status (read only) to show when a merged change reached the cluster.
    application: ""

prices:
  # HTTPS address of a copy of LiteLLM's model_prices_and_context_window.json (for example an internal
  # mirror). Empty: the console suggests prices from the list built into this release only. Read at start
  # and once a day; redirects are not followed and the file may be at most 10 MiB.
  sourceURL: ""

mcp:
  # Serve MCP at <host>/mcp. Servers and tool access come from Server and AccessRule objects;
  # ToolHive runs each server in a pod that only the gateway can reach.
  enabled: false
  host: mcp.example.com
  # Tokens the gateway accepts. Either your identity provider's (issuer, audiences, jwksURL), or, with
  # dex: true, Ambit's own Dex (client ambit-cli; local accounts get tokens with the password grant).
  jwt:
    dex: false
    issuer: ""
    audiences: []
    jwksURL: ""
    # Refuse gateway JWTs without a usable email claim. Offboarding, per-person budgets and audit are keyed by email; with false, such tokens are identified by their subject and offboarding cannot block them before they expire.
    requireEmail: true

evidence:
  # Audit trail: the gateway's access logs through an OpenTelemetry Collector into ClickHouse, searchable
  # in the console (Audit, Usage). Every call is kept, denied ones included, for `retention`.
  enabled: false
  retention: 8760h  # one year
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.36.6@sha256:5b10577fc3382ee6b26c4916a1d915d90543ade66e85fc29e3a78c4ce08daeb3
    storage: 10Gi
    resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1536Mi } }
    # Use an existing ClickHouse (e.g. ClickHouse Cloud) instead of installing one: set host. The collector
    # writes over the native protocol, the console reads over HTTP(S). The user needs CREATE TABLE in the
    # database once (the collector creates otel_logs with the retention above), then INSERT and SELECT.
    external:
      host: ""
      tls: true
      nativePort: 9440   # 9000 without TLS
      httpPort: 8443     # 8123 without TLS
      database: otel
      user: ambit
      # Secret in the release namespace with key "password". Required with host.
      passwordSecret: ""
      # Optional Secret with key "ca.crt" (PEM) for a ClickHouse behind a private CA.
      caSecret: ""
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }

alerts:
  # Prometheus alert rules for every Ambit component (a PrometheusRule and a PodMonitor, for the Prometheus
  # Operator): restarts, memory kills, memory near the limit, unavailable workloads, the budget store
  # down, and lost audit records. They read kube-state-metrics and cAdvisor (kube-prometheus-stack has both).
  enabled: false
  # Labels your Prometheus selects rules and monitors by, e.g. { release: kube-prometheus-stack }.
  labels: {}

protection:
  # MCP guardrails (ambit-guard): tool pinning and masking of personal data in tool results.
  enabled: false
  # How often each server's tools are read again; a changed definition is hidden at once, and calls to it
  # are refused from the next read.
  toolsRefresh: 10m
  # Leave empty for the built-in masks (national ID numbers, card numbers, emails). Set both to use
  # Microsoft Presidio (names, addresses, more languages).
  presidio:
    analyzerURL: ""
    anonymizerURL: ""
    language: en

limits:
  # Budgets: daily LLM request limits per group and per user (Budget objects), shared by every replica.
  enabled: false
  # When the ratelimit service or Valkey is down: FailOpen lets requests through uncounted (budgets are a
  # cost control, so an outage should not stop all LLM traffic); FailClosed refuses them.
  failureMode: FailOpen
  ratelimit:
    image: envoyproxy/ratelimit:63c7e9cc@sha256:f10186a0c94f339326015a955bf1ad5f694addef220b86d0f84e330fcc0f4939
  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    # Use an existing Valkey or Redis (e.g. Amazon ElastiCache) instead of installing one: set address
    # (host:port). Every gateway replica's budget counts go there, so budgets survive restarts.
    external:
      address: ""
      tls: true
      # Optional Secret with key "password" (Valkey AUTH).
      passwordSecret: ""
      # Optional Secret with key "ca.crt" (PEM) for a private CA.
      caSecret: ""

connections:
  # Namespace for users' SaaS grants and the Connections' client secrets. Empty: <release namespace>-grants.
  grantsNamespace: ""

# Passed to the ToolHive operator subchart (installed when mcp.enabled). Its CRDs are in deploy/crds.
toolhive-operator:
  operator:
    features:
      # Needs cluster-wide RBAC; Ambit keeps the operator inside its own namespace.
      storageVersionMigrator: false
    rbac:
      scope: namespace
      # Must be the namespace Ambit is installed in; the chart refuses to render otherwise.
      allowedNamespaces: [ambit-system]

# Passed to the agentgateway subchart. Set agentgateway.image.registry for a private registry.
agentgateway:
  # AgentgatewayModel is on by default since v1.6.0; kept explicit because Ambit cannot work without it.
  # Ambit needs it: per-model authorization only works on AgentgatewayModel, because route-level
  # authorization runs before the gateway reads the requested model.
  agentgatewayModels:
    enabled: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# Default memory for containers in Ambit's namespace that set none themselves: ToolHive's proxy pods (whose
# resources ToolHive does not expose) and MCP servers. A LimitRange applies it when the pod is created.
containerDefaults:
  requests: { memory: 64Mi }
  limits: { memory: 512Mi }

# Dex, rendered by this chart (templates/dex/). Its config is generated from console, sso and bootstrapAdmin.
dex:
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.45.1
  # Environment variables for secrets referenced as $NAME in sso.connectors (from Secrets, never literal values).
  envVars: []
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
