gateway:
  # Listener port of the Ambit Gateway. Also the port of the generated Service.
  port: 8080
  service:
    # LoadBalancer on EKS; values-kind.yaml switches to NodePort.
    type: LoadBalancer
    nodePort: null
  tls:
    # Serve the console and LLM traffic over HTTPS on tls.port; plain HTTP then redirects to HTTPS.
    enabled: false
    port: 8443
    # A kubernetes.io/tls Secret whose certificate covers console.host and llm.host (e.g. from cert-manager).
    certificateSecret: ""
    nodePort: null

console:
  # Public URL of the console. Dex's issuer is this URL + /dex.
  url: https://console.example.com
  # Hostname matched by the HTTPRoute. Must match the host in console.url.
  host: console.example.com
  image:
    repository: ghcr.io/craftsman-apps/ambit-console
    # Empty: the chart's appVersion, which the release workflow sets to the release version.
    tag: ""
    pullPolicy: IfNotPresent
  # Secret with a ca.crt entry the console should trust in addition to the system CAs, for an internal CA
  # in front of Dex (the console fetches Dex at console.url). Empty means system CAs only.
  caBundleSecret: ""
  # Hours before a console session expires. Group changes in the IdP reach the console at the next
  # sign-in, so keep this short; sign-out and offboarding end sessions immediately regardless.
  sessionHours: 1

bootstrapAdmin:
  # Local password sign-in (admin@ambit.local) for first setup. Set false once SSO works:
  # the console then deletes the account from Dex and removes its password Secret.
  enabled: true

sso:
  # Dex connectors shown as "Continue with ..." on the login page. See https://dexidp.io/docs/connectors/
  # Never put a secret value here: write "$ENV_NAME" and supply it through dex.envVars from a Secret.
  connectors: []

llm:
  # Serve OpenAI-compatible LLM traffic at <host>/v1. Models and access come from Model and AccessRule objects.
  enabled: false
  host: llm.example.com
  # Tokens from the customer's identity provider (not Dex). Required when llm.enabled is true.
  jwt:
    issuer: ""
    audiences: []
    jwksURL: ""

gitops:
  # GitOps mode: the console opens pull requests in your configuration repository instead of changing
  # the cluster, and Argo CD (or Flux) applies what is merged. See deploy/argocd/.
  enabled: false
  repository: ""        # owner/name, e.g. acme/platform-config
  branch: main          # the branch Argo CD watches
  path: ambit           # directory of Ambit objects: <path>/accessrules/<name>.yaml, <path>/servers/<name>.yaml
  github:
    apiURL: https://api.github.com   # GitHub Enterprise Server: https://<host>/api/v3
    appID: ""
    # Secret with key private-key.pem: the GitHub App's key. Create it yourself; the chart never holds it.
    privateKeySecret: ambit-github-app

mcp:
  # Serve MCP at <host>/mcp. Servers and tool access come from Server and AccessRule objects;
  # ToolHive runs each server in a pod that only the gateway can reach.
  enabled: false
  host: mcp.example.com
  # Tokens from the customer's identity provider (not Dex). Required when mcp.enabled is true.
  jwt:
    issuer: ""
    audiences: []
    jwksURL: ""

evidence:
  # Audit trail: the gateway's access logs through an OpenTelemetry Collector into ClickHouse, searchable
  # in the console (Audit, Usage). Every call is kept, denied ones included, for `retention`.
  enabled: false
  retention: 8760h  # one year
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.36.6@sha256:5b10577fc3382ee6b26c4916a1d915d90543ade66e85fc29e3a78c4ce08daeb3
    storage: 10Gi
    resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1536Mi } }
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }

limits:
  # Budgets: daily LLM request limits per group and per user (Budget objects), shared by every replica.
  enabled: false
  # When the ratelimit service or Valkey is down: FailOpen lets requests through uncounted (budgets are a
  # cost control, so an outage should not stop all LLM traffic); FailClosed refuses them.
  failureMode: FailOpen
  ratelimit:
    image: envoyproxy/ratelimit:63c7e9cc@sha256:f10186a0c94f339326015a955bf1ad5f694addef220b86d0f84e330fcc0f4939
  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd

connections:
  # Namespace for users' SaaS grants and the Connections' client secrets. Empty: <release namespace>-grants.
  grantsNamespace: ""

# Passed to the ToolHive operator subchart (installed when mcp.enabled). Its CRDs are in deploy/crds.
toolhive-operator:
  operator:
    features:
      # Needs cluster-wide RBAC; Ambit keeps the operator inside its own namespace.
      storageVersionMigrator: false
    rbac:
      scope: namespace
      # Must be the namespace Ambit is installed in; the chart refuses to render otherwise.
      allowedNamespaces: [ambit-system]

# Passed to the agentgateway subchart. Set agentgateway.image.registry for a private registry.
agentgateway:
  # AgentgatewayModel is experimental and off by default in v1.5.0 (on by default after upstream PR #3492).
  # Ambit needs it: per-model authorization only works on AgentgatewayModel, because route-level
  # authorization runs before the gateway reads the requested model.
  agentgatewayModels:
    enabled: true

# Dex, rendered by this chart (templates/dex/). Its config is generated from console, sso and bootstrapAdmin.
dex:
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.45.1
  # Environment variables for secrets referenced as $NAME in sso.connectors (from Secrets, never literal values).
  envVars: []
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
