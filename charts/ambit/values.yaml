gateway:
  # Gateway pods. They share budgets (ratelimit + Valkey) and MCP sessions (a session key in a Secret),
  # so any replica can answer any request. Two or more also get a PodDisruptionBudget (minAvailable 1).
  replicas: 2
  # Gateway container resources. A rolling update starts one extra pod first, so the nodes need room for one
  # more gateway pod. Memory grows with open MCP sessions: about 7 KiB each, dropped after 30 idle minutes
  # (agentgateway's fixed default). A client that never closes its sessions levels off: at 12 new sessions a
  # second, about 160Mi. A pod over its limit restarts; clients keep their sessions on the other replicas.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Annotations on the gateway's ServiceAccount. For Amazon Bedrock through IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ambit-bedrock
  # EKS Pod Identity needs none. See docs/providers.md.
  serviceAccount:
    annotations: {}
  # Listener port of the Ambit Gateway. Also the port of the generated Service.
  port: 8080
  service:
    # LoadBalancer on EKS; values-kind.yaml switches to NodePort.
    type: LoadBalancer
    nodePort: null
  tls:
    # Serve the console and LLM traffic over HTTPS on tls.port; plain HTTP then redirects to HTTPS.
    enabled: false
    port: 8443
    # A kubernetes.io/tls Secret whose certificate covers console.host and llm.host (e.g. from cert-manager).
    certificateSecret: ""
    nodePort: null

console:
  # Must be 1: personal API keys and sessions need a single console (the chart refuses more).
  replicas: 1
  # Public URL of the console. Dex's issuer is this URL + /dex.
  url: https://console.example.com
  # Hostname matched by the HTTPRoute. Must match the host in console.url.
  host: console.example.com
  image:
    repository: ghcr.io/craftsman-apps/ambit-console
    # Empty: the chart's appVersion, which the release workflow sets to the release version.
    tag: ""
    pullPolicy: IfNotPresent
  # Secret with a ca.crt entry the console should trust in addition to the system CAs, for an internal CA
  # in front of Dex (the console fetches Dex at console.url). Empty means system CAs only.
  caBundleSecret: ""
  # Hours before a console session expires. Group changes in the IdP reach the console at the next
  # sign-in, so keep this short; sign-out and offboarding end sessions immediately regardless.
  sessionHours: 1
  # kind tests only: shows test presets
  testPresets: false
  # Test-only endpoints (expire a key on demand); never enable in production.
  testHooks: false
  savings:
    # The Savings page prices tool-result compression with each group's own average input price (from its LLM
    # requests through Ambit). A group without priced LLM requests uses this price, in US dollars per million input
    # tokens, for example "3.00". Empty: such a group is shown in tokens only.
    referenceInputPricePerMillion: ""

bootstrapAdmin:
  # Local password sign-in (admin@ambit.local) for first setup. Set false once SSO works:
  # the console then deletes the account from Dex and removes its password Secret.
  enabled: true

sso:
  # Dex connectors shown as "Continue with ..." on the login page. See https://dexidp.io/docs/connectors/
  # Never put a secret value here: write "$ENV_NAME" and supply it through dex.envVars from a Secret.
  connectors: []

llm:
  # Serve OpenAI-compatible LLM traffic at <host>/v1. Models and access come from Model and AccessRule objects.
  enabled: false
  host: llm.example.com
  # Tokens the gateway accepts. Either your identity provider's (issuer, audiences, jwksURL), or, with
  # dex: true, Ambit's own Dex (client ambit-cli; local accounts get tokens with the password grant).
  jwt:
    dex: false
    issuer: ""
    audiences: []
    jwksURL: ""
    # Refuse gateway JWTs without a usable email claim. Offboarding, per-person budgets and audit are keyed by email; with false, such tokens are identified by their subject and offboarding cannot block them before they expire.
    requireEmail: true
  # Prompt guard (docs/concepts.md, "Prompt guard"): the gateway checks the prompt of every chat, messages and
  # responses request before it reaches a model. Prompts only: answers are not checked. Embeddings are not checked.
  # The text never leaves the cluster: regular expressions run in the gateway, and the webhook must be a Service in
  # the cluster. The audit record says what the guard did (never the matched text).
  promptGuard:
    enabled: false
    # audit: record what the guard would refuse, and let the prompt through unchanged (start here).
    # reject: refuse a matching prompt with 403 and rejectMessage; the model is not called.
    # mask: replace each match with a placeholder (for example <CREDIT_CARD>) and send the rest to the model.
    #   With a webhook, the webhook decides itself whether to pass, mask or refuse.
    mode: audit
    # Patterns built into the gateway: CreditCard, Ssn (US Social Security number), Email, PhoneNumber, CaSin
    # (Canadian Social Insurance Number). [] for none.
    builtins: [CreditCard, Ssn, Email, PhoneNumber]
    # Your own regular expressions (Rust regex syntax: no look-around, no back-references), at most 1,024
    # characters each. Example: ['(?i)ignore (all )?previous instructions', 'AKIA[0-9A-Z]{16}']
    patterns: []
    # The error message of a refused prompt (mode reject).
    rejectMessage: "The prompt was refused by the prompt guard of this gateway."
    # An optional guard of your own, run after the patterns: POST /request on this Service (agentgateway's
    # guardrail webhook protocol). Empty service: no webhook.
    webhook:
      service: ""
      namespace: ""     # empty: the release namespace
      port: 8000
      # FailClosed refuses the prompt when the webhook does not answer; FailOpen lets it through.
      failureMode: FailClosed

apiKeys:
  # Personal API keys (console: Keys). false: the gateways accept JWTs only; existing keys are kept but refused.
  enabled: true
  # A key stops when its owner has not signed in to the console for this many days (1-365).
  inactivityDays: 30
  # The longest end date a person may choose: 30, 90 or 365.
  maxDays: 365

serviceAccounts:
  # Service accounts (console: Settings / Service accounts): identities <name>@svc.ambit.internal for CI jobs and
  # agents, created by admins. false: the emergency stop; creating accounts and keys is refused, the gateways refuse
  # every service account key (kept, and accepted again when switched back on). Off as well when apiKeys.enabled is false.
  enabled: true
  # The longest end date of a service account key: 30, 90 or 365.
  maxDays: 90
  # Days a service account key keeps working after the admin who issued it is offboarded (0-30; 0: it stops at once).
  exposureDays: 7

agents:
  # Agents (console: Agents): a hosted assistant that calls MCP tools with its own key, for one person (person mode) or
  # on its own (itself mode: a service account with an owner). EXPERIMENTAL in 0.6.x: the API and the key fields may
  # change in 0.7.0 with an upgrade note (docs/agents.md). false: creating agents and agent keys is refused; the keys
  # that exist keep working until they end.
  enabled: true
  # At most this many agents in all (each is one small ConfigMap; at most 2000), and per person in person mode.
  maxTotal: 2000
  maxPerPerson: 10
  # The longest end date of an agent key: 30, 90 or 365 (also limited by apiKeys.maxDays, and for itself mode by
  # serviceAccounts.maxDays).
  keyMaxDays: 90
  # Reserved for OAuth (0.6.0, later): the issuer whose tokens may carry agent claims. Empty: no token is read as an
  # agent's, and no token is limited by an agent scope.
  tokenIssuer: ""

routing:
  router:
    # ambit-router labels prompts for ModelRouters of type LLM. Installed but at 0 replicas until such a router
    # exists; the controller scales it (keep replicas out of Argo CD's diff, docs/routing.md).
    enabled: true
    replicas: 2
    # Pod template annotations; changing one rolls ambit-router (tests use it to check a rollout under load).
    podAnnotations: {}
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 128Mi }

gitops:
  # GitOps mode: the console opens pull requests in your configuration repository instead of changing
  # the cluster, and Argo CD (or Flux) applies what is merged. See deploy/argocd/.
  enabled: false
  repository: ""        # owner/name, e.g. acme/platform-config
  branch: main          # the branch Argo CD watches
  path: ambit           # directory of Ambit objects: <path>/accessrules/<name>.yaml, <path>/servers/<name>.yaml
  github:
    apiURL: https://api.github.com   # GitHub Enterprise Server: https://<host>/api/v3
    appID: ""
    # Secret with key private-key.pem: the GitHub App's key. Create it yourself; the chart never holds it.
    privateKeySecret: ambit-github-app
  argocd:
    # namespace/name of the Argo CD Application that syncs the repository, e.g. argocd/ambit-config. The
    # console reads its sync status (read only) to show when a merged change reached the cluster.
    application: ""

prices:
  # HTTPS address of a copy of LiteLLM's model_prices_and_context_window.json (for example an internal
  # mirror). Empty: the console suggests prices from the list built into this release only. Read at start
  # and once a day; redirects are not followed and the file may be at most 10 MiB.
  sourceURL: ""

mcp:
  # Serve MCP at <host>/mcp. Servers and tool access come from Server and AccessRule objects;
  # ToolHive runs each server in a pod that only the gateway can reach.
  enabled: false
  host: mcp.example.com
  # Tokens the gateway accepts. Either your identity provider's (issuer, audiences, jwksURL), or, with
  # dex: true, Ambit's own Dex (client ambit-cli; local accounts get tokens with the password grant).
  jwt:
    dex: false
    issuer: ""
    audiences: []
    jwksURL: ""
    # Refuse gateway JWTs without a usable email claim. Offboarding, per-person budgets and audit are keyed by email; with false, such tokens are identified by their subject and offboarding cannot block them before they expire.
    requireEmail: true

frontDoor:
  # EXPERIMENTAL in 0.6.x (docs/front-door.md): a second, public Gateway (ambit-public) for hosted agents. HTTPS only, one
  # host, one route (/mcp), API keys only. The console, Dex and the LLM host are never reachable on it. Off by default.
  # Needs mcp.enabled, apiKeys.enabled, limits.enabled (shared rate limits), evidence.enabled (audit) and a certificate.
  enabled: false
  # Public MCP host name, for example mcp-public.example.com. It must differ from console.host, llm.host and mcp.host.
  host: ""
  # The sign-in host of OAuth (oauth.enabled), for example auth.example.com: where hosted AI platforms send people to sign
  # in and fetch tokens. It is a second name on the same public Gateway and must differ from every other host name.
  authHost: ""
  tls:
    # A kubernetes.io/tls Secret in this namespace whose certificate covers frontDoor.host (and frontDoor.authHost, with OAuth).
    certificateSecret: ""
  # Listener and Service port of the public Gateway (HTTPS).
  port: 8443
  replicas: 2
  service:
    # LoadBalancer in the cloud. ClusterIP or NodePort for a load balancer or tunnel you run yourself.
    type: LoadBalancer
    annotations: {}
    # Local keeps the client's address (the source limit and the audit log use it). Cluster hides it behind a node.
    externalTrafficPolicy: Local
    # Cloud firewall: only these source ranges reach the load balancer. [] allows every address.
    loadBalancerSourceRanges: []
    nodePort: null
  # How the gateway learns the client's address. direct: from the connection (externalTrafficPolicy Local, or a load
  # balancer that keeps the address). proxyProtocol: the load balancer sends the PROXY protocol (AWS NLB with proxy
  # protocol v2 enabled, and others); the gateway then refuses connections without it. X-Forwarded-For is never trusted.
  clientAddress: direct
  rateLimit:
    # Shared by all gateway pods (the ratelimit service counts in Valkey). Per valid key, and per source address.
    perCredentialPerMinute: 600
    perSourcePerMinute: 120
    # A second line in each gateway pod, for all requests, if the ratelimit service is down.
    perPodPerSecond: 200
    # FailOpen: if the ratelimit service is down, the per-pod limit still applies. FailClosed: requests are refused.
    failureMode: FailOpen

oauth:
  # EXPERIMENTAL in 0.6.x (docs/oauth.md): sign in with the company account from hosted AI platforms, with standards-based
  # OAuth for MCP clients. Ory Hydra issues the tokens; it needs a PostgreSQL database that you run (15 to 17, TLS, backups).
  # Off by default. Needs frontDoor.enabled, frontDoor.authHost, oauth.database and oauth.hydra.systemSecret.
  enabled: false
  # How long an access token lives, in minutes. The gateways will refuse a stopped or offboarded person's token at once (a later change of
  # this release series); this only bounds the rare cases where that cannot happen (docs/oauth.md, "Stopping a connection").
  accessTokenMinutes: 15
  # A refresh token not used for this many days stops working.
  refreshTokenIdleDays: 30
  # A grant is refreshed for at most this many days; then the person connects again. The groups in a token are those of the
  # sign-in: this is how a group that the person lost at the identity provider stops counting. 0: no limit (not advised).
  maxGrantDays: 30
  # EMERGENCY SWITCH: true refuses every token of Ambit's sign-in host at once, whatever its signature, key or expiry, and does
  # not touch API keys or service account keys. It does not depend on Hydra, its keys or the gateway's copy of them. For a
  # faster way that needs no Helm run, see docs/oauth.md ("If a signing key may be stolen").
  emergencyBlock: false
  database:
    # A Secret with the PostgreSQL address of Hydra's database, as a URL under the key:
    #   postgres://hydra:PASSWORD@db.example.com:5432/hydra?sslmode=verify-full&sslrootcert=/ca/ca.crt&max_conns=8&max_idle_conns=4
    # The check at start refuses anything but sslmode=verify-full, a server that is not PostgreSQL 15 to 17, and a role
    # that is a superuser. PASSWORD must be URL-safe (letters and digits).
    dsnSecret: { name: "", key: dsn }
    # A Secret with the CA that signed the database server's certificate, mounted at /ca/ca.crt.
    caSecret: { name: "", key: ca.crt }
  hydra:
    # Pinned by digest. A new Hydra version is a reviewed change of Ambit (docs/oauth.md, "Upgrading Hydra").
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    # Hydra pods. They start one at a time, so the first pod creates the signing key alone.
    replicas: 2
    # A Secret with a random string of 32 or more characters under the key: encrypts Hydra's keys and tokens in the
    # database. Create it once and keep it with your backups: without it the database cannot be read.
    systemSecret: { name: "", key: system }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  # Sign in at your company's OIDC identity provider (Okta, Entra ID, Google, Keycloak). One issuer per install.
  # Register ONE confidential web client there: authorization code flow only, PKCE S256 required, the redirect URI exactly
  # https://<frontDoor.authHost>/callback, scopes openid email profile, a groups claim in the ID token, client
  # authentication client_secret_basic.
  signIn:
    # The issuer exactly as the provider writes it in its discovery document (https, no final slash).
    issuer: ""
    clientID: ""
    # A Secret with the client secret under the key.
    clientSecret: { name: "", key: client-secret }
    # The ID token claim that lists the person's groups.
    groupsClaim: groups
    # Optional Secret with the CA of a provider whose certificate your clusters do not trust by default (key ca.crt).
    caSecret: ""
  # A Secret with a random string of 32 or more characters under the key: protects the pending sign-ins in the browser.
  # Several replicas and restarts share it. Changing it ends the sign-ins that are open at that moment, nothing else.
  cookieSecret: { name: "", key: cookie }
  registration:
    dynamic:
      # Hosted platforms that have no pre-registered client register themselves (RFC 7591). Only redirect addresses on
      # these hosts (and loopback addresses for native clients) are accepted. false: no /register.
      enabled: true
      redirectHosts: [chatgpt.com, claude.ai]
      # Registrations allowed per caller address and hour (counted in Valkey, shared by all replicas).
      perSourcePerHour: 10
      # At most this many registered clients; one that nobody used for unusedClientDays is deleted.
      maxClients: 500
      unusedClientDays: 30
  auth:
    # ambit-auth pods (stateless: a pending sign-in is in the browser, counters are in Valkey).
    replicas: 2
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 128Mi }

access:
  # enforce: AccessRules decide (default).
  # audit: every signed-in request to a model or MCP tool is allowed; each record says whether the
  #        AccessRules in force at that moment would have refused it. Needs evidence.enabled=true.
  mode: enforce
  # A mode switch or a rules change waits, step by step, until agentgateway has accepted each written object
  # (and no gateway pod rejected it), then activationSettle for the change to reach every gateway pod. After
  # activationTimeout the change stops at that step and every AccessRule reports it. activationTimeout must be
  # above 0 (there is no setting that turns the wait off).
  activationTimeout: 120s
  activationSettle: 3s

accessRules:
  # An AccessRule's users match a gateway JWT's email only when the token says email_verified: true (both gateways;
  # personal API keys match by their owner's email). Turn off only if your identity provider never lets users change
  # their own email; Microsoft Entra ID does not send email_verified.
  usersRequireVerifiedEmail: true

evidence:
  # Audit trail: the gateway's access logs through an OpenTelemetry Collector into ClickHouse, searchable
  # in the console (Audit, Usage). Every call is kept, denied ones included, for `retention`.
  enabled: false
  retention: 8760h  # one year
  # How long the daily summaries behind the Savings page are kept (counts only: no email, no content; group names are
  # the only identifying text). Rounded up to whole days, at least 24h. A change applies at the next console start.
  summaryRetention: 26280h  # three years
  # Settings → Evidence: ZIP files for an auditor (CSV files and a manifest with SHA-256), admins only. The audit
  # export and the audit columns of the other exports need evidence.enabled.
  exports:
    enabled: true
    maxRows: 5000000  # an export with more rows is refused (413): split the period
    maxDays: 366      # the longest period of one export
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.36.6@sha256:5b10577fc3382ee6b26c4916a1d915d90543ade66e85fc29e3a78c4ce08daeb3
    storage: 10Gi
    resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1536Mi } }
    # Use an existing ClickHouse (e.g. ClickHouse Cloud) instead of installing one: set host. The collector
    # writes over the native protocol, the console reads over HTTP(S). The user needs CREATE TABLE in the
    # database once (the collector creates otel_logs with the retention above), then INSERT and SELECT. For the
    # Savings page the console also creates three summary tables and three materialized views in the same database
    # (names ambit_llm_daily_v1, ambit_compress_daily_v1, ambit_classifier_daily_v1 and their _mv views): the user needs CREATE TABLE,
    # CREATE VIEW, ALTER MODIFY TTL, INSERT and SELECT on that database, and SELECT on system.tables.
    external:
      host: ""
      tls: true
      nativePort: 9440   # 9000 without TLS
      httpPort: 8443     # 8123 without TLS
      database: otel
      user: ambit
      # Secret in the release namespace with key "password". Required with host.
      passwordSecret: ""
      # Optional Secret with key "ca.crt" (PEM) for a ClickHouse behind a private CA.
      caSecret: ""
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }

alerts:
  # Prometheus alert rules for every Ambit component (a PrometheusRule and a PodMonitor, for the Prometheus
  # Operator): restarts, memory kills, memory near the limit, unavailable workloads, the budget store
  # down, and lost audit records. They read kube-state-metrics and cAdvisor (kube-prometheus-stack has both).
  enabled: false
  # Labels your Prometheus selects rules and monitors by, e.g. { release: kube-prometheus-stack }.
  labels: {}

protection:
  # MCP guardrails (ambit-guard): tool pinning and masking of personal data in tool results.
  enabled: false
  # How often each server's tools are read again; a changed definition is hidden at once, and calls to it
  # are refused from the next read.
  toolsRefresh: 10m
  # Records of compressed tool results (Server spec.resultCompression; written only with evidence.enabled).
  compressionAudit:
    # Name the caller (email, key ID) on each record, so the Audit page shows it on the row of its call.
    # false: records keep the caller's groups only, as before 0.5.0 (the Savings page works either way).
    caller: true
  # Memory limit of ambit-guard, in MiB. The guard holds a tool result several times while it masks it: a 30 MiB
  # result used 323 MiB in a test. 512 fits the largest result it accepts (32 MiB). See Masking in docs/concepts.md.
  memoryLimitMiB: 512
  # Leave analyzerURL empty for the built-in masks (Korean resident registration numbers, US Social Security
  # numbers, card numbers, emails). Set it to add Microsoft Presidio (names, addresses, more languages): the
  # built-in masks run first, then Presidio. Ambit does not install Presidio.
  presidio:
    analyzerURL: ""
    # Not used any more (Ambit replaces the findings itself). Kept so that existing values still work.
    anonymizerURL: ""
    language: en
    # The time limit for all analyzer calls of one tool result (a Go duration). If it is exceeded, the result
    # is withheld.
    timeout: 10s
  # Injection guard: looks for prompt-injection text in the results of tool calls, resources/read and prompts/get, after
  # masking (so a webhook never gets personal data). OFF by default. It is a tripwire, not a detector: it finds only the
  # wording its rules describe, and new wording passes. The rule names are in docs/concepts.md (Injection guard).
  injectionGuard:
    enabled: false
    # audit: record each finding and let the result through unchanged (start here).
    # reject: withhold a result with a finding; the call fails with an error that names the rules (never the text).
    # mask: replace each match with <PROMPT_INJECTION> and remove hidden characters; the rest of the result passes.
    mode: audit
    # The built-in rules (13, each with a name). false: only your patterns and the webhook.
    builtins: true
    # Built-in rules to switch off, by name, for example [role-prefix] when your tools print log lines that start with
    # "system:". The chart refuses a name it does not know.
    disabledBuiltins: []
    # Your own regular expressions (Go RE2 syntax: no look-around, no back-references), at most 1,024 characters each. A
    # match is a finding named pattern-1, pattern-2, ... in list order. Example: ['(?i)send the (data|file) to https?://']
    patterns: []
    # An optional classifier of your own, in the cluster: POST /request on this Service, with the request and answer
    # format of the prompt guard webhook (llm.promptGuard.webhook). Empty service: no webhook. The webhook adds up to
    # its timeout to every tool call.
    webhook:
      service: ""
      namespace: ""     # empty: the release namespace
      port: 8000
      timeout: 2s
      # FailClosed withholds the result when the webhook does not answer (modes reject and mask); FailOpen lets it through.
      # In mode audit a webhook that fails never blocks.
      failureMode: FailClosed

limits:
  # Budgets: daily LLM request limits per group and per user (Budget objects), shared by every replica.
  enabled: false
  # When the ratelimit service or Valkey is down: FailOpen lets requests through uncounted (budgets are a
  # cost control, so an outage should not stop all LLM traffic); FailClosed refuses them.
  failureMode: FailOpen
  ratelimit:
    image: envoyproxy/ratelimit:63c7e9cc@sha256:f10186a0c94f339326015a955bf1ad5f694addef220b86d0f84e330fcc0f4939
  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    # Use an existing Valkey or Redis (e.g. Amazon ElastiCache) instead of installing one: set address
    # (host:port). Every gateway replica's budget counts go there, so budgets survive restarts.
    external:
      address: ""
      tls: true
      # Optional Secret with key "password" (Valkey AUTH).
      passwordSecret: ""
      # Optional Secret with key "ca.crt" (PEM) for a private CA.
      caSecret: ""

connections:
  # Namespace for users' SaaS grants and the Connections' client secrets. Empty: <release namespace>-grants.
  grantsNamespace: ""

# Passed to the ToolHive operator subchart (installed when mcp.enabled). Its CRDs are in deploy/crds.
toolhive-operator:
  operator:
    features:
      # Needs cluster-wide RBAC; Ambit keeps the operator inside its own namespace.
      storageVersionMigrator: false
    rbac:
      scope: namespace
      # Must be the namespace Ambit is installed in; the chart refuses to render otherwise.
      allowedNamespaces: [ambit-system]

# Passed to the agentgateway subchart. Set agentgateway.image.registry for a private registry.
agentgateway:
  # AgentgatewayModel is on by default since v1.6.0; kept explicit because Ambit cannot work without it.
  # Ambit needs it: per-model authorization only works on AgentgatewayModel, because route-level
  # authorization runs before the gateway reads the requested model.
  agentgatewayModels:
    enabled: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# Default memory for containers in Ambit's namespace that set none themselves: ToolHive's proxy pods (whose
# resources ToolHive does not expose) and MCP servers. A LimitRange applies it when the pod is created.
containerDefaults:
  requests: { memory: 64Mi }
  limits: { memory: 512Mi }

# Dex, rendered by this chart (templates/dex/). Its config is generated from console, sso and bootstrapAdmin.
dex:
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.45.1
  # Environment variables for secrets referenced as $NAME in sso.connectors (from Secrets, never literal values).
  envVars: []
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
