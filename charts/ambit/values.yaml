gateway:
  # Listener port of the Ambit Gateway. Also the port of the generated Service.
  port: 8080
  service:
    # LoadBalancer on EKS; values-kind.yaml switches to NodePort.
    type: LoadBalancer
    nodePort: null

console:
  # Public URL of the console. Dex's issuer is this URL + /dex.
  url: https://console.example.com
  # Hostname matched by the HTTPRoute. Must match the host in console.url.
  host: console.example.com
  image:
    repository: ghcr.io/craftsman-apps/ambit-console
    tag: 0.0.1
    pullPolicy: IfNotPresent
  # Hours before a console session expires.
  sessionHours: 8

bootstrapAdmin:
  # Local password sign-in (admin@ambit.local) for first setup. Set false once SSO works:
  # the console then deletes the account from Dex and removes its password Secret.
  enabled: true

sso:
  # Dex connectors shown as "Continue with ..." on the login page. See https://dexidp.io/docs/connectors/
  # Never put a secret value here: write "$ENV_NAME" and supply it through dex.envVars from a Secret.
  connectors: []

# Passed to the agentgateway subchart. Set agentgateway.image.registry for a private registry.
agentgateway: {}

# Passed to the Dex subchart. Ambit renders Dex's config itself (templates/dex-config.yaml).
dex:
  fullnameOverride: ambit-dex
  image:
    tag: v2.45.1
  grpc:
    enabled: true
  configSecret:
    create: false
    name: ambit-dex-config
