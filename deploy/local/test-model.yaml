# The test model of `ambit local up` without an OpenRouter key (`--no-key`, or Enter at the key prompt).
# An OpenAI-compatible server that answers every chat completion with "You said: <your last message>" and
# usage counts (one token per word), streamed or not. It runs on the public python:3.13-alpine image, pinned
# by digest, so there is no new image to publish. Not the server of test/llm/mock.yaml, which answers "pong"
# and serves the e2e tests.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambit-local-model
  labels: { ambitproject.dev/created-by: ambit-cli }
data:
  server.py: |
    import json, os, http.server

    def words(text):
        return max(1, len(str(text).split()))

    def text_of(content):
        if isinstance(content, list):  # multi-part message
            return " ".join(p.get("text", "") for p in content if isinstance(p, dict))
        return str(content or "")

    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a):
            pass

        def send_json(self, code, obj):
            out = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        def do_GET(self):
            if self.path.rstrip("/").endswith("/models"):
                return self.send_json(200, {"object": "list", "data": [{"id": "local/echo", "object": "model", "owned_by": "ambit"}]})
            self.send_json(404, {"error": {"message": "not found"}})

        def do_POST(self):
            if not self.path.rstrip("/").endswith("/chat/completions"):
                return self.send_json(404, {"error": {"message": "this test model answers only /v1/chat/completions"}})
            body = json.loads(self.rfile.read(int(self.headers.get("content-length", 0))) or b"{}")
            msgs = body.get("messages") or []
            last = next((text_of(m.get("content")) for m in reversed(msgs) if m.get("role") == "user"), "")
            answer = "You said: " + last
            usage = {"prompt_tokens": sum(words(text_of(m.get("content"))) for m in msgs), "completion_tokens": words(answer)}
            usage["total_tokens"] = usage["prompt_tokens"] + usage["completion_tokens"]
            model = body.get("model", "local/echo")
            if body.get("stream"):
                self.send_response(200)
                self.send_header("content-type", "text/event-stream")
                self.end_headers()
                chunks = [{"choices": [{"index": 0, "delta": {"role": "assistant", "content": answer}}]},
                          {"choices": [{"index": 0, "delta": {}, "finish_reason": "stop"}]}]
                if (body.get("stream_options") or {}).get("include_usage"):
                    chunks.append({"choices": [], "usage": usage})
                for c in chunks:
                    c.update({"id": "local-1", "object": "chat.completion.chunk", "model": model})
                    self.wfile.write(b"data: " + json.dumps(c).encode() + b"\n\n")
                self.wfile.write(b"data: [DONE]\n\n")
                return
            self.send_json(200, {"id": "local-1", "object": "chat.completion", "model": model, "usage": usage,
                                 "choices": [{"index": 0, "message": {"role": "assistant", "content": answer}, "finish_reason": "stop"}]})

    http.server.ThreadingHTTPServer(("", int(os.environ.get("PORT", "8080"))), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambit-local-model
  labels: { ambitproject.dev/created-by: ambit-cli }
spec:
  selector: { matchLabels: { app: ambit-local-model } }
  template:
    metadata: { labels: { app: ambit-local-model } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534 }
      containers:
        - name: model
          image: python@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f  # python:3.13-alpine
          command: [python, /app/server.py]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: ambit-local-model } }]
---
apiVersion: v1
kind: Service
metadata:
  name: ambit-local-model
  labels: { ambitproject.dev/created-by: ambit-cli }
spec:
  selector: { app: ambit-local-model }
  ports: [{ port: 8080 }]
---
# A Model with provider OpenAI needs credentialsRef to an ambit-llm-* Secret. The test model ignores it.
apiVersion: v1
kind: Secret
metadata:
  name: ambit-llm-local
  labels: { ambitproject.dev/created-by: ambit-cli }
stringData:
  Authorization: not-used
---
apiVersion: ambitproject.dev/v1alpha1
kind: Model
metadata:
  name: local-test
  labels: { ambitproject.dev/created-by: ambit-cli }
spec:
  displayName: Test model (repeats your message)
  provider: OpenAI
  model: local/echo
  baseURL: http://ambit-local-model.ambit-system.svc.cluster.local:8080/v1
  credentialsRef: { name: ambit-llm-local }
  price: { inputPerMillionTokens: "0", outputPerMillionTokens: "0" }
