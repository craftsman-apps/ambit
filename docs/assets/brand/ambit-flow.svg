<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Alice's request passes Ambit's access rule, spending limit and audit record, then reaches AI models and work apps; Bob, who left the company, is refused at the access check.">
  <title>Ambit follows one request: it passes the access rule, spending limit and audit record; a person who left is refused.</title>
  <style>
text{font-family:'IBM Plex Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif';fill:#1F2328}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:#59636E}
.m{font-family:'IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace';font-size:11px;letter-spacing:.06em;fill:#59636E}
.box{fill:#F6F8FA;stroke:#D1D9E0;stroke-width:1}
.frame{fill:none;stroke:#1F2328;stroke-width:1.25}
.path{fill:none;stroke:#2563EB;stroke-width:2}
.deny{fill:none;stroke:#B42318;stroke-width:1.5}
.ok{fill:#2563EB}
</style>
    <defs>
      <marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
      <marker id="ARRM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B42318"/></marker>
    </defs>
    <!-- people -->
    <rect class="box" x="16" y="62" width="150" height="62" rx="4"/>
    <text class="t" x="32" y="88">Alice</text>
    <text class="s" x="32" y="108">group: engineering</text>
    <rect class="box" x="16" y="214" width="150" height="62" rx="4"/>
    <text class="t" x="32" y="240">Bob</text>
    <text class="s" x="32" y="260">left the company</text>

    <!-- Ambit boundary -->
    <rect class="frame" x="206" y="24" width="514" height="282" rx="4"/>
    <text class="m" x="222" y="46">AMBIT</text>

    <!-- checks, row 1 -->
    <rect class="box" x="222" y="62" width="148" height="62" rx="4"/>
    <text class="t" x="236" y="86">Who may use what</text>
    <text class="s" x="236" y="106">engineering → Sonnet,</text>
    <text class="s" x="236" y="120">GitHub</text>
    <rect class="box" x="390" y="62" width="148" height="62" rx="4"/>
    <text class="t" x="404" y="86">Spending limit</text>
    <text class="s" x="404" y="106">$12.40 of $50 today</text>
    <rect class="box" x="558" y="62" width="148" height="62" rx="4"/>
    <text class="t" x="572" y="86">Audit record</text>
    <text class="s" x="572" y="106">who, what, when, cost</text>

    <circle class="ok" cx="356" cy="70" r="5"/><circle class="ok" cx="524" cy="70" r="5"/><circle class="ok" cx="692" cy="70" r="5"/>

    <!-- request path -->
    <path class="path" d="M166 93H220" marker-end="url(#ARR)"/>
    <path class="path" d="M370 93H388" marker-end="url(#ARR)"/>
    <path class="path" d="M538 93H556" marker-end="url(#ARR)"/>
    <path class="path" d="M706 93H736V70H758" marker-end="url(#ARR)"/>
    <path class="path" d="M736 93V140H758" marker-end="url(#ARR)"/>

    <!-- destinations -->
    <rect class="box" x="760" y="44" width="184" height="54" rx="4"/>
    <text class="t" x="774" y="66">AI models</text>
    <text class="s" x="774" y="86">OpenAI, Azure, Bedrock, Vertex</text>
    <rect class="box" x="760" y="114" width="184" height="54" rx="4"/>
    <text class="t" x="774" y="136">Work apps through MCP</text>
    <text class="s" x="774" y="156">GitHub, Slack, Linear</text>

    <!-- Bob: refused -->
    <path class="deny" d="M166 245H220" marker-end="url(#ARRM)"/>
    <rect class="box" x="222" y="214" width="180" height="62" rx="4"/>
    <text class="t" x="234" y="238">Access removed</text>
    <text class="s" x="234" y="258">when the company's</text>
    <text class="s" x="234" y="272">sign-in system disables Bob</text>
    <path class="deny" d="M383 222l10 10M393 222l-10 10"/>
    <text class="s" x="418" y="240">His personal API keys, sessions and app sign-ins</text>
    <text class="s" x="418" y="258">stop working at once. Nothing reaches the models or apps.</text>
  </svg>
