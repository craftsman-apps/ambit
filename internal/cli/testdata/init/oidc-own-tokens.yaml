console:
  host: console.example.com
  url: https://console.example.com
dex:
  envVars:
  - name: SSO_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        key: clientSecret
        name: ambit-sso
evidence:
  enabled: true
  retention: 8760h
gateway:
  replicas: 2
  tls:
    certificateSecret: ambit-tls
    enabled: true
limits:
  enabled: true
  failureMode: FailOpen
llm:
  enabled: true
  host: llm.example.com
  jwt:
    audiences:
    - ambit
    issuer: https://login.acme.example
    jwksURL: https://login.acme.example/keys
mcp:
  enabled: true
  host: mcp.example.com
  jwt:
    audiences:
    - ambit
    issuer: https://login.acme.example
    jwksURL: https://login.acme.example/keys
protection:
  enabled: true
sso:
  connectors:
  - config:
      clientID: ambit
      clientSecret: $SSO_CLIENT_SECRET
      insecureEnableGroups: true
      issuer: https://login.acme.example
      redirectURI: https://console.example.com/dex/callback
    id: company
    name: Company sign-in
    type: oidc
