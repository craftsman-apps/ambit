# Presets: vendor MCP servers and their OAuth details. Change a value → bump version (CI checks).
# verified: true only after a passing `make preset-live` (docs/presets.md).
- id: github
  version: 1
  displayName: GitHub
  category: Developer
  server: { url: "https://api.githubcopilot.com/mcp/", transport: streamable-http }
  authorizationURL: https://github.com/login/oauth/authorize
  tokenURL: https://github.com/login/oauth/access_token
  revocationURL: "https://api.github.com/applications/{clientID}/grant"
  resource: none
  scopes: [repo, "read:org", "read:user"]
  setup: |
    1. Sign in to GitHub as an owner of the organization (or as the account that will own the app).
    2. Open Settings, then Developer settings, then OAuth Apps, and click "New OAuth App". For an organization, use the organization's Settings, Developer settings, OAuth Apps.
    3. Enter an application name and your Ambit address as the homepage URL.
    4. Set "Authorization callback URL" to {callbackURL}. GitHub accepts only one callback URL for an OAuth app.
    5. Leave "Enable Device Flow" off and click "Register application".
    6. Copy the Client ID from the app page.
    7. Click "Generate a new client secret" and copy the secret at once; GitHub shows it only once.
    8. If your organization restricts third-party apps, an organization owner must approve this app under Settings, Third-party access.
  clientIDLabel: Client ID
  clientSecretLabel: Client secret
  docs: https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/creating-an-oauth-app
  live: { tool: get_me }
- id: linear
  version: 1
  displayName: Linear
  category: Projects
  server: { url: "https://mcp.linear.app/mcp", transport: streamable-http }
  authorizationURL: https://linear.app/oauth/authorize
  tokenURL: https://api.linear.app/oauth/token
  revocationURL: https://api.linear.app/oauth/revoke
  resource: none
  scopes: [read]
  setup: |
    1. Sign in to Linear as a workspace admin.
    2. Open Settings, then API (https://linear.app/settings/api), and click "Create new" under OAuth applications.
    3. Enter an application name, a developer name and a developer URL.
    4. Add {callbackURL} under "Callback URLs".
    5. Leave "Public" off, so only your workspace can use the app, and save.
    6. Copy the Client ID and the Client secret from the application page.
  clientIDLabel: Client ID
  clientSecretLabel: Client secret
  docs: https://linear.app/developers/oauth-2-0-authentication
  live: { tool: list_teams }
- id: asana
  version: 1
  displayName: Asana
  category: Projects
  server: { url: "https://mcp.asana.com/v2/mcp", transport: streamable-http }
  authorizationURL: https://app.asana.com/-/oauth_authorize
  tokenURL: https://app.asana.com/-/oauth_token
  revocationURL: https://app.asana.com/-/oauth_revoke
  resource: none
  setup: |
    1. Sign in to Asana and open the developer console at https://app.asana.com/0/my-apps.
    2. Click "Create new app", enter an app name, select the app type "MCP app", and click "Create app".
    3. Open the "OAuth" tab and add {callbackURL} as a redirect URL.
    4. Open "Manage distribution" and choose "Specific workspaces" (select your workspace) or "Any workspace". Select at least one workspace.
    5. Copy the Client ID and the Client secret from the OAuth tab.
    6. An MCP app needs no scopes.
  clientIDLabel: Client ID
  clientSecretLabel: Client secret
  docs: https://developers.asana.com/docs/integrating-with-asanas-mcp-server
  live: { tool: get_me, callback: https }
- id: monday
  version: 1
  displayName: monday.com
  category: Projects
  server: { url: "https://mcp.monday.com/mcp", transport: streamable-http }
  authorizationURL: https://auth.monday.com/oauth2/authorize
  tokenURL: https://auth.monday.com/oauth_ms/oauth/token
  revocationURL: https://auth.monday.com/oauth_ms/oauth/revoke
  resource: none
  scopes: ["me:read", "boards:read", "workspaces:read", "users:read", "docs:read", "updates:read"]
  setup: |
    1. Sign in to monday.com as an admin and open the Developer Center (profile picture, then Developers).
    2. Click "Create app" and enter an app name.
    3. Open "OAuth" (OAuth & Permissions) in the app's left menu. Add {callbackURL} as a redirect URL.
    4. In the same page, select the scopes: me:read, boards:read, workspaces:read, users:read, docs:read, updates:read.
    5. Open "General Settings" and scroll to "App Credentials". Copy the Client ID and the Client Secret.
    6. Make sure the app uses the current OAuth 2.1 flow (not the older flow); see the migration guide in the documentation.
  clientIDLabel: Client ID
  clientSecretLabel: Client Secret
  docs: https://developer.monday.com/api-reference/docs/control-mcp-access-with-oauth-app
  live: { tool: get_user_context }
- id: airtable
  version: 1
  displayName: Airtable
  category: Data
  server: { url: "https://mcp.airtable.com/mcp", transport: streamable-http }
  authorizationURL: https://airtable.com/oauth2/v1/authorize
  tokenURL: https://airtable.com/oauth2/v1/token
  resource: https://mcp.airtable.com
  scopes: ["data.records:read", "data.records:write", "schema.bases:read"]
  setup: |
    1. Sign in to Airtable and open https://airtable.com/create/oauth.
    2. Click "Register new OAuth integration".
    3. Enter a unique integration name and add {callbackURL} as the redirect URL.
    4. Select the scopes data.records:read, data.records:write and schema.bases:read.
    5. Add a support email, a privacy policy URL and a terms of service URL, then click "Register integration".
    6. On the integration page, click "Generate client secret" and copy it at once; it cannot be shown again.
    7. Copy the Client ID from the same page.
  clientIDLabel: Client ID
  clientSecretLabel: Client secret
  docs: https://airtable.com/developers/web/guides/oauth-integrations
  live: { tool: list_bases }
- id: box
  version: 1
  displayName: Box
  category: Files
  server: { url: "https://mcp.box.com", transport: streamable-http }
  authorizationURL: https://account.box.com/api/oauth2/authorize
  tokenURL: https://api.box.com/oauth2/token
  revocationURL: https://api.box.com/oauth2/revoke
  resource: none
  scopes: [root_readwrite, ai.readwrite]
  setup: |
    1. Sign in to the Box Admin Console as an admin and open Integrations.
    2. Search for "Box MCP server" and click Configure to create an unlisted MCP server integration.
    3. Add the integration credentials. Enter {callbackURL} as the Redirect URI.
    4. Save, then copy the generated Client ID and Client Secret.
    5. The scopes used are root_readwrite and ai.readwrite.
  clientIDLabel: Client ID
  clientSecretLabel: Client Secret
  docs: https://developer.box.com/guides/box-mcp/remote/
  live: { tool: who_am_i }
