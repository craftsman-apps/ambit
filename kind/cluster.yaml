# Local test cluster. Host port 8080 reaches the Ambit gateway (NodePort 30080).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ambit
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
        protocol: TCP
