# promtool unit tests for charts/ambit/templates/alerts/rules.yaml (run by test/alerts.sh).
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # Two restarts in 30 minutes fire; one does not.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="ambit-system",pod="ambit-guard-1",container="guard"}'
        values: '0x10 1x10 2x10'
      - series: 'kube_pod_container_status_restarts_total{namespace="ambit-system",pod="ambit-console-1",container="console"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 30m
        alertname: AmbitContainerRestarting
        exp_alerts:
          - exp_labels: { severity: warning, namespace: ambit-system, pod: ambit-guard-1, container: guard }
            exp_annotations:
              summary: "ambit-guard-1 (guard) restarted 2 times in 30 minutes"
              description: "Read the reason with kubectl -n ambit-system describe pod ambit-guard-1 (Last State)."
  # Other namespaces are not Ambit's.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="other",pod="x",container="x"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: AmbitContainerRestarting
        exp_alerts: []
  # An OOM kill with a recent restart fires; an old OOM kill (no restart in 30 minutes) does not.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="ambit-system",pod="ambit-otel-collector-1",container="collector",reason="OOMKilled"}'
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="ambit-system",pod="ambit-otel-collector-1",container="collector"}'
        values: '3x20 4x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: AmbitContainerOOMKilled
        exp_alerts:
          - exp_labels: { severity: warning, namespace: ambit-system, pod: ambit-otel-collector-1, container: collector, reason: OOMKilled }
            exp_annotations:
              summary: "ambit-otel-collector-1 (collector) was killed at its memory limit"
              description: "Raise the container's memory limit in the chart values, or find what grew (docs/alerts.md)."
      - eval_time: 59m
        alertname: AmbitContainerOOMKilled
        exp_alerts: []
  # Over 90% of the limit for 15 minutes fires; 80% does not.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="ambit-system",pod="ambit-gw-1",container="agentgateway",id="a"}'
        values: '490000000x30'
      - series: 'kube_pod_container_resource_limits{namespace="ambit-system",pod="ambit-gw-1",container="agentgateway",resource="memory",unit="byte"}'
        values: '536870912x30'
      - series: 'container_memory_working_set_bytes{namespace="ambit-system",pod="ambit-guard-1",container="guard",id="b"}'
        values: '430000000x30'
      - series: 'kube_pod_container_resource_limits{namespace="ambit-system",pod="ambit-guard-1",container="guard",resource="memory",unit="byte"}'
        values: '536870912x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: AmbitMemoryNearLimit
        exp_alerts: []
      - eval_time: 20m
        alertname: AmbitMemoryNearLimit
        exp_alerts:
          - exp_labels: { severity: warning, namespace: ambit-system, pod: ambit-gw-1, container: agentgateway }
            exp_annotations:
              summary: "ambit-gw-1 (agentgateway) uses 91.27% of its memory limit"
              description: "At 100% the container is killed and restarts."
  # A deployment short of replicas for 10 minutes fires; a statefulset too.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="ambit-system",deployment="ambit-console"}'
        values: '0x15'
      - series: 'kube_deployment_spec_replicas{namespace="ambit-system",deployment="ambit-console"}'
        values: '1x15'
      - series: 'kube_statefulset_status_replicas_ready{namespace="ambit-system",statefulset="ambit-clickhouse"}'
        values: '0x15'
      - series: 'kube_statefulset_replicas{namespace="ambit-system",statefulset="ambit-clickhouse"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: AmbitWorkloadUnavailable
        exp_alerts: []
      - eval_time: 12m
        alertname: AmbitWorkloadUnavailable
        exp_alerts:
          - exp_labels: { severity: warning, namespace: ambit-system, deployment: ambit-console }
            exp_annotations:
              summary: "ambit-console has fewer ready pods than it should for 10 minutes"
              description: "kubectl -n ambit-system get pods; kubectl -n ambit-system get events --sort-by=.lastTimestamp"
          - exp_labels: { severity: warning, namespace: ambit-system, statefulset: ambit-clickhouse }
            exp_annotations:
              summary: "ambit-clickhouse has fewer ready pods than it should for 10 minutes"
              description: "kubectl -n ambit-system get pods; kubectl -n ambit-system get events --sort-by=.lastTimestamp"
  # Valkey down fires after 1 minute, critical; the rendered failure mode is FailClosed (test/alerts.sh).
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="ambit-system",deployment="ambit-valkey"}'
        values: '1 0x5'
      - series: 'kube_deployment_spec_replicas{namespace="ambit-system",deployment="ambit-valkey"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: AmbitBudgetStoreDown
        exp_alerts:
          - exp_labels: { severity: critical, namespace: ambit-system, deployment: ambit-valkey }
            exp_annotations:
              summary: "ambit-valkey is down: budgets are not enforced"
              description: "limits.failureMode is FailClosed: the gateway refuses LLM and MCP requests until it is back."
  # Failed exports fire; so do records the collector refused (memory_limiter); a quiet collector does not.
  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records_total{namespace="ambit-system",pod="ambit-otel-collector-1",exporter="clickhouse"}'
        values: '0x5 40x10'
      - series: 'otelcol_receiver_refused_log_records_total{namespace="ambit-system",pod="ambit-otel-collector-2",receiver="otlp",transport="grpc"}'
        values: '0x5 7x10'
      - series: 'otelcol_exporter_send_failed_log_records_total{namespace="ambit-system",pod="ambit-otel-collector-3",exporter="clickhouse"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: AmbitAuditLogsDropped
        exp_alerts:
          - exp_labels: { severity: critical, namespace: ambit-system, pod: ambit-otel-collector-1 }
            exp_annotations:
              summary: "Audit records were lost in the last 10 minutes (40)"
              description: "The collector could not write to ClickHouse, or refused records near its memory limit. Check ClickHouse first: kubectl -n ambit-system logs deploy/ambit-otel-collector"
          - exp_labels: { severity: critical, namespace: ambit-system, pod: ambit-otel-collector-2 }
            exp_annotations:
              summary: "Audit records were lost in the last 10 minutes (7)"
              description: "The collector could not write to ClickHouse, or refused records near its memory limit. Check ClickHouse first: kubectl -n ambit-system logs deploy/ambit-otel-collector"
  # The console could not send MCP app request or approval records (issue #112); a console with no failures is quiet.
  - interval: 1m
    input_series:
      # The console exposes every reason at 0 from its start, so the first loss is an increase.
      - series: 'ambit_console_audit_send_failures_total{namespace="ambit-system",pod="ambit-console-1",reason="send_failed"}'
        values: '0x5 3x30'
      - series: 'ambit_console_audit_send_failures_total{namespace="ambit-system",pod="ambit-console-1",reason="queue_full"}'
        values: '0x35'
      - series: 'ambit_console_audit_send_failures_total{namespace="ambit-system",pod="ambit-console-2",reason="send_failed"}'
        values: '0x35'
    alert_rule_test:
      - eval_time: 10m
        alertname: AmbitConsoleAuditSendFailed
        exp_alerts:
          - exp_labels: { severity: warning, namespace: ambit-system, pod: ambit-console-1 }
            exp_annotations:
              summary: "The console could not send 3 MCP app request or approval records to the collector in 30 minutes"
              description: "The requests and decisions happened; the Audit page and otel_logs miss these records. The ServerRequest objects still hold them (kubectl -n ambit-system get serverrequests). Read why: kubectl -n ambit-system logs deploy/ambit-console | grep 'not delivered to the collector'; check the collector: kubectl -n ambit-system logs deploy/ambit-otel-collector"
  # Agents: a stop that a Gateway has not confirmed for more than a minute fires, naming the Gateway; a confirmed one does not.
  - interval: 1m
    input_series:
      - series: 'ambit_agent_stop_unconfirmed_seconds{namespace="ambit-system",gateway="ambit-public"}'
        values: '0x5 90x5'
      - series: 'ambit_agent_stop_unconfirmed_seconds{namespace="ambit-system",gateway="ambit"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: AmbitAgentStopNotConfirmed
        exp_alerts: []
      - eval_time: 8m
        alertname: AmbitAgentStopNotConfirmed
        exp_alerts:
          - exp_labels: { severity: critical, namespace: ambit-system, gateway: ambit-public }
            exp_annotations:
              summary: "A stop is not confirmed on the Gateway ambit-public for 90 seconds"
              description: "The agent's keys are deleted, but the Gateway has not accepted the stop policy that blocks its tokens and any key still in use. Check agentgateway: kubectl -n ambit-system get agentgatewaypolicy | grep ambit-agent-stops; kubectl -n ambit-system logs deploy/ambit-controller. The agent stays in state stopping until the Gateway confirms."
  # A stop list that cannot be rendered fires after a minute.
  - interval: 1m
    input_series:
      - series: 'ambit_agent_stop_policy_degraded{namespace="ambit-system"}'
        values: '0x3 1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: AmbitStopPolicyDegraded
        exp_alerts: []
      - eval_time: 7m
        alertname: AmbitStopPolicyDegraded
        exp_alerts:
          - exp_labels: { severity: critical, namespace: ambit-system }
            exp_annotations:
              summary: "The stop list was not turned into gateway policies"
              description: "The last stop policies stay in force, but new stops are not applied. Read why: kubectl -n ambit-system get configmap ambit-agent-stops-ack -o yaml (field degraded). A list over 1,000 entries or an unreadable list is the usual cause."
  # OAuth: no ready Hydra pod for 2 minutes fires; one ready pod does not.
  - interval: 1m
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="ambit-system",statefulset="ambit-hydra"}'
        values: '2x3 0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: AmbitHydraNotReady
        exp_alerts: []
      - eval_time: 7m
        alertname: AmbitHydraNotReady
        exp_alerts:
          - exp_labels: { severity: critical, namespace: ambit-system, statefulset: ambit-hydra }
            exp_annotations:
              summary: "No Hydra pod is ready: nobody can connect a platform or refresh a connection"
              description: "Calls with an access token that was already issued work for up to 15 minutes. Hydra is not ready when its database does not answer: check the database first, then kubectl -n ambit-system logs ambit-hydra-0 -c hydra and -c check-database (docs/oauth.md, Operations: Outage)."
  # OAuth: 5xx on Hydra's public endpoints. 20% for more than 5 minutes fires; 1% does not; 100% of a trickle (0.01 a second) does not.
  - interval: 1m
    input_series:
      - series: 'agentgateway_requests_total{namespace="ambit-system",pod="gw-1",route="ambit-system/ambit-auth-hydra",status="200"}'
        values: '0+48x30'
      - series: 'agentgateway_requests_total{namespace="ambit-system",pod="gw-1",route="ambit-system/ambit-auth-hydra",status="503"}'
        values: '0+12x30'
      - series: 'agentgateway_requests_total{namespace="ambit-system",pod="gw-2",route="ambit-system/ambit-auth-hydra",status="200"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: AmbitOAuthTokenErrors
        exp_alerts: []
      - eval_time: 15m
        alertname: AmbitOAuthTokenErrors
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "More than 5% of the requests to Hydra's public endpoints (/oauth2/token, /oauth2/revoke, the key list) answer 5xx"
              description: "People cannot connect a platform, and connections cannot refresh. Look at Hydra and its database: kubectl -n ambit-system get pods -l app.kubernetes.io/name=ambit-hydra; kubectl -n ambit-system logs ambit-hydra-0 -c hydra."
  - interval: 1m
    input_series:
      - series: 'agentgateway_requests_total{namespace="ambit-system",pod="gw-1",route="ambit-system/ambit-auth-hydra",status="200"}'
        values: '0+99x30'
      - series: 'agentgateway_requests_total{namespace="ambit-system",pod="gw-1",route="ambit-system/ambit-auth-hydra",status="500"}'
        values: '0+1x30'
      - series: 'agentgateway_requests_total{namespace="ambit-system",pod="gw-2",route="ambit-system/ambit-auth-hydra",status="503"}'
        values: '0+0.6x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AmbitOAuthTokenErrors
        exp_alerts: []
  # OAuth: a failed janitor job fires at once; a successful run less than two days ago does not fire, one from three days ago does (after an hour).
  - interval: 1m
    input_series:
      - series: 'kube_job_status_failed{namespace="ambit-system",job_name="ambit-hydra-janitor-29000"}'
        values: '0x120 1x120'
      - series: 'kube_job_status_failed{namespace="ambit-system",job_name="ambit-hydra-janitor-29001"}'
        values: '1x240'
      - series: 'kube_job_status_succeeded{namespace="ambit-system",job_name="ambit-hydra-janitor-29001"}'
        values: '1x240'
      - series: 'kube_cronjob_status_last_successful_time{namespace="ambit-system",cronjob="ambit-hydra-janitor"}'
        values: '0x3700'
      # a second CronJob that never succeeded (no last-success series), created at time 0
      - series: 'kube_cronjob_created{namespace="ambit-system",cronjob="ambit-hydra-janitor"}'
        values: '0x3700'
    alert_rule_test:
      - eval_time: 1h
        alertname: AmbitHydraJanitorFailed
        exp_alerts: []
      - eval_time: 3h
        alertname: AmbitHydraJanitorFailed
        exp_alerts:
          - exp_labels: { severity: warning, namespace: ambit-system, job_name: ambit-hydra-janitor-29000 }
            exp_annotations:
              summary: "The clean-up of Hydra's database failed (ambit-hydra-janitor-29000)"
              description: "Expired tokens stay in the database until it runs again. Read why: kubectl -n ambit-system logs job/ambit-hydra-janitor-29000. The usual cause is the database address or password."
      - eval_time: 5h
        alertname: AmbitHydraJanitorStale
        exp_alerts: []
      - eval_time: 10h
        alertname: AmbitHydraJanitorStale
        exp_alerts:
          - exp_labels: { severity: warning, namespace: ambit-system, cronjob: ambit-hydra-janitor }
            exp_annotations:
              summary: "The clean-up of Hydra's database has not succeeded for 6 hours"
              description: "kubectl -n ambit-system get cronjob ambit-hydra-janitor; kubectl -n ambit-system get jobs. The database grows until it runs again."
  # OAuth: the database's own metrics, named by alerts.oauth: a backup older than 26 hours, and more than 80% of the connections.
  - interval: 1m
    input_series:
      - series: 'backup_age_seconds{instance="db"}'
        values: '90000x5 94000x30'
      - series: 'connections_used_ratio{instance="db"}'
        values: '0.5x5 0.9x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: AmbitOAuthDatabaseBackupOld
        exp_alerts: []
      - eval_time: 25m
        alertname: AmbitOAuthDatabaseBackupOld
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "The newest backup of Hydra's database is older than 26 hours"
              description: "Without a recent backup a restore loses the connections made since (they connect again). docs/oauth.md, Operations: Backup. The expression comes from alerts.oauth.backupAgeSecondsExpr."
      - eval_time: 3m
        alertname: AmbitOAuthDatabaseConnectionsHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: AmbitOAuthDatabaseConnectionsHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Hydra and other clients use more than 80% of the database's connections"
              description: "Hydra takes at most (pods x max_conns) connections, and the janitor or a migration one more run (docs/oauth.md, Operations: Pool sizing). The expression comes from alerts.oauth.connectionsUsedRatioExpr."
  # OAuth: a clean-up CronJob that never succeeded has no last-success series: it still fires once it is older than the limit.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="ambit-system",cronjob="ambit-hydra-janitor"}'
        values: '0x3700'
    alert_rule_test:
      - eval_time: 5h
        alertname: AmbitHydraJanitorStale
        exp_alerts: []
      - eval_time: 10h
        alertname: AmbitHydraJanitorStale
        exp_alerts:
          - exp_labels: { severity: warning, namespace: ambit-system, cronjob: ambit-hydra-janitor }
            exp_annotations:
              summary: "The clean-up of Hydra's database has not succeeded for 6 hours"
              description: "kubectl -n ambit-system get cronjob ambit-hydra-janitor; kubectl -n ambit-system get jobs. The database grows until it runs again."
