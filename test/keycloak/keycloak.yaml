# Test identity provider for step 2. NOT part of the Ambit package; stands in for a customer's Okta.
# Test-only credentials: priya/priya-test-pass (ambit-admins), sam/sam-test-pass (ambit-approvers),
# alice/alice-test-pass (eng), mira/mira-test-pass (ml-research). Keycloak admin: admin/admin.
# Client ambit-cli-test: password grant for tests only; access tokens carry groups and aud=ambit-gateway.
# Realm saas (step 5) stands in for a SaaS app such as Jira: its own accounts alice/alice-saas-pass and
# mira/mira-saas-pass, and the confidential client ambit-connect that Ambit's Connection uses (password grant on, so a test can get a token with the whoami audience).
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  acme-realm.json: |
    {
      "realm": "acme",
      "enabled": true,
      "sslRequired": "none",
      "groups": [
        {
          "name": "ambit-admins"
        },
        {
          "name": "ambit-approvers"
        },
        {
          "name": "eng"
        },
        {
          "name": "ml-research"
        }
      ],
      "clients": [
        {
          "clientId": "ambit-dex",
          "enabled": true,
          "publicClient": false,
          "secret": "keycloak-test-client-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "http://console.localtest.me:8080/dex/callback"
          ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "ambit-cli-test",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "gateway-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.custom.audience": "ambit-gateway",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "priya",
          "email": "priya@acme.test",
          "emailVerified": true,
          "firstName": "Priya",
          "lastName": "Test",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "priya-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/ambit-admins"
          ]
        },
        {
          "username": "sam",
          "email": "sam@acme.test",
          "emailVerified": true,
          "firstName": "Sam",
          "lastName": "Test",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "sam-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/ambit-approvers"
          ]
        },
        {
          "username": "alice",
          "email": "alice@acme.test",
          "emailVerified": true,
          "firstName": "Alice",
          "lastName": "Test",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "alice-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/eng"
          ]
        },
        {
          "username": "mira",
          "email": "mira@acme.test",
          "emailVerified": true,
          "firstName": "Mira",
          "lastName": "Test",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "mira-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/ml-research"
          ]
        }
      ]
    }
  saas-realm.json: |
    {
      "realm": "saas",
      "enabled": true,
      "sslRequired": "none",
      "clients": [
        {
          "clientId": "ambit-connect",
          "enabled": true,
          "publicClient": false,
          "secret": "saas-test-client-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "attributes": { "pkce.code.challenge.method": "S256" },
          "redirectUris": ["http://console.localtest.me:8080/connections/callback"],
          "protocolMappers": [
            { "name": "whoami-audience", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper",
              "config": { "included.custom.audience": "http://whoami.ambit-system.svc:8080/mcp", "access.token.claim": "true", "id.token.claim": "false" } }
          ]
        },
        {
          "clientId": "other-app",
          "enabled": true,
          "publicClient": false,
          "secret": "other-app-secret",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "protocolMappers": [
            { "name": "other-audience", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper",
              "config": { "included.custom.audience": "http://other.test/mcp", "access.token.claim": "true", "id.token.claim": "false" } }
          ]
        }
      ],
      "users": [
        { "username": "alice", "email": "alice@saas.test", "emailVerified": true, "firstName": "Alice", "lastName": "SaaS", "enabled": true,
          "credentials": [{ "type": "password", "value": "alice-saas-pass", "temporary": false }] },
        { "username": "mira", "email": "mira@saas.test", "emailVerified": true, "firstName": "Mira", "lastName": "SaaS", "enabled": true,
          "credentials": [{ "type": "password", "value": "mira-saas-pass", "temporary": false }] }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-dex-client
stringData:
  secret: keycloak-test-client-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: { app.kubernetes.io/name: keycloak }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: keycloak } }
  template:
    metadata: { labels: { app.kubernetes.io/name: keycloak } }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.4
          args: [start-dev, --import-realm, --hostname=http://keycloak.localtest.me:8080, --health-enabled=true]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
          ports: [{ name: http, containerPort: 8080 }, { name: mgmt, containerPort: 9000 }]
          readinessProbe:
            httpGet: { path: /health/ready, port: mgmt }
            periodSeconds: 5
          volumeMounts: [{ name: realm, mountPath: /opt/keycloak/data/import }]
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
      volumes: [{ name: realm, configMap: { name: keycloak-realm } }]
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
spec:
  parentRefs: [{ name: ambit }]
  hostnames: [keycloak.localtest.me]
  rules:
    - backendRefs: [{ name: keycloak, port: 8080 }]
