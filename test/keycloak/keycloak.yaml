# Test identity provider for step 2. NOT part of the Ambit package; stands in for a customer's Okta.
# The realm's user profile makes email optional, so user noemail can get a token without an email claim.
# Test-only credentials: user10/user10-test-pass (ambit-admins), user11/user11-test-pass (ambit-approvers),
# user01/user01-test-pass (eng), user09/user09-test-pass (ml-research), noemail/noemail-test-pass (eng, no email), keytest/keytest-test-pass (eng; the key tests' offboarding user). Keycloak admin: admin/admin.
# Client ambit-cli-test: password grant for tests only; access tokens carry groups and aud=ambit-gateway.
# Realm saas (step 5) stands in for a SaaS app such as Jira: its own accounts user01/user01-saas-pass and
# user09/user09-saas-pass, and the confidential client ambit-connect that Ambit's Connection uses (password grant on, so a test can get a token with the whoami audience).
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  acme-realm.json: |
    {
      "realm": "acme",
      "enabled": true,
      "sslRequired": "none",
      "components": {"org.keycloak.userprofile.UserProfileProvider": [{"providerId": "declarative-user-profile", "config": {"kc.user.profile.config": ["{\"attributes\": [{\"name\": \"username\", \"displayName\": \"${username}\", \"validations\": {\"length\": {\"min\": 3, \"max\": 255}, \"username-prohibited-characters\": {}, \"up-username-not-idn-homograph\": {}}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"email\", \"displayName\": \"${email}\", \"validations\": {\"email\": {}, \"length\": {\"max\": 255}}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"firstName\", \"displayName\": \"${firstName}\", \"validations\": {\"length\": {\"max\": 255}}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"lastName\", \"displayName\": \"${lastName}\", \"validations\": {\"length\": {\"max\": 255}}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}]}"]}}]},
      "groups": [
        {
          "name": "ambit-admins"
        },
        {
          "name": "ambit-approvers"
        },
        {
          "name": "eng"
        },
        {
          "name": "ml-research"
        }
      ],
      "clients": [
        {
          "clientId": "ambit-dex",
          "enabled": true,
          "publicClient": false,
          "secret": "keycloak-test-client-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "http://console.localtest.me:8080/dex/callback"
          ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "ambit-cli-test",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "gateway-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.custom.audience": "ambit-gateway",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "user10",
          "email": "user10@example.com",
          "emailVerified": true,
          "firstName": "User10",
          "lastName": "Test",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "user10-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/ambit-admins"
          ]
        },
        {
          "username": "user11",
          "email": "user11@example.com",
          "emailVerified": true,
          "firstName": "User11",
          "lastName": "Test",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "user11-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/ambit-approvers"
          ]
        },
        {
          "username": "noemail",
          "emailVerified": true,
          "firstName": "No",
          "lastName": "Email",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "noemail-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/eng"
          ]
        },
        {
          "username": "keytest",
          "email": "keytest@example.com",
          "emailVerified": true,
          "firstName": "Key",
          "lastName": "Test",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "keytest-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/eng"
          ]
        },
        {
          "username": "user01",
          "email": "user01@example.com",
          "emailVerified": true,
          "firstName": "User01",
          "lastName": "Test",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "user01-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/eng"
          ]
        },
        {
          "username": "user09",
          "email": "user09@example.com",
          "emailVerified": true,
          "firstName": "User09",
          "lastName": "Test",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "user09-test-pass",
              "temporary": false
            }
          ],
          "groups": [
            "/ml-research"
          ]
        }
      ]
    }
  saas-realm.json: |
    {
      "realm": "saas",
      "enabled": true,
      "sslRequired": "none",
      "clients": [
        {
          "clientId": "ambit-connect",
          "enabled": true,
          "publicClient": false,
          "secret": "saas-test-client-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "attributes": { "pkce.code.challenge.method": "S256" },
          "redirectUris": ["http://console.localtest.me:8080/connections/callback"],
          "protocolMappers": [
            { "name": "whoami-audience", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper",
              "config": { "included.custom.audience": "http://whoami.ambit-system.svc:8080/mcp", "access.token.claim": "true", "id.token.claim": "false" } }
          ]
        },
        {
          "clientId": "other-app",
          "enabled": true,
          "publicClient": false,
          "secret": "other-app-secret",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "protocolMappers": [
            { "name": "other-audience", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper",
              "config": { "included.custom.audience": "http://other.test/mcp", "access.token.claim": "true", "id.token.claim": "false" } }
          ]
        }
      ],
      "users": [
        { "username": "user01", "email": "user01@saas.test", "emailVerified": true, "firstName": "User01", "lastName": "SaaS", "enabled": true,
          "credentials": [{ "type": "password", "value": "user01-saas-pass", "temporary": false }] },
        { "username": "user09", "email": "user09@saas.test", "emailVerified": true, "firstName": "User09", "lastName": "SaaS", "enabled": true,
          "credentials": [{ "type": "password", "value": "user09-saas-pass", "temporary": false }] }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-dex-client
stringData:
  secret: keycloak-test-client-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: { app.kubernetes.io/name: keycloak }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: keycloak } }
  template:
    metadata: { labels: { app.kubernetes.io/name: keycloak } }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.4
          args: [start-dev, --import-realm, --hostname=http://keycloak.localtest.me:8080, --health-enabled=true]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
          ports: [{ name: http, containerPort: 8080 }, { name: mgmt, containerPort: 9000 }]
          readinessProbe:
            httpGet: { path: /health/ready, port: mgmt }
            periodSeconds: 5
          volumeMounts: [{ name: realm, mountPath: /opt/keycloak/data/import }]
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
      volumes: [{ name: realm, configMap: { name: keycloak-realm } }]
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
spec:
  parentRefs: [{ name: ambit }]
  hostnames: [keycloak.localtest.me]
  rules:
    - backendRefs: [{ name: keycloak, port: 8080 }]
