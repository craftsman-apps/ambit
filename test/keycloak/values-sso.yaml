# Step 2 test: connect Ambit to the Keycloak test IdP (test/keycloak/keycloak.yaml).
sso:
  connectors:
    - type: oidc
      id: keycloak
      name: Acme (Keycloak)
      config:
        issuer: http://keycloak.localtest.me:8080/realms/acme
        clientID: ambit-dex
        clientSecret: $KEYCLOAK_CLIENT_SECRET
        redirectURI: http://console.localtest.me:8080/dex/callback
        scopes: [profile, email]   # Dex always adds openid
        insecureEnableGroups: true
dex:
  envVars:
    - name: KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef: { name: keycloak-dex-client, key: secret }

# Step 3: LLM traffic with tokens from the same Keycloak test realm (client ambit-cli-test, aud ambit-gateway).
llm:
  enabled: true
  host: llm.localtest.me
  jwt:
    issuer: http://keycloak.localtest.me:8080/realms/acme
    audiences: [ambit-gateway]
    jwksURL: http://keycloak.localtest.me:8080/realms/acme/protocol/openid-connect/certs

# Step 4a: MCP traffic with tokens from the same realm and audience.
mcp:
  enabled: true
  host: mcp.localtest.me
  jwt:
    issuer: http://keycloak.localtest.me:8080/realms/acme
    audiences: [ambit-gateway]
    jwksURL: http://keycloak.localtest.me:8080/realms/acme/protocol/openid-connect/certs
