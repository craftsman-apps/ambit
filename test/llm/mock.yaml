# Test only: an OpenAI-compatible server that answers every chat completion with fixed usage (12 input,
# 3 output tokens), streamed or not; like OpenAI, a stream carries usage only with stream_options.include_usage. Tests use it instead of a real provider where they need a successful
# answer (token counts, cost), so they do not depend on a provider's free quota. The answer names any
# X-Ambit-User header it received, so a test can check that clients cannot pass one through.
apiVersion: v1
kind: ConfigMap
metadata: { name: mock-llm }
data:
  server.py: |
    import json, http.server, time
    USAGE = {"prompt_tokens": 12, "completion_tokens": 3, "total_tokens": 15}
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers.get("content-length", 0))) or b"{}")
            model = body.get("model")
            last = (body.get("messages") or [{}])[-1].get("content", "")
            text = last if isinstance(last, str) else ""  # a multi-part message has a list content
            if self.path.endswith("/embeddings"):
                out = json.dumps({"object": "list", "model": model, "data": [{"object": "embedding", "index": 0, "embedding": [0.1, 0.2]}],
                                  "usage": {"prompt_tokens": 12, "total_tokens": 12}}).encode()
                self.send_response(200); self.send_header("content-type", "application/json"); self.send_header("content-length", str(len(out)))
                self.end_headers(); self.wfile.write(out); return
            if text.endswith("CUT") and body.get("stream"):
                self.send_response(200); self.send_header("content-type", "text/event-stream"); self.end_headers()
                self.wfile.write(b'data: {"id":"c1","object":"chat.completion.chunk","model":"' + model.encode() + b'","choices":[{"index":0,"delta":{"content":"po"}}]}\n\n')
                self.wfile.flush(); self.close_connection = True; return
            if text == "SLOW" and body.get("stream"):  # usage 25 s after the first chunk (a price change in between)
                self.send_response(200); self.send_header("content-type", "text/event-stream"); self.end_headers()
                for chunk, wait in (({"choices": [{"index": 0, "delta": {"content": "pong"}}]}, 25), ({"choices": [], "usage": USAGE}, 0)):
                    chunk.update({"id": "c1", "object": "chat.completion.chunk", "model": model})
                    self.wfile.write(b"data: " + json.dumps(chunk).encode() + b"\n\n"); self.wfile.flush(); time.sleep(wait)
                self.wfile.write(b"data: [DONE]\n\n")
                return
            usage = None if text == "NO-USAGE" else USAGE
            content = "pong" + (" x-ambit-user=" + self.headers["x-ambit-user"] if self.headers.get("x-ambit-user") else "") + (" x-ambit-route=" + self.headers["x-ambit-route"] if self.headers.get("x-ambit-route") else "")
            if body.get("user") == "load":  # load runs (test/load): a fixed 50 ms before the first token
                time.sleep(0.05)
            if body.get("stream"):
                self.send_response(200); self.send_header("content-type", "text/event-stream"); self.end_headers()
                if not (body.get("stream_options") or {}).get("include_usage"):
                    usage = None
                for chunk in ({"choices": [{"index": 0, "delta": {"content": "pong"}}]}, {"choices": [], **({"usage": usage} if usage else {})}):
                    chunk.update({"id": "c1", "object": "chat.completion.chunk", "model": model})
                    self.wfile.write(b"data: " + json.dumps(chunk).encode() + b"\n\n")
                self.wfile.write(b"data: [DONE]\n\n")
                return
            out = json.dumps({"id": "c1", "object": "chat.completion", "model": model, **({"usage": usage} if usage else {}),
                              "choices": [{"index": 0, "message": {"role": "assistant", "content": content}, "finish_reason": "stop"}]}).encode()
            self.send_response(200); self.send_header("content-type", "application/json"); self.send_header("content-length", str(len(out)))
            self.end_headers(); self.wfile.write(out)
    http.server.ThreadingHTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mock-llm }
spec:
  selector: { matchLabels: { app: mock-llm } }
  template:
    metadata: { labels: { app: mock-llm } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534 }
      containers:
        - name: mock
          image: python@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f  # python:3.13-alpine
          command: [python, /app/server.py]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: mock-llm } }]
---
apiVersion: v1
kind: Service
metadata: { name: mock-llm }
spec:
  selector: { app: mock-llm }
  ports: [{ port: 8080 }]
---
apiVersion: ambitproject.dev/v1alpha1
kind: Model
metadata: { name: mock-echo }
spec:
  displayName: Test model (fixed answer, priced)
  provider: OpenAI
  model: mock/echo
  baseURL: http://mock-llm.ambit-system.svc.cluster.local:8080/v1
  credentialsRef: { name: ambit-llm-mock }
  price: { inputPerMillionTokens: "1.00", outputPerMillionTokens: "4.00" }
---
apiVersion: ambitproject.dev/v1alpha1
kind: AccessRule
metadata: { name: ml-research-mock }
spec:
  groups: [ml-research]
  models: [mock-echo]
---
apiVersion: ambitproject.dev/v1alpha1
kind: Model
metadata: { name: mock-unpriced }
spec:
  displayName: Test model (no price)
  provider: OpenAI
  model: mock/unpriced
  baseURL: http://mock-llm.ambit-system.svc.cluster.local:8080/v1
  credentialsRef: { name: ambit-llm-mock }
---
apiVersion: ambitproject.dev/v1alpha1
kind: AccessRule
metadata: { name: everyone-mock-unpriced }
spec:
  allSignedIn: true
  models: [mock-unpriced]
---
apiVersion: ambitproject.dev/v1alpha1
kind: Model
metadata: { name: mock-free }
spec:
  displayName: Test model (free)
  provider: OpenAI
  model: mock/free
  baseURL: http://mock-llm.ambit-system.svc.cluster.local:8080/v1
  credentialsRef: { name: ambit-llm-mock }
  price: { inputPerMillionTokens: "0", outputPerMillionTokens: "0" }
---
apiVersion: ambitproject.dev/v1alpha1
kind: AccessRule
metadata: { name: ml-research-mock-free }
spec:
  groups: [ml-research]
  models: [mock-free]
