# PostgreSQL 17 and 15 with TLS only, for test/stepoauth.sh. Test only: no volume (the data is lost with the pod), a
# superuser password from a Secret the step creates, a certificate the step makes. A real database is yours to run
# (docs/oauth.md, "PostgreSQL").
apiVersion: v1
kind: ConfigMap
metadata: { name: ambit-pg-hba, labels: { ambitproject.dev/oauth-test: "true" } }
data:
  pg_hba.conf: |
    local all all trust
    hostssl all all 0.0.0.0/0 scram-sha-256
    hostnossl all all 0.0.0.0/0 reject
---
apiVersion: v1
kind: Service
metadata: { name: ambit-pg17, labels: { ambitproject.dev/oauth-test: "true" } }
spec:
  selector: { app: ambit-pg17 }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: ambit-pg17, labels: { ambitproject.dev/oauth-test: "true" } }
spec:
  serviceName: ambit-pg17
  replicas: 1
  selector: { matchLabels: { app: ambit-pg17 } }
  template:
    metadata: { labels: { app: ambit-pg17 } }
    spec:
      initContainers:
        - name: tls-perms   # PostgreSQL refuses a key file that others can read
          image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
          command: [sh, -c, "cp /in/tls.crt /in/tls.key /pgtls/ && chown 70:70 /pgtls/* && chmod 600 /pgtls/tls.key"]
          volumeMounts: [{ name: tls-in, mountPath: /in }, { name: tls, mountPath: /pgtls }]
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
          args: [-c, ssl=on, -c, ssl_cert_file=/pgtls/tls.crt, -c, ssl_key_file=/pgtls/tls.key, -c, hba_file=/etc/pghba/pg_hba.conf, -c, max_connections=60]
          env:
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: ambit-pg-superuser, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, postgres, -h, 127.0.0.1] }, periodSeconds: 2 }
          resources: { requests: { memory: 64Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }, { name: tls, mountPath: /pgtls }, { name: hba, mountPath: /etc/pghba }]
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tls-in, secret: { secretName: ambit-pg-tls } }
        - { name: tls, emptyDir: {} }
        - { name: hba, configMap: { name: ambit-pg-hba } }
---
apiVersion: v1
kind: Service
metadata: { name: ambit-pg15, labels: { ambitproject.dev/oauth-test: "true" } }
spec:
  selector: { app: ambit-pg15 }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: ambit-pg15, labels: { ambitproject.dev/oauth-test: "true" } }
spec:
  serviceName: ambit-pg15
  replicas: 1
  selector: { matchLabels: { app: ambit-pg15 } }
  template:
    metadata: { labels: { app: ambit-pg15 } }
    spec:
      initContainers:
        - name: tls-perms   # PostgreSQL refuses a key file that others can read
          image: postgres:15-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
          command: [sh, -c, "cp /in/tls.crt /in/tls.key /pgtls/ && chown 70:70 /pgtls/* && chmod 600 /pgtls/tls.key"]
          volumeMounts: [{ name: tls-in, mountPath: /in }, { name: tls, mountPath: /pgtls }]
      containers:
        - name: postgres
          image: postgres:15-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
          args: [-c, ssl=on, -c, ssl_cert_file=/pgtls/tls.crt, -c, ssl_key_file=/pgtls/tls.key, -c, hba_file=/etc/pghba/pg_hba.conf, -c, max_connections=60]
          env:
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: ambit-pg-superuser, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, postgres, -h, 127.0.0.1] }, periodSeconds: 2 }
          resources: { requests: { memory: 64Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }, { name: tls, mountPath: /pgtls }, { name: hba, mountPath: /etc/pghba }]
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tls-in, secret: { secretName: ambit-pg-tls } }
        - { name: tls, emptyDir: {} }
        - { name: hba, configMap: { name: ambit-pg-hba } }
